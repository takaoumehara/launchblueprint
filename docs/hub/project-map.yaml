# Blueprint Hub — project map (shape: elements/project-map.template.yaml) — CREATIVITY IS EVERYWHERE, LLC
# Generated with draft_project_map on 2026-11-04, then edited by hand. Owner decides; see hub_decisions for the decisions the brief made.
domain: project_map
name: Blueprint Hub (hosted MCP)
goal: >-
  One central hosted Blueprint MCP server that bots, friends' AIs and later public users connect to after consenting to terms; it serves the
  catalog and collects in-flow learnings as 4-layer submissions reviewed before merge.
profile:
  audience: public
  platform: web
  money: free
  country: global
elements:
  - el.experience
  - el.product
  - el.business
  - el.marketing
  - el.brand
  - el.maintenance
  - el.security
choices:
  - element: el.product
    topic: database
    stage: launch
    lane: tech
    label_ja: データの置き場所
    status: open
    options:
      - db.supabase
      - db.firestore
      - db.neon
    ai_pick: db.neon
    reason: >-
      Options list has no Cloudflare D1; of the listed options Neon (serverless Postgres, scale-to-zero, no pause) is the fallback if D1 is
      outgrown. Proposed addition: db.cloudflare-d1 (see proposed_catalog_additions).
    rejected:
      - option: db.supabase
        why: see get_comparison
      - option: db.firestore
        why: 表どうしをつないで集計したい時（売上の一覧など）、あとで別の場所へ移したい時
    decided_by: ''
    pick: ''
    depends_on:
      - build_vs_buy
    last_checked: '2026-10-28'
  - element: el.product
    topic: analytics
    stage: launch
    lane: ux
    label_ja: 使われ方の計測
    status: open
    options:
      - an.posthog
      - an.vercel-analytics
    ai_pick: an.posthog
    reason: For the consent/key pages only. MCP calls are logged as counts per key, not as product analytics; no PII in events.
    rejected:
      - option: an.vercel-analytics
        why: どの画面で離れたかなど、使われ方を細かく見たい時
    decided_by: ''
    pick: ''
    depends_on:
      - hosting
    last_checked: '2026-10-28'
