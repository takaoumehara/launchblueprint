version: '2026-11-04'
owner: CREATIVITY IS EVERYWHERE, LLC
source_of_decisions: owner brief 2026-11-04
how_to_read: >-
  Produced by the MCP tool draft_project_map(profile) on 2026-11-04 and then edited: status decided/deferred only where the owner's brief
  determines it; everything else is open with an ai_pick and a reason. Nothing here is a decision until the owner says so.
hub_decisions:
  - id: hub.topology
    decision: >-
      One central hosted MCP server. All bots, friends' AIs and later public users connect to the same endpoint; the catalog they read is
      one commit of this repository.
    decided_by: human
    source: owner brief 2026-11-04
    rejected:
      - option: Each user runs the stdio server locally (status quo)
        why: No shared learning intake, no occurrence counting across submitters, stale catalogs.
      - option: Per-tenant servers
        why: Multiplies auth, deploys and review queues; nothing to count across.
  - id: hub.access
    decision: >-
      Access only after the user has agreed to the terms. Two credential types issued after consent: OAuth 2.1 tokens (human-driven MCP
      clients) and API keys (headless bots). Both are bound to the terms version accepted.
    decided_by: human
    source: owner brief 2026-11-04
  - id: hub.intake_in_flow
    decision: >-
      Learnings are captured in-flow at each stage gate: the AI asks 'what happened that was not planned?' and 'what would you have needed
      to know?' and submits right then. No batch retrospectives, no scheduled collection.
    decided_by: human
    source: owner brief 2026-11-04
    evidence:
      - Batch requests produced input exactly once.
      - Daily collection was mostly empty.
  - id: hub.four_layers
    decision: >-
      Every submission keeps four layers: (1) principle / anti-pattern / one-line why / yes-no check; (2) concrete facts as claims to
      verify, kept not discarded, verified against a primary source before entering the catalog with source + checked date, unverifiable
      ones stay 'unverified' and are prioritised by count; (3) context (stage, stack type, product type, cost in days/money) with names
      stripped; (4) occurrence count across submitters. Project-specific taste is dropped.
    decided_by: human
    source: owner brief 2026-11-04
    evidence:
      - Concrete facts were the most valuable part of lessons.
      - 21 lessons carry verified:true with a text note as source and no URL (catalog/foresight.yaml, counted 2026-11-04).
  - id: hub.merge_gates
    decision: >-
      Before anything enters core: corroboration across submitters, no contradiction with existing items, spam / PII / promo filter. Single
      high-stakes items (legal, security, money) go to owner review even without corroboration.
    decided_by: human
    source: owner brief 2026-11-04
  - id: hub.review_mode
    decision: >-
      Start fully human-reviewed. Move about half of the gates to automation later (schema, PII/secret scan, fingerprint dedup, occurrence
      counting, source-URL reachability); keep contradiction judgement, pick changes and legal items human.
    decided_by: human
    source: owner brief 2026-11-04
  - id: hub.rollout
    decision: 'Phases: bots (own agents) → friends (invited) → public. Each phase has numeric exit criteria (docs/hub/DESIGN.md §10).'
    decided_by: human
    source: owner brief 2026-11-04
  - id: hub.stack
    decision: >-
      Cloudflare Workers (Agents SDK createMcpHandler, workers-oauth-provider, D1, Queues, KV, R2) for the MCP server; the app UI stays on
      Vercel. R-030 comparison: docs/hub/stack-comparison.yaml.
    decided_by: ai
    status: proposed — owner said this was the expected outcome; confirm before any resource is created
    source: design 2026-11-04
  - id: hub.terms_legal_review
    decision: >-
      docs/hub/TERMS-draft.md is a draft and is not published until counsel has reviewed the flagged items (contribution licence, privacy
      notice, governing law, age limit, data deletion vs. occurrence counts).
    decided_by: human
    source: owner brief 2026-11-04
proposed_catalog_additions:
  - id: host.cloudflare-workers-mcp
    domain: hosting
    why: Hosting option for an MCP server; the existing host.cloudflare-pages row describes static sites.
  - id: auth.workers-oauth-provider
    domain: auth
    why: >-
      OAuth 2.1 authorization + resource server library for Workers (RFC 9728, PKCE, RFC 8707, CIMD, DCR). Pin >= 0.0.5 (CVE-2025-4143,
      CVE-2025-4144).
  - id: db.cloudflare-d1
    domain: database
    why: SQLite at the edge, 5 GB free, 100k rows written/day free.
  - id: queue.cloudflare-queues
    domain: backend
    why: 10k ops/day free, 24 h retention on Free.
  - id: cc.cloudflare-billing-alert
    domain: cost_control
    why: Cloudflare has billing notifications but no hard spend cap; write that down as a cost_rules check.
  - id: lesson hub.verified-needs-url
    domain: freshness
    why: verified:true requires a primary-source URL and a checked date; a text note is not a source.
  - id: lesson hub.claims-stay-unverified
    domain: freshness
    why: Concrete facts enter as claims with verified:false and are never promoted by the submitter.
  - id: lesson hub.capture-at-gate
    domain: lifecycle
    why: Ask for surprises at each stage gate, not in a retrospective; batch asks produce one answer.
  - id: lesson hub.oauth-kv-write-cap
    domain: auth
    why: >-
      On Workers Free, KV allows 1,000 writes/day; each OAuth grant costs several writes, so a login-heavy day hits the cap before the
      request cap.
  - id: lesson hub.mcp-sessionless
    domain: backend
    why: MCP 2026-07-28 removed protocol sessions; keep per-user state keyed by the authenticated user, never by a session id.
learnings:
  - Concrete facts were the most valuable part of lessons (owner, local experience).
  - 21 lessons claimed verified with no URL source (catalog/foresight.yaml, 2026-11-04 count).
  - Batch requests for lessons produced input once; daily collection was mostly empty.
  - >-
    McpAgent is deprecated and feature-frozen (Agents SDK v0.20.0); design on createMcpHandler + MCP SDK v2 (spec 2026-07-28, no sessions,
    Streamable HTTP only). Found 2026-11-04 while comparing stacks.
  - >-
    The MCP authorization spec requires RFC 9728 metadata, audience validation and no token passthrough; API keys are fine as long as the
    server itself validates them and never forwards them.
