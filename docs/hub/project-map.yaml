  - element: el.security
    topic: auth
    stage: launch
    lane: tech
    label_ja: ログイン
    status: open
    options:
      - auth.supabase
      - auth.firebase
      - auth.clerk
      - auth.auth0
      - auth.better-auth
      - auth.authjs
      - auth.stytch
      - auth.passkeys
      - auth.magic
    ai_pick: auth.better-auth
    reason: >-
      None of the listed options is an MCP OAuth 2.1 authorization server. Proposed addition: auth.workers-oauth-provider. Of the listed
      options, a self-hosted library (Better Auth) is closest in shape; a vendor (Stytch) is the switch point when enterprise SSO is asked
      for.
    rejected:
      - option: auth.supabase
        why: see get_comparison
      - option: auth.firebase
        why: データの置き場所が Supabase の時（2か所に分かれる）
      - option: auth.clerk
        why: 無料・低単価で大量ユーザーの B2C（公式FAQも Supabase/Firebase を勧める）
      - option: auth.auth0
        why: 無料枠を超えて伸びる B2C（MAU 段階で急に高くなる）
      - option: auth.authjs
        why: パスワード・二段階認証・管理画面まで要る時。公式が「Better Auth の一部になった」と案内しているため、新規なら Better Auth も並べて比べる
      - option: auth.stytch
        why: see get_comparison
      - option: auth.passkeys
        why: 端末をなくした時の復旧手段がない
      - option: auth.magic
        why: 普通のウェブのログイン（今は財布向けの料金体系）
    decided_by: ''
    pick: ''
    depends_on:
      - database
    last_checked: '2026-10-28'
