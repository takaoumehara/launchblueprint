    paid_entry: 同左（量が増えたら個別料金）
    url: https://www.paddle.com/pricing
    checked: '2026-11-02'
    verified: true
  combine:
    single: 1 つの国・1 つの言語・自社決済で始めると、作る量・法務・税が最小。
    combined: コードは初日から日英（i18n の骨組みだけ）、販売は MoR に任せ、出す順は反応で決める（cross_border.yaml の recommendation）。
    risks: 後付けの i18n は全画面の作り直し（gate.i18n_keys）。MoR は $10 未満の商品で手数料率が高く、審査・規約変更のロックインがある。日本の消費者向けは特商法表記と消費税（国外事業者）を自分で確認。
  switch_points:
  - when: 提供言語が 2 つ以上になりうる（Intake の答え）
    upgrade_to: es.jp_en の作り方（文言はキー経由、i18n は初日）
    why: 後付けが最も高くつく。骨組みだけなら費用ゼロ。
  - when: 2 か国目で売上が立ち、税の登録義務が見えた
    upgrade_to: es.mor_first（Paddle 5%+50¢）
    why: 国ごとの登録・納税を 1 人で追うより安い。
  - when: 月の売上が増え、MoR の手数料差が税の外注費を上回った
    upgrade_to: Stripe ＋ Stripe Tax Complete
    why: 規模が出れば自社納税の方が安くなる。移行手順を exit 計画に書く。
  recommendation:
    pick: es.us_first
    reason: 作る量が一番少なく、反応を早く確かめられる。ただし文言は初日からキー経由にして（gate.i18n_keys）、2 か国目を安くする。
    rejected:
    - option: es.jp_en
      why: 日本の人が最初の利用者なら第一候補（pick_when）。ローンチ作業が 2 倍になる。
    - option: es.mor_first
      why: 最初から複数国に売るなら第一候補（pick_when）。$10 未満の商品は手数料率が高い。

- topic: backend
  services:
  - {id: be.route-handlers, free_tier: 'ホストの無料枠内。Vercel Hobby $0（個人・非商用のみ）：Active CPU 4 時間・メモリ 360 GB時・呼び出し 100万回/月。関数の最長 300 秒', paid_entry: 'Vercel Pro $20/月（$20 分のクレジット込み。超過は Active CPU $0.128/時・呼び出し $0.60/100万回）。最長 800 秒', url: 'https://vercel.com/pricing', checked: '2026-11-03', verified: true}
  - {id: be.cloud-run, free_tier: '無料枠（請求アカウント単位・月）：リクエスト 200万回・メモリ 360,000 GB秒・vCPU 180,000 秒・北米発送信 1 GB（リクエスト課金の場合）', paid_entry: '使った分だけ（単価は料金ページ本文が読めず未確認 2026-11-03）。リクエスト課金とインスタンス課金の 2 方式', url: 'https://docs.cloud.google.com/free/docs/free-cloud-features', checked: '2026-11-03', verified: true}
  - {id: be.supabase-edge, name: Supabase Edge Functions, free_tier: 'Supabase Free $0：Edge Functions 呼び出し 50 万回/月。1 週間使わないとプロジェクト停止', paid_entry: 'Pro $25/月〜：200 万回/月込み、超過 $2/100万回', url: 'https://supabase.com/pricing', checked: '2026-11-03', verified: true}
  - {id: be.cloudflare-workers, name: Cloudflare Workers, free_tier: 'Workers Free：10 万リクエスト/日・1 回あたり CPU 10 ms', paid_entry: 'Workers Paid $5/月〜：1,000 万リクエスト/月・CPU 3,000 万 ms/月込み。超過 $0.30/100万リクエスト・$0.02/100万 CPU ms', url: 'https://developers.cloudflare.com/workers/platform/pricing/', checked: '2026-11-03', verified: true}
  combine:
    single: 画面と同じ場所（Next.js の Route Handlers / Server Actions）に裏側も置く。契約・公開作業・環境変数が1つで、AI も一番書き慣れている。
    combined: 画面はホストに置き、長い処理・定期処理・別言語の処理だけを別の実行環境（コンテナや Workers）に出す。
    risks: 置き場所が2つになると、秘密情報・ログ・監視・公開作業が2重になる。認可の判断をどちらでするかを決めないと穴ができる。無料枠はそれぞれ別に数えるので、超えた時の挙動（止まる・課金）が違う。
  switch_points:
  - when: 1回の処理がホストの関数の制限時間を超える（動画変換・大量メール・長いAI呼び出し）
    upgrade_to: 長い処理だけコンテナ（Cloud Run 等）か、キューで分割
    why: 関数はタイムアウトで途中で切れる。1か所だけ外に出せば残りは同居のまま。
  - when: 定期処理（毎晩の集計・リマインド送信）が3つ以上になった
    upgrade_to: ホストの定期実行（cron）機能、または小さなワーカーを1つ
    why: 画面の裏に定期処理を混ぜると、失敗に気づけない。
  - when: 画面を持たないスマホアプリだけになった
    upgrade_to: 独立した API の置き場所（Cloud Run / Workers / Supabase Edge Functions）
    why: 同居させる画面側のサーバーがない。
  recommendation:
    pick: be.route-handlers
    reason: 画面と同じ場所に置けば、作る・直す・公開するが1つで済み、無料枠もホストと共通。長い処理や定期処理が出てきた時だけ、その処理を1つ外に出す。料金と上限は 2026-11-03 に公式ページで確認（Hobby は非商用のみ）。
    rejected:
    - {option: be.cloud-run, why: 自由度は高いが、コンテナの作成・公開作業・監視が別に要る。長い処理やスマホアプリ専用の API の時の候補。}
    - {option: be.supabase-edge, why: データの置き場所が Supabase なら相性がよいが、画面側に Route Handlers があるなら2か所目になる。}
    - {option: be.cloudflare-workers, why: 速くて安いが実行環境に制約（Node.js の一部 API が使えない）があり、AI の書き慣れが浅い。}
