    pick: ui.shadcn
    reason: アプリ画面は shadcn/ui＋Base UI（読み上げ厳密なら React Aria）を土台に、スマホ編集は vaul・dnd-kit。動きは Magic UI・transitions.dev を見本にし、reduced-motion を必ず守る。Aceternity・SmoothUI・React Bits・21st.dev は LP のファーストビューだけ。
    rejected:
    - option: ui.base-ui
      why: 選ぶものではなく shadcn の下に敷くもの。
    - option: ui.react-aria
      why: アクセシビリティ最重視の時は Base UI の代わりに。
    - option: ui.untitled
      why: Figma 連携は最強だが有料で人数課金。デザイナーがいる時の候補。
    - option: ui.heroui
      why: 見た目が既に決まっていて独自ブランドを出しにくい。
    - option: ui.daisyui
      why: React 以外でも使えるが細かい動きが弱い。
    - option: ui.aceternity
      why: LP 演出専用。アプリ画面に入れると重く、うるさい。
    - option: ui.magicui
      why: 小さな動きの見本・足し。土台ではない。
