  services:
  - id: pm.free-trial
    free_tier: 決済側の追加料金なし（手数料のみ）
    paid_entry: —
    url: https://stripe.com/pricing
    checked: '2026-10-26'
    verified: true
  - id: pm.freemium
    free_tier: 決済側の追加料金なし。無料ユーザーの原価は自分持ち
    paid_entry: —
    url: https://stripe.com/pricing
    checked: '2026-10-26'
    verified: true
  - id: pm.usage
    free_tier: 計測（メーター）を自分で作る。Stripe Billing は Pay as you go 0.7%
    paid_entry: 月額プラン $620/月〜（1年契約）
    url: 'https://stripe.com/pricing'
    checked: '2026-11-03'
    verified: true
  - id: pm.one-time
    free_tier: 決済側の追加料金なし（MoR なら 5%+50¢）
    paid_entry: —
    url: https://www.paddle.com/pricing
    checked: '2026-11-02'
    verified: true
  - id: pm.seats
    free_tier: 決済側の追加料金なし
    paid_entry: —
    url: https://stripe.com/pricing
    checked: '2026-10-26'
    verified: true
  combine:
    single: 型を 1 つに絞ると、価格表・規約・返金・解約の文面が 1 つで済み、お客さんも迷わない。
    combined: 定額（席）＋従量（AI 分だけ）の組み合わせが定番。原価が利用者に比例する部分だけ従量にする。
    risks: 型が増えるほど、請求の説明・返金・税の扱いが増える。無料枠と試用を両方置くと、無料で試して去る人が増える。従量の計測ミスは売上のミス。
  switch_points:
  - when: 1 ユーザーあたりの原価（AI・SMS・転送）が売価の 30% を超える
    upgrade_to: 従量（pm.usage）を定額に足す、または無料枠に上限
    why: 定額のまま使われると赤字が利用者数に比例して増える。
  - when: 会社の購買部門が請求書・年契約を求めてきた
    upgrade_to: 席数×年払い（pm.seats）
    why: 請求書払い・年契約が売れる条件になる。
  - when: 複数国に売り、税の登録義務が出た
    upgrade_to: 販売代行（MoR：Paddle 等 5%+50¢）
    why: 国ごとの税の登録・納付を代行してもらう方が、手数料より安い。
  recommendation:
    pick: pm.free-trial
    reason: 原価が利用者数に比例しても赤字にならず、転換率（試用→有料）で需要を測れる。最初の 10 人の有料顧客まではこれで十分。
    rejected:
    - option: pm.freemium
      why: 使うほど価値が増え、無料ユーザーの原価がほぼゼロの時だけ。AI・メッセージの原価があると赤字が先に来る。
    - option: pm.usage
      why: 原価が使用量に比例する時に定額へ足す。単独だと個人のお客さんは請求額が読めず嫌がる。
    - option: pm.one-time
      why: サーバー・AI の費用が続くものには合わない（売上が止まり費用が続く）。
    - option: pm.seats
      why: 会社向けで席を管理者が決める時。個人利用が主なら席は共有される。
