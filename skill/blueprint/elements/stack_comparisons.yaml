  - when: アプリのビルド待ちが毎回長い・月15回を超える
    upgrade_to: Expo Starter $19/月
    why: 無料は待ち時間が長いことがあり、出したい時に出せない。
  recommendation:
    pick: fe.nextjs
    reason: 画面・ログイン・決済のつなぎ込みが1つで済み、AI がうまく書ける。アプリが必要になってから Expo を足す。
    rejected:
    - option: fe.astro
      why: 文章中心のサイトには最適だが、ログインや決済のある画面には向かない。
    - option: fe.expo
      why: アプリ必須でなければ作る量が増える。
