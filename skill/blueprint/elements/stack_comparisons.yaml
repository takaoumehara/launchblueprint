    paid_entry: ホスティング側の料金
    url: https://www.cloudflare.com/plans/developer-platform/
    checked: '2026-10-28'
    verified: true
  - id: fe.expo
    free_tier: 無料（オープンソース）。EAS 無料：月 iOS 15回・Android 15回のビルド、更新配信 1,000人まで
    paid_entry: Starter $19/月（ビルド代 $45 分・優先キュー・更新 3,000人）
    url: https://expo.dev/pricing
    checked: '2026-10-28'
    verified: true
  combine:
    single: ウェブは Next.js 1つで画面もサーバー処理も書く。AI が一番書き慣れている。
    combined: ウェブは Next.js、アプリは Expo と2本立てにすると、両方に最適な形で出せる。
    risks: 同じ画面を2回作る、直す時も2か所、ログインやデータの扱いを2回つなぐ。小さいうちは手間が倍になる。
