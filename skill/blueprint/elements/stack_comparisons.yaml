  combine:
    single: shadcn/ui（土台は Base UI）1つなら見た目のルールが1つで、AI も一番書き慣れている。
    combined: 土台 shadcn＋Base UI／React Aria、LP の大きな演出だけ Aceternity・SmoothUI・React Bits、細かい動きは Magic UI・transitions.dev を見本に、足りない部品は 21st.dev から。
    risks: ライブラリごとに角丸・影・動きの速さが違い、画面がちぐはぐになる。動きのライブラリが重くなる。21st.dev は作者ごとに品質とライセンスが違う。動きを減らす設定（reduced-motion）を守らない部品がある。
