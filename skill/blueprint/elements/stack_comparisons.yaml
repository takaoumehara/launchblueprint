  - id: cc.github-actions-budget
    free_tier: 公開リポジトリは無料。予算 75/90/100% 通知・停止可
    paid_entry: 超過 Linux 1 分 $0.006
    url: https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-github-actions/managing-your-spending-limit-for-github-actions
    checked: '2026-11-02'
    verified: true
  combine:
    single: ホストとデータの置き場所を同じ会社でそろえれば、上限は 1〜2 か所で済む。
    combined: サービスごとの上限（Vercel・Supabase・AI Gateway・GitHub）を全部オンにし、1 枚の費用シート（cc.monthly-cost-sheet）で見る。
    risks: 上限の対象外（Vercel の AI Gateway・保存、Supabase の計算・PITR）を知らずに安心する。止まった時にアプリがどう見えるかを試していない。通知だけの予算（GCP）を上限と思い込む。
  switch_points:
  - when: 初めての有料プラン（Vercel Pro・Supabase Pro）
    upgrade_to: その場で Spend Management と Spend Cap をオン、50/80% 通知を 2 人へ
    why: 無料は止まるだけだが、有料は請求が来る。
  - when: AI 機能を公開した
    upgrade_to: AI Gateway の予算＋利用者ごとの上限（dp.ai-usage-caps）＋再試行の上限（cc.retry-with-breaker）
    why: AI 費用は一晩で跳ねる。予算は Spend Management の対象外。
  - when: 月の請求が前月の 2 倍、または無料枠の 80%
    upgrade_to: 原因の項目に個別の上限、または有料プランへ計画的に
    why: 黙って止まるより、止める場所と払う場所を自分で決める。
  recommendation:
    pick: cc.vercel-spend
    reason: 最初の有料は Vercel Pro になりやすく、そこで全体の上限・通知・本番停止を 1 か所で決められる。Supabase は Pro で既定オン、AI は Gateway の予算で別に止める。
    rejected:
    - option: cc.supabase-spend-cap
      why: 既定オンなので「選ぶ」ものではなく確認するもの。対象外の項目に注意。
    - option: cc.ai-gateway-budget
      why: AI 費用専用。Spend Management と併用する。
    - option: cc.gcp-budget
      why: 通知だけで止まらない。Firebase・Cloud Run を使うなら必須だが、止める自動化が別に要る。
    - option: cc.github-actions-budget
      why: CI の分数だけ。公開リポジトリなら不要。
