# 技術の選択ごとの「スタック比較」（R-030）。tactics.yaml の topic と同じキー
# 各項目：services（同じ・似た機能のサービスと無料枠。公式ページ＋確認日。未確認は verified:false）
#        combine（1社でそろえる vs 無料枠を組み合わせる、の手間・不整合・故障のリスク）
#        switch_points（安い有料プランと、払った方が運用が楽になる境目：人数・データ量・運用時間）
#        recommendation（おすすめ・理由・選ばなかったもの）
domain: stack_comparisons
updated: '2026-11-03'
comparisons:
- topic: database
  services:
  - id: db.supabase
    free_tier: 500MB の DB・5GB 転送・1GB ファイル。1週間使わないと一時停止。無料は2プロジェクトまで
    paid_entry: Pro $25/月（8GB・毎日バックアップ7日分・停止なし）
    url: https://supabase.com/pricing
    checked: '2026-11-03'
    verified: true
  - id: db.neon
    free_tier: 1プロジェクト 1GB（合計 20GB）・計算 100時間/月・5分で自動停止・転送 5GB
    paid_entry: Launch 使った分だけ（計算 $0.106/時・保存 $0.35/GB月。最低料金なし）
    url: https://neon.com/pricing
    checked: '2026-11-03'
    verified: true
  - id: db.firestore
    free_tier: 1GiB 保存・読み取り 5万回/日・書き込み 2万回/日・削除 2万回/日・転送 10GiB/月
    paid_entry: Blaze（使った分だけ。無料分は差し引き）
    url: https://firebase.google.com/pricing
    checked: '2026-11-03'
    verified: true
  combine:
    single: Supabase 1社でデータ・ログイン・ファイル・すぐ反映がそろう。権限の仕組みが1つで、障害時に見る所も1か所。
    combined: Neon（DB）＋別のログイン＋別のファイル置き場で無料枠を足すと、合計の無料量は増える。
    risks: ユーザーIDを3か所でそろえる手間、権限の書き方がサービスごとに違う、どれか1つの障害で全体が止まる、請求と上限の管理が3つになる。
  switch_points:
  - when: 本番で使い始めた日（1週間止まると困る）
    upgrade_to: Supabase Pro $25/月
    why: 無料は1週間使わないと停止し、自動バックアップもない。お客さんがいる時点で払う方が安全。
  - when: DB が 400MB を超えた（無料 500MB の8割）
    upgrade_to: Supabase Pro（8GB 込み）
    why: 上限に当たると書き込みが止まる。
  - when: 時点を指定した復元が必要（売上データなど）
    upgrade_to: PITR $100/月〜（7日分）
    why: 毎日のバックアップだけでは直前の状態に戻せない。
  recommendation:
    pick: db.supabase
    reason: 1社でそろい、AIも書き慣れている。本番開始と同時に Pro $25/月にする前提で、運用の手間が一番少ない。
    rejected:
    - option: db.neon
      why: DB だけなら安いが、ログインやファイルを別に用意する手間が増える。DB だけ使う時やプレビューごとに DB を分けたい時は候補。
    - option: db.firestore
      why: 表をつないだ集計が苦手。スマホアプリ中心なら候補。
- topic: auth
  services:
  - id: auth.supabase
    free_tier: 月 5万人（MAU）まで。メール・SNSログイン・匿名・基本の二段階認証
    paid_entry: Pro $25/月で月 10万人まで（その後 1人 $0.00325）
    url: https://supabase.com/pricing
    checked: '2026-11-03'
    verified: true
  - id: auth.clerk
    free_tier: 1アプリ 月 5万人（翌日以降も戻った人だけ数える）。SNS 3種まで。二段階認証・パスキーは無し
    paid_entry: Pro $25/月（年払い $20）。パスキー・二段階認証・ロゴ非表示
    url: https://clerk.com/pricing
    checked: '2026-11-03'
    verified: true
  - id: auth.firebase
    free_tier: 月 5万人（Identity Platform）まで。電話の SMS は1通ごとに課金
    paid_entry: 5万人を超えた分は Google Cloud の料金
    url: https://firebase.google.com/pricing
    checked: '2026-11-03'
    verified: true
  - id: auth.auth0
    free_tier: 月 2.5万人・SNS ログイン無制限・パスキー・独自ドメイン1つ
    paid_entry: Essentials $35/月〜（500人まで。1,000人で $70、1万人で $700）
    url: https://auth0.com/pricing
    checked: '2026-11-03'
    verified: true
  - id: auth.better-auth
    free_tier: OSS 無料（MIT）。ユーザーは自分の DB に残る
    paid_entry: —（DB・メール代だけ）
    url: https://github.com/better-auth/better-auth/blob/main/LICENSE.md
    checked: '2026-11-02'
    verified: true
  - id: auth.authjs
    free_tier: OSS 無料（ISC）。SNS ログイン中心。パスキーは実験的（本番非推奨）。Better Auth 傘下
    paid_entry: —
    url: https://authjs.dev/getting-started/authentication/webauthn
    checked: '2026-11-02'
    verified: true
  - id: auth.passkeys
    free_tier: SimpleWebAuthn（MIT）で他の認証にパスキーを足す
    paid_entry: —
    url: https://github.com/MasterKale/SimpleWebAuthn/blob/master/LICENSE.md
    checked: '2026-11-02'
    verified: true
  - id: auth.stytch
    free_tier: 1万アクティブ・SSO/SCIM 5接続まで無料。急に高くならない従量
    paid_entry: ブランド変更 $99・SSO追加 $125/接続
    url: https://stytch.com/pricing
    checked: '2026-11-03'
    verified: true
  - id: auth.magic
    free_tier: 月1,000ウォレットまで無料（暗号資産ウォレット向けの料金体系）
    paid_entry: $99/月で2,500人
    url: https://magic.link/pricing
    checked: '2026-11-03'
    verified: true
  combine:
    single: データの置き場所と同じ会社のログインを使うと、ユーザーIDと権限が自動でつながる。
    combined: ログイン画面の見た目が良い Clerk ＋ DB は別、もよくある。
    risks: ユーザー情報を2か所で同期する仕組み（自動のお知らせ）が必要、同期が遅れると権限がずれる、退会処理を2回やる。
  switch_points:
  - when: 管理者にパスキーや二段階認証を必須にしたい（攻撃への守り）
    upgrade_to: Supabase は無料で基本の二段階認証あり／Clerk は Pro $25/月
    why: 管理者アカウントの乗っ取りは被害が大きい。
  - when: 月のログイン人数が 4万人（無料 5万人の8割）
    upgrade_to: Supabase Pro（10万人込み）
    why: 上限を超えると追加料金かログイン停止。
  - when: 電話番号の SMS ログインを使う
    upgrade_to: SMS は従量課金
    why: SMS は1通ごとに費用。なりすましにも弱いので本当に必要か確認。
  recommendation:
    pick: auth.supabase
    reason: DB と同じ所で無料 5万人、追加の同期がいらない。
    rejected:
    - option: auth.clerk
      why: 画面は一番きれいだが、無料ではパスキー・二段階認証が無く、DB との同期が別に要る。
    - option: auth.firebase
      why: データの置き場所が Firebase の時だけ一体になる。
    - option: auth.auth0
      why: 無料 2.5万人は十分だが、有料になると 1,000人で $70/月と高い。
    - option: auth.better-auth
      why: 無料で縛られないが、漏えい対策・パスワード再設定・更新を自分で持つ。DB が Supabase 以外の時や、ユーザー情報を手元に置きたい時の第一候補。
    - option: auth.authjs
      why: SNS ログインだけなら軽いが、パスワード・二段階認証・管理画面が弱い。新規なら Better Auth の方が機能が多い。
    - option: auth.passkeys
      why: 選ぶものではなく足すもの。Supabase / Better Auth に後からパスキーを足す時に使う。
    - option: auth.stytch
      why: メールリンク・不正対策に強く無料1万人。B2B で SSO が要る時の候補。
    - option: auth.magic
      why: 今は暗号資産ウォレット向け。普通のログインには合わない。
- topic: email
  services:
  - id: mail.resend
    free_tier: 月 3,000通・1日 100通まで・独自ドメイン 3つ
    paid_entry: Pro $20/月で月 5万通（1日の上限なし）
    url: https://resend.com/pricing
    checked: '2026-11-03'
    verified: true
  - id: mail.postmark
    name: Postmark
    free_tier: 月 100通（期限なし）
    paid_entry: Basic $15/月で月1万通（超過 1,000通 $1.80）
    url: https://postmarkapp.com/pricing
    checked: '2026-10-28'
    verified: true
  - id: mail.ses
    name: Amazon SES
    free_tier: 新規 AWS アカウントに最大 $200 の無料クレジット（6〜12か月）
    paid_entry: 1,000通 $0.10（プランなし）／Essentials プランは 1,000通 $0.16。設定と審査の手間が大きい
    url: https://aws.amazon.com/ses/pricing/
    checked: '2026-10-28'
    verified: true
  combine:
    single: 登録確認とお知らせを1社で送ると、迷惑メール対策の設定（ドメイン認証）が1回で済む。
    combined: 無料枠を足すために2社で送り分けると、同じドメインの認証設定が2重になる。
    risks: 片方の設定ミスで両方の到達率が落ちる、どこで止まったか追いにくい、配信停止リストが2つに分かれる。
  switch_points:
  - when: 1日 100通を超える日が出た（イベント前の一斉連絡など）
    upgrade_to: Resend Pro $20/月
    why: 無料は1日 100通で止まる。ログイン用メールが届かないと誰も入れない。
  - when: ニュースレターなど宣伝メールを送る
    upgrade_to: 宣伝メールは別枠（Resend は連絡先 1,000件まで無料）
    why: 取引メールと宣伝メールを分けると、到達率と法律の配信停止義務を守りやすい。
  recommendation:
    pick: mail.resend
    reason: 無料で月 3,000通、設定が簡単。1日 100通を超えたら $20/月。
    rejected:
    - option: mail.postmark
      why: 届く速さの評判は高いが、無料は月100通だけで、次は $15/月（1万通）。
    - option: mail.ses
      why: 量が多いと最安（1,000通 $0.10）だが、設定・審査・監視を自分でやる時間がかかる。
    - option: push.fcm
      why: スマホへの通知用で、メールは送れない。
- topic: hosting
  services:
  - id: host.vercel
    free_tier: Hobby 無料：転送 100GB/月・関数 100万回/月。個人・非商用のみ
    paid_entry: Pro $20/月（1人。転送 1TB 込み・商用可）
    url: https://vercel.com/pricing
    checked: '2026-11-03'
    verified: true
  - id: host.cloudflare-pages
    free_tier: ビルド 月500回・同時1つ・1サイト2万ファイル・確認用ページ無制限。関数は 1日10万回まで
    paid_entry: Workers Paid $5/月〜（月1,000万回込み）
    url: https://www.cloudflare.com/plans/developer-platform/
    checked: '2026-11-03'
    verified: true
  - id: host.firebase-hosting
    free_tier: 保存 10GB・転送 1日 360MB
    paid_entry: Blaze：保存 $0.026/GB・転送 $0.15/GB
    url: https://firebase.google.com/pricing
    checked: '2026-11-03'
    verified: true
  combine:
    single: 画面・関数・確認用ページを1社に置くと、公開作業が1回で、ログも1か所。
    combined: 画面は Cloudflare の無料枠、関数は別、と分けると無料で長く持つ。
    risks: 公開作業が2系統になり、片方だけ古い版が出る事故、ドメインとキャッシュの設定が2重、障害の切り分けに時間がかかる。
  switch_points:
  - when: お金を受け取る・会社として使う（商用）
    upgrade_to: Vercel Pro $20/月
    why: Hobby は非商用だけ。商用で使うと規約違反になる（R-004 も参照）。
  - when: 転送が月 80GB（無料 100GB の8割）
    upgrade_to: Vercel Pro（1TB 込み）／または静的部分を Cloudflare へ
    why: 無料は上限で止まり、追加購入できない。
  recommendation:
    pick: host.vercel
    reason: 変更ごとに確認用ページが自動で出て、作業が一番少ない。商用で使う日から Pro $20/月。
    rejected:
    - option: host.cloudflare-pages
      why: 静的サイトは無料で強い（ビルド月500回・確認用ページ無制限）が、Next.js の一部機能が動かないことがある。
    - option: host.firebase-hosting
      why: アプリのデータ置き場を Firebase でそろえる時だけ一体になる。
- topic: payments
  services:
  - id: pay.stripe-checkout
    free_tier: 月額なし。米国カード 2.9%＋30¢／件（海外カード +1.5%・通貨換算 +1%）・チャージバック $15／件
    paid_entry: 同じ（手数料だけ）。税の自動計算は別料金
    url: 'https://stripe.com/pricing'
    checked: '2026-11-03'
    verified: true
  - id: pay.stripe-connect
    free_tier: Stripe が手数料を売り手から取る方式なら、プラットフォームの追加料金なし
    paid_entry: 自分で料金を決める方式：お金を受け取る売り手1人 $2/月＋送金ごとに 0.25%＋25¢
    url: https://stripe.com/connect/pricing
    checked: '2026-10-28'
    verified: true
  - id: pay.paddle
    free_tier: 月額なし。5%＋50¢／件（販売代行・各国の税・チャージバック対応込み）
    paid_entry: 大口は個別見積もり。$10 未満の商品は相談
    url: https://www.paddle.com/pricing
    checked: '2026-10-28'
    verified: true
  - id: pay.square
    free_tier: 月額なし。ネット決済 3.3%＋30¢（自分のアプリから API なら 2.9%＋30¢）。対面 2.6%＋15¢
    paid_entry: Plus $49/月・店舗（ネット 2.9%＋30¢）
    url: https://squareup.com/us/en/pricing
    checked: '2026-10-28'
    verified: true
  combine:
    single: 支払いは1社にまとめると、返金・売上・税の記録が1か所。
    combined: カードは Stripe、別の支払い方法を別会社で足すと、払い方は増える。
    risks: 売上の照合が2つ、返金の手順が2つ、税の計算がずれる。手数料も2社分の最低額がかかることがある。
  switch_points:
  - when: ユーザー同士でお金が動く（チケット販売の主催者など）
    upgrade_to: Stripe Connect
    why: 他人の売上を自分の口座で受けるのは危険。売り手ごとの口座と本人確認が要る。
  - when: 3か国以上の消費税の登録が必要になった
    upgrade_to: 販売代行（Paddle など）または Stripe Tax
    why: 国ごとの税の申告を自分でやる時間が、手数料の差より高くつく。
  - when: 月の売上が $10万を超えた
    upgrade_to: Stripe に手数料の相談（要確認）
    why: 量が多いと個別の料金が出ることがある。
  recommendation:
    pick: pay.stripe-checkout
    reason: 月額なしで始められ、カード・Apple Pay・Google Pay がそろう。ユーザー同士で売り買いするなら最初から Connect。
    rejected:
    - option: pay.paddle
      why: 海外の税は任せられるが、手数料が高く、ユーザー同士の売り買いには向かない。
    - option: pay.square
      why: 対面販売なら候補。ネットだけだと手数料 3.3%＋30¢ と高め（API なら 2.9%＋30¢）。
- topic: frontend
  services:
  - id: fe.nextjs
    free_tier: 無料（オープンソース）。公開先の無料枠に従う
    paid_entry: ホスティング側の料金（例：Vercel Pro $20/月）
    url: https://vercel.com/pricing
    checked: '2026-10-28'
    verified: true
  - id: fe.astro
    free_tier: 無料（オープンソース）。文章中心のサイトは静的に出せて、ほぼどこでも無料で置ける
    paid_entry: ホスティング側の料金
    url: https://www.cloudflare.com/plans/developer-platform/
    checked: '2026-10-28'
    verified: true
  - id: fe.expo
    free_tier: 無料（オープンソース）。EAS 無料：月 iOS 15回・Android 15回のビルド、更新配信 1,000人まで
    paid_entry: Starter $19/月（ビルド代 $45 分・優先キュー・更新 3,000人）
    url: https://expo.dev/pricing
    checked: '2026-11-03'
    verified: true
  combine:
    single: ウェブは Next.js 1つで画面もサーバー処理も書く。AI が一番書き慣れている。
    combined: ウェブは Next.js、アプリは Expo と2本立てにすると、両方に最適な形で出せる。
    risks: 同じ画面を2回作る、直す時も2か所、ログインやデータの扱いを2回つなぐ。小さいうちは手間が倍になる。
  switch_points:
  - when: スマホアプリが必須になった（通知・カメラ・ストア掲載）
