  - when: 転送が月 80GB（無料 100GB の8割）
    upgrade_to: Vercel Pro（1TB 込み）／または静的部分を Cloudflare へ
    why: 無料は上限で止まり、追加購入できない。
  recommendation:
    pick: host.vercel
    reason: 変更ごとに確認用ページが自動で出て、作業が一番少ない。商用で使う日から Pro $20/月。
    rejected:
    - option: host.cloudflare-pages
      why: 静的サイトは無料で強い（ビルド月500回・確認用ページ無制限）が、Next.js の一部機能が動かないことがある。
    - option: host.firebase-hosting
      why: アプリのデータ置き場を Firebase でそろえる時だけ一体になる。
- topic: payments
  services:
  - id: pay.stripe-checkout
    free_tier: 月額なし。米国カード 2.9%＋30¢／件・チャージバック $15／件
    paid_entry: 同じ（手数料だけ）。税の自動計算は別料金
    url: https://stripe.com/pricing
    checked: '2026-10-26'
    verified: true
  - id: pay.stripe-connect
    free_tier: Stripe が手数料を売り手から取る方式なら、プラットフォームの追加料金なし
    paid_entry: 自分で料金を決める方式：お金を受け取る売り手1人 $2/月＋送金ごとに 0.25%＋25¢
    url: https://stripe.com/connect/pricing
    checked: '2026-10-28'
    verified: true
  - id: pay.paddle
    free_tier: 月額なし。5%＋50¢／件（販売代行・各国の税・チャージバック対応込み）
    paid_entry: 大口は個別見積もり。$10 未満の商品は相談
    url: https://www.paddle.com/pricing
    checked: '2026-10-28'
    verified: true
  - id: pay.square
    free_tier: 月額なし。ネット決済 3.3%＋30¢（自分のアプリから API なら 2.9%＋30¢）。対面 2.6%＋15¢
    paid_entry: Plus $49/月・店舗（ネット 2.9%＋30¢）
    url: https://squareup.com/us/en/pricing
    checked: '2026-10-28'
    verified: true
  combine:
    single: 支払いは1社にまとめると、返金・売上・税の記録が1か所。
    combined: カードは Stripe、別の支払い方法を別会社で足すと、払い方は増える。
    risks: 売上の照合が2つ、返金の手順が2つ、税の計算がずれる。手数料も2社分の最低額がかかることがある。
  switch_points:
  - when: ユーザー同士でお金が動く（チケット販売の主催者など）
    upgrade_to: Stripe Connect
    why: 他人の売上を自分の口座で受けるのは危険。売り手ごとの口座と本人確認が要る。
  - when: 3か国以上の消費税の登録が必要になった
    upgrade_to: 販売代行（Paddle など）または Stripe Tax
    why: 国ごとの税の申告を自分でやる時間が、手数料の差より高くつく。
  - when: 月の売上が $10万を超えた
    upgrade_to: Stripe に手数料の相談（要確認）
    why: 量が多いと個別の料金が出ることがある。
  recommendation:
    pick: pay.stripe-checkout
    reason: 月額なしで始められ、カード・Apple Pay・Google Pay がそろう。ユーザー同士で売り買いするなら最初から Connect。
    rejected:
    - option: pay.paddle
      why: 海外の税は任せられるが、手数料が高く、ユーザー同士の売り買いには向かない。
    - option: pay.square
      why: 対面販売なら候補。ネットだけだと手数料 3.3%＋30¢ と高め（API なら 2.9%＋30¢）。
