    combined: support@ の共有受信箱（無料）＋自社サイトの FAQ＋別ホストのステータスページ。全部無料枠。
    risks: チャットを置くと「すぐ返事が来る」と期待され、1 人では応答目標を守れない。窓口が複数だと履歴が散る。AI の一次回答が返金や規約を約束してしまう（lt.ai-disclosure）。
  switch_points:
  - when: 問い合わせが週 20 件を超え、担当が 2 人になる
    upgrade_to: Help Scout Free（5 人）→ Standard $25/人/月
    why: 担当の割当・保留・定型文が要る。Gmail の共有は誰が返したか分からなくなる。
  - when: アプリ内で即答を売りにする（有料プラン・B2B）
    upgrade_to: Crisp Free（2 席）→ Mini $45/月
    why: チャットは応答時間を約束できる体制ができてから。
  - when: よくある質問が 10 件を超えた
    upgrade_to: sup.docs（自社サイトの FAQ）
    why: 同じ質問に人が答え続けるより安い。検索流入にもなる。
  recommendation:
    pick: sup.email
    reason: 無料で今日から、応答目標を自分で決められ、記録が残る。FAQ とステータスページは別ホストで足す。
    rejected:
    - option: sup.crisp
      why: 即答の期待を作る。応答体制ができてから。
    - option: sup.docs
      why: 窓口ではなく補助。質問が 10 件を超えたら足す。
    - option: sup.status
      why: 窓口ではなく障害の公表。uptime の比較で選ぶ。
