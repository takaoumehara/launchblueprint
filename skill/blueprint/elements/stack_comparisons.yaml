    verified: true
  - id: bk.supabase-builtin
    free_tier: —（Free にバックアップなし）
    paid_entry: Pro $25/月で毎日 7 日保持。PITR アドオン $100/月
    url: https://supabase.com/pricing
    checked: '2026-11-02'
    verified: true
  - id: bk.neon-restore
    free_tier: 履歴 6 時間（1GB まで）
    paid_entry: Launch で最大 7 日。追加履歴 $0.20/GB-月
    url: https://neon.com/docs/postgres/backup-restore/history-window
    checked: '2026-11-02'
    verified: true
  - id: bk.firestore-pitr
    free_tier: —（PITR に無料枠なし・Blaze 必須）
    paid_entry: 保存分（GB-月）。定期バックアップは保持 14 週まで
    url: https://firebase.google.com/docs/firestore/pitr
    checked: '2026-11-02'
    verified: true
  - id: bk.backblaze-b2
    free_tier: 10GB・転送は保存量の 3 倍/月まで無料
    paid_entry: $6.95/TB/月
    url: https://www.backblaze.com/cloud-storage/pricing
    checked: '2026-11-02'
    verified: true
  combine:
    single: データの置き場所に付いてくる復元（Supabase Pro・Neon の履歴・Firestore PITR）だけ。設定は数分、同じアカウントの中で完結。
    combined: 付属の復元＋別ワーカーの夜間ダンプ→ R2 ＋ 別事業者（B2）に削除ロック付きコピー（3-2-1）。小規模なら費用はほぼゼロ。
    risks: 付属の復元だけだと、アカウントの乗っ取り・解約・事業者障害で本体と一緒に消える。自前ダンプは黙って止まる（失敗通知と月次の復元テストが要る）。ダンプに鍵が混ざる。
  switch_points:
  - when: 今すぐ（Free プランで本番データがある）
    upgrade_to: bk.dump-to-r2（夜間ダンプ・失敗通知・月次復元テスト）
    why: Free にはバックアップが無い。R2 10GB は小さな DB なら何年分も入る。
  - when: 有料プラン（Supabase Pro $25 等）を別の理由で払い始めた
    upgrade_to: 付属の毎日バックアップ＋自前ダンプの両方
    why: 付属分は追加料金なし。自前ダンプは別事業者コピーとして残す。
  - when: 数時間の損失が売上や信頼に響く（決済・予約・投稿が多い）
    upgrade_to: PITR（Supabase $100/月・Neon Launch 最大 7 日・Firestore PITR）
    why: 時点復元は日次ダンプでは戻せない直前の状態に戻せる。RPO を数分にできる。
  recommendation:
    pick: bk.dump-to-r2
    reason: どの DB でも同じ手順で、費用ほぼゼロ、別アカウント・別事業者に置ける。付属の復元は「あれば使う」で、これを土台にする。失敗通知と月 1 回の復元テスト（dp.restore-test-monthly）を必ず付ける。
    rejected:
    - option: bk.supabase-builtin
      why: Free に無く、Pro でも同じアカウント内。Pro を払うなら併用。
    - option: bk.neon-restore
      why: 6 時間は操作ミスの取り消しには便利だが、バックアップではない。併用。
    - option: bk.firestore-pitr
      why: アプリ（Firestore）なら土台。Blaze 必須で既定オフなので、有効化を初日に。
    - option: bk.backblaze-b2
      why: R2 と役割は同じ。主クラウドが Cloudflare 中心なら、こちらを「別事業者」にする。
