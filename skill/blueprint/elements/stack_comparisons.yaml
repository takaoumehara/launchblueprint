    upgrade_to: Mux（使った分だけ）
    why: 動画の変換・配信・字幕を自分で組む時間が一番高くつく。
  recommendation:
    pick: st.supabase-storage
    reason: データと同じ場所・同じ権限の仕組みで、最初は一番手間が少ない。大きく配るものだけ R2 に移す。
    rejected:
    - option: st.vercel-blob
      why: 手軽だが、ファイルごとの細かい閲覧権限を自分で作る必要がある。
    - option: st.r2
