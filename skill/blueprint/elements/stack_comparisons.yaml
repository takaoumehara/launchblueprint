    url: https://support.google.com/googleplay/android-developer/answer/6112435
    checked: '2026-11-02'
    verified: true
  - id: dist.capacitor
    free_tier: —
    paid_entry: Apple Developer Program US$99/年 ＋ Play US$25（一回限り）
    url: https://developer.apple.com/programs/enroll/
    checked: '2026-11-03'
    verified: true
  - id: dist.expo
    free_tier: EAS 無料：Android 15・iOS 15 ビルド/月
    paid_entry: EAS Starter $19/月（$45 分のビルドクレジット）
    url: https://expo.dev/pricing
    checked: '2026-11-02'
    verified: true
  - id: dist.native
    free_tier: —
    paid_entry: 開発費が主（iPhone 用と Android 用を 2 回作る。見積もり）＋ストア費用は上と同じ
    url: null
    checked: '2026-11-03'
    verified: false
  combine:
    single: ウェブ（PWA）だけなら審査なし・即日・課金はウェブのまま。
    combined: ウェブを本体に、Android は TWA（$25）、iPhone は Capacitor の殻、と段階的に足す。コードは 1 つ。
    risks: ストアに出た瞬間に IAP の規則（policy.apple.3_1_1・policy.google.payments）がかかり、手取りが変わる。審査で公開日がずれる。ウェブを包んだだけだと 4.2 で却下。
  switch_points:
  - when: 利用者がストアで探している（検索語にアプリ名・「アプリ」が付く）、または Android の通知が要る
    upgrade_to: TWA（Play $25）
    why: PWA をそのまま載せられ、コードは増えない。
  - when: iPhone の通知・カメラなどネイティブ機能が売上を左右する
    upgrade_to: Capacitor の殻（Apple の年会費＋ネイティブ機能で 4.2 回避）
    why: ウェブのコードを再利用しつつ、IAP の設計を先に決める。
  - when: ウェブが安定し、ネイティブの体験そのものが差別化になった
    upgrade_to: Expo で書き直し（EAS 無料 → Starter $19/月）
    why: 二重保守になるので、ウェブの仕様が動いている間は始めない。
  recommendation:
    pick: dist.pwa
    reason: 審査なしで今日出せ、課金はウェブのまま。ストアは利用者がそこで探していると分かってから、TWA → 殻 → 書き直しの順で足す。
    rejected:
    - option: dist.twa
      why: Android だけ。PWA ができてから $25 で載せる。
    - option: dist.capacitor
      why: Apple の年会費と IAP の設計が先に要る。ネイティブ機能が必要になってから。
    - option: dist.expo
      why: 書き直しは二重保守。ウェブが安定してから。
    - option: dist.native
      why: 2 回作る。OS 機能が中核の時だけ。
