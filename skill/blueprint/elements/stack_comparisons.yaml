  recommendation:
    pick: fe.nextjs
    reason: 画面・ログイン・決済のつなぎ込みが1つで済み、AI がうまく書ける。アプリが必要になってから Expo を足す。
    rejected:
    - option: fe.astro
      why: 文章中心のサイトには最適だが、ログインや決済のある画面には向かない。
    - option: fe.expo
      why: アプリ必須でなければ作る量が増える。
- topic: storage
  services:
  - id: st.supabase-storage
    free_tier: 1GB・転送 5GB・1ファイル 50MB まで
    paid_entry: Pro $25/月（100GB・1ファイル 500GB まで）
    url: https://supabase.com/pricing
    checked: '2026-10-28'
    verified: true
  - id: st.vercel-blob
    free_tier: 1GB・読み取り 1万回/月・書き込み 2千回/月・転送 10GB
    paid_entry: Pro：保存 $0.023/GB
    url: https://vercel.com/pricing
    checked: '2026-10-28'
    verified: true
  - id: st.r2
    name: Cloudflare R2
    free_tier: 10GB・書き込み 100万回/月・読み取り 1,000万回/月・転送はずっと無料
    paid_entry: 保存 $0.015/GB
    url: https://developers.cloudflare.com/r2/pricing/
    checked: '2026-10-28'
    verified: true
  - id: st.mux
    free_tier: 動画の取り込み無料・視聴 月10万分無料・毎月 $20 分の利用枠
    paid_entry: 保存 1分 $0.003/月・視聴 10万分を超えたら 1分 $0.001
    url: https://www.mux.com/pricing
    checked: '2026-10-28'
    verified: true
  combine:
    single: データの置き場所（Supabase）にファイルも置くと、誰が見られるかの決まりを1つで書ける。
    combined: 画像は R2（転送ずっと無料・10GB 無料）、動画は Mux と分けると、無料で大きく持つ。
    risks: 見られる人の決まりを2か所に書く、消す時に両方消す必要（消し忘れは個人情報の残り）、鍵の管理が増える。
