    url: https://acquire.com/seller-pricing/
    checked: '2026-11-02'
    verified: true
  - id: xt.flippa
    free_tier: —
    paid_entry: 掲載 $29（60 日）〜＋成約 10%〜6%（帯の対応は要確認）
    url: https://flippa.com/pricing
    checked: '2026-11-02'
    verified: true
  combine:
    single: 直接打診だけなら手数料ゼロ。相手が見えている（競合・連携先・顧客）時に最短。
    combined: 直接打診で反応がなければマーケットプレイスに掲載し、買い手を広げる。データルームは共有フォルダ（xt.shared-folder-dataroom）で両方に同じ物を出す。
    risks: 数字を先に渡して交渉力を失う（NDA → 意向表明 → 調査の順）。マーケットプレイスの掲載で顧客・競合に売却の意図が知れる。帯ごとの手数料を読み違える。
  switch_points:
  - when: 直接打診 5 件に 2 か月反応がない
    upgrade_to: Acquire.com（掲載 $25/月〜）
    why: 買い手の母数を増やす。成約手数料 6〜8% は仲介より安い。
  - when: 小さなサイト・アプリ（$1 万未満）を早く手放したい
    upgrade_to: Flippa（掲載 $29〜）
    why: 小額の案件が多い。
  - when: 買い手候補が見つかり、契約に進む
    upgrade_to: 弁護士（lt.lawyer）
    why: 譲渡契約・表明保証は雛形で済ませない。
  recommendation:
    pick: xt.direct-outreach
    reason: 小さなプロダクトの買い手は機能かチーム目当てで、すでに関係のある相手が多い（reference/exit-appdist.md）。手数料ゼロで、データルームと数字（dd.metrics）がそろっていれば調査は数週間で終わる。
    rejected:
    - option: xt.acquire
      why: 母数は増えるが掲載料＋成約 6〜8%。直接打診で反応がない時に。
    - option: xt.flippa
      why: 小額のサイト向け。SaaS の買い手は少なめ。帯ごとの手数料は出品前に確認。
