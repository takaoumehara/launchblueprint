# Blueprint Tactics v0.2 — 要素ごとの選択肢（層2）。中身は catalog/*.yaml の id を指すだけ（重複させない）
# depends_on：この決定の前に決めておくべき topic（地図の線はこれだけから引く）
# kind：choose（1つ選ぶ）／ checklist（全部確かめる）
# ai_pick / ai_reason_ja：既定のおすすめ。pick_when は「始める」画面の答えで上書き
# lane：地図の列（BRAND / UX / UI / TECH / BIZ・LEGAL / RULES）
domain: tactics
updated: '2026-10-28'
check_cadence_values: {daily_new_options: 毎日：新しい選択肢が出たかだけ見る（料金・規約は見ない）, deep_when_used: プロジェクトで selected の時だけ、料金・規約を公式で深く確認}
tactics:
- element: el.product
  topic: database
  lane: tech
  label_ja: データの置き場所
  question_ja: ユーザーの情報や投稿をどこに保存する？
  kind: choose
  options: [db.supabase, db.firestore, db.neon]
  ai_pick: db.supabase
  ai_reason_ja: 表の形で扱えて、ログインや画像保存も同じ場所でそろう。あとで別の場所へ移しやすい。
  pick_when:
  - if: {platform: app}
    pick: db.firestore
    reason_ja: スマホアプリと相性がよく、電波が弱くても動く。
  depends_on: []
  last_checked: '2026-10-28'
  check_cadence: daily_new_options
- element: el.product
  topic: analytics
  lane: ux
  label_ja: 使われ方の計測
  question_ja: 何人が来て、どこで止まったかをどう見る？
  kind: choose
  options: [an.posthog, an.vercel-analytics]
  ai_pick: an.posthog
  ai_reason_ja: どの画面で離れたかまで見られる。無料枠が大きい。
  depends_on: [hosting]
  last_checked: '2026-10-28'
  check_cadence: daily_new_options
- element: el.experience
  topic: ui_patterns
  lane: ui
  label_ja: 画面づくりの約束
  question_ja: 迷わない画面にするための確認
  kind: checklist
  options: [ui_ux.primary-action-color, ui_ux.selected-state-tint, ui_ux.hints-on-demand, ui_ux.short-scannable-copy]
  depends_on: []
  last_checked: '2026-10-28'
  check_cadence: daily_new_options
- element: el.business
  topic: business_setup
  lane: biz
  label_ja: 事業の立ち上げ
  question_ja: 住所・ブランド名・決済アカウントの準備
  kind: checklist
  options: [biz.public-support-address, biz.processor-account-per-brand, biz.llc-full-formation-cost]
  depends_on: []
  last_checked: '2026-10-28'
  check_cadence: daily_new_options
- element: el.business
  topic: payments
  lane: biz
  label_ja: お金の受け取り
  question_ja: お客さんからどう支払ってもらう？
  kind: choose
  options: [pay.stripe-checkout, pay.stripe-connect, pay.paddle, pay.ryft]
  ai_pick: pay.stripe-checkout
  ai_reason_ja: 月額なしで始められ、カード・Apple Pay・Google Pay がそろう。
  pick_when:
  - if: {money: marketplace}
    pick: pay.stripe-connect
    reason_ja: ユーザー同士でお金が動くので、受け取り手ごとの口座と本人確認が要る。
  - if: {country: global}
    pick: pay.paddle
    reason_ja: 海外の消費税の計算と納付を代わりにやってくれる。
  depends_on: [business_setup, auth]
  last_checked: '2026-10-28'
  check_cadence: deep_when_used
- element: el.marketing
  topic: launch_channels
  lane: brand
  label_ja: 発表する場所
  question_ja: 最初のユーザーにどこで知ってもらう？
  kind: choose
  options: [gtm.producthunt, gtm.hn, gtm.x, gtm.seo]
  ai_pick: gtm.x
  ai_reason_ja: 作りながら途中経過を出せ、費用ゼロで反応がすぐ分かる。
  depends_on: [ui_patterns, analytics]
  last_checked: '2026-10-28'
  check_cadence: daily_new_options
- element: el.brand
  topic: cross_border
