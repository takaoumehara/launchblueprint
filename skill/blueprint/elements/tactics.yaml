  depends_on: [email]
  last_checked: '2026-10-28'
  check_cadence: daily_new_options
- element: el.security
  topic: auth
  lane: tech
  label_ja: ログイン
  question_ja: ユーザーにどうログインしてもらう？
  kind: choose
  options: [auth.supabase, auth.firebase, auth.clerk, auth.auth0, auth.better-auth, auth.authjs, auth.stytch, auth.passkeys, auth.magic]
