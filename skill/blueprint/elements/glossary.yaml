  - {term: "SQL", plain: "データを取り出す言葉", one_line: "表の形のデータを探したり集計したりする定番の書き方。"}
  - {term: "Postgres", plain: "表の形のデータベース", one_line: "世界中で使われている定番のデータの置き場所。"}
  - {term: "DB", plain: "データの置き場所", one_line: "ユーザーや投稿などの情報を保存しておく所。"}
