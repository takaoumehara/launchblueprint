  - {term: "ICU MessageFormat", plain: "複数形などを文の中で書く決まり", one_line: "「1 item / 2 items」のような数による言い換えを、コードではなく翻訳文の中で書く国際的な書き方。"}
  - {term: "ICU", plain: "複数形などを文の中で書く決まり", one_line: "数や性別による言い換えを翻訳文の中で書く国際的な書き方（ICU MessageFormat）。"}
  - {term: "Intl", plain: "ブラウザの日付・数字の整形機能", one_line: "日付・数字・通貨をロケールに合わせて正しく表示する、ブラウザ内蔵の機能。"}
  - {term: "pseudo-locale", plain: "試験用の偽の言語", one_line: "文字にアクセントを付け 4割長くした偽の言語。翻訳前に、直書きや文字あふれを見つける。"}
  - {term: "擬似ロケール", plain: "試験用の偽の言語", one_line: "文字を飾って 4割長くした偽の言語。翻訳前に直書きや文字あふれを見つける。"}
  - {term: "擬似ローカライズ", plain: "試験用の偽の言語で確認", one_line: "偽の言語に切り替えて、直書きや文字あふれを翻訳前に見つけること。"}
