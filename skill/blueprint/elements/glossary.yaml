# ことば（専門用語 → ふつうの日本語 ＋ 1行の説明）。アプリと AI が同じ言い換えを使う
domain: glossary
updated: '2026-10-28'
terms:
  - {term: "Merchant of Record", plain: "販売代行", one_line: "法律上の売り手を代わりに引き受け、各国の税金の計算と納付までしてくれる会社。"}
  - {term: "MoR", plain: "販売代行", one_line: "法律上の売り手を代わりに引き受け、各国の税金の計算と納付までしてくれる会社。"}
  - {term: "KYC", plain: "本人確認", one_line: "お金を受け取る人が実在するか、身分証などで確かめること。"}
  - {term: "IAP", plain: "アプリ内課金", one_line: "アプリストアの仕組みを通して支払ってもらうこと。手数料がかかる。"}
  - {term: "SaaS", plain: "月額で使うサービス", one_line: "ソフトを買わずに、ネット越しに月額などで使う形。"}
