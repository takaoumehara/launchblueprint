  - {term: "ベクトル", plain: "意味で探す仕組み", one_line: "言葉が完全に一致しなくても、意味が近いものを見つける。"}
  - {term: "PITR", plain: "時点復元", one_line: "好きな時刻の状態にデータを戻せる仕組み。日次のコピーより細かく戻せる。"}
  - {term: "RPO", plain: "失ってよいデータの量", one_line: "障害の時に、最大で何分（何時間）分のデータを失ってよいか。"}
