  - {term: "live region", plain: "変化を読み上げる領域", one_line: "トーストや保存結果など、見ていない場所の変化をスクリーンリーダーに知らせる領域。"}
  - {term: "ライブリージョン", plain: "変化を読み上げる領域", one_line: "見ていない場所の変化をスクリーンリーダーに知らせる領域。"}
  - {term: "landmark", plain: "画面の大きな区切り", one_line: "ヘッダー・ナビ・本文・フッターなどの区切り。読み上げで飛び先になる。"}
  - {term: "semantic HTML", plain: "意味どおりの部品を使うこと", one_line: "ボタンには button、リンクには a を使うこと。キーボード操作と読み上げがただで付く。"}
  - {term: "alt", plain: "画像の代わりの文", one_line: "画像が見えない人や読み込めない時に出る説明文。飾りの画像は空にする。"}
  - {term: "greyscale", plain: "白黒", one_line: "色を抜いた表示。色だけで区別していると白黒で見分けられなくなる。"}
  - {term: "VPAT", plain: "アクセシビリティ適合の報告書", one_line: "基準にどこまで合っているかを項目ごとに書いた文書。売却や法人契約で求められることがある。"}
