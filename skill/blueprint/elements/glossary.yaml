  - {term: "NDA", plain: "秘密保持契約", one_line: "見せた情報を外に出さないと約束する契約。数字を渡す前に結ぶ。"}
  - {term: "PMF", plain: "製品が市場に合った状態", one_line: "使えなくなったら困る人が十分いる状態。40% の目安で測る。"}
  - {term: "MRR", plain: "月の定期売上", one_line: "毎月くり返し入る売上の合計。買い手が最初に見る数字。"}
  - {term: "GPL", plain: "公開義務つきの無料ライセンス", one_line: "組み込むと自分のコードも公開する義務が出うるライセンス。売却前に混入を確認する。"}
  - {term: "MPL", plain: "部分公開のライセンス", one_line: "直したそのファイルだけ公開すればよい、ゆるめの無料ライセンス。"}
  - {term: "Commons Clause", plain: "再販禁止の条件", one_line: "組み込んで使うのは可だが、その部品自体を売ってはいけない条件。"}
  - {term: "データルーム", plain: "買い手に見せる書類の置き場", one_line: "契約・権利・数字・構成図を閲覧専用でまとめた共有フォルダ。"}
  - {term: "オンコール", plain: "当番", one_line: "障害が起きた時に起きて対応する人を、時間ごとに決めておくこと。"}
  - {term: "キルスイッチ", plain: "止めるボタン", one_line: "費用や被害が膨らむ機能を、1 か所で止められる仕組み。"}
  - {term: "ランブック", plain: "障害の手順書", one_line: "よくある障害ごとの、気づき方・最初の一手・連絡文・直ったかの確認。"}
