  - {term: "MAU", plain: "月に使う人の数", one_line: "1か月に1回以上使った人の人数。"}
  - {term: "VAT", plain: "海外の消費税", one_line: "ヨーロッパなどの消費税。国ごとに率と手続きが違う。"}
