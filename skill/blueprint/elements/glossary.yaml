  - {term: "CLS", plain: "画面の跳ねの量", one_line: "読み込み中に中身がどれだけ動いたかの数値。0.1 以下が合格。"}
  - {term: "layout shift", plain: "画面の跳ね", one_line: "画像や広告が遅れて来て、読んでいた所が動くこと。押し間違いの元。"}
  - {term: "レイアウトシフト", plain: "画面の跳ね", one_line: "遅れて来た中身で、読んでいた所が動くこと。"}
  - {term: "lazy load", plain: "見える時に読み込む", one_line: "画面の下にある画像を、スクロールで近づいた時に初めて読み込むこと。"}
  - {term: "遅延読み込み", plain: "見える時に読み込む", one_line: "画面の下の画像を、近づいた時に初めて読み込むこと。"}
  - {term: "preload", plain: "先に読み込む", one_line: "最初の画面に必要なフォントや画像を、他より先に取りに行かせる指定。"}
  - {term: "プリロード", plain: "先に読み込む", one_line: "最初の画面に必要なものを、他より先に取りに行かせる指定。"}
  - {term: "bundle", plain: "まとめた JavaScript", one_line: "プログラムを1つか数個のファイルにまとめたもの。大きいほど開くのが遅い。"}
  - {term: "バンドル", plain: "まとめた JavaScript", one_line: "プログラムを数個のファイルにまとめたもの。大きいほど遅い。"}
  - {term: "code splitting", plain: "画面ごとに分けて読む", one_line: "全部を一度に読まず、開いた画面に必要な分だけ読み込むこと。"}
  - {term: "コード分割", plain: "画面ごとに分けて読む", one_line: "開いた画面に必要な分だけ読み込むこと。"}
  - {term: "tree-shake", plain: "使わない部分を削る", one_line: "ビルドの時に、使っていないコードを自動で取り除くこと。確認用のパネルを本番から消すのにも使う。"}
  - {term: "ツリーシェイク", plain: "使わない部分を削る", one_line: "ビルドの時に使っていないコードを自動で取り除くこと。"}
  - {term: "third-party script", plain: "他社の埋め込みプログラム", one_line: "分析・チャット・広告など他社のコード。遅さの原因になりやすいので、置く理由と担当者を決める。"}
  - {term: "AVIF", plain: "新しい軽い画像形式", one_line: "JPEG より小さく同じ見た目で出せる画像の形式。"}
  - {term: "WebP", plain: "軽い画像形式", one_line: "JPEG や PNG より小さい画像の形式。ほぼ全ブラウザで使える。"}
  - {term: "srcset", plain: "画面に合う大きさの画像を選ばせる指定", one_line: "スマホには小さい画像、大画面には大きい画像をブラウザが選べるようにする指定。"}
  - {term: "font-display", plain: "フォントが来るまでの見せ方", one_line: "ウェブフォントが届く前に文字を見せるかどうかの指定。見せないと文字が数秒消える。"}
  - {term: "size-adjust", plain: "代わりのフォントの幅合わせ", one_line: "ウェブフォントが届くまで使う代わりのフォントを、同じ幅に調整して文字が跳ねないようにする指定。"}
  - {term: "キャッシュ", plain: "一時的な保存", one_line: "一度取ったものを手元に置いて、次は速く出す仕組み。古いものが残ると直したはずの色が出ないことがある。"}
  - {term: "p95", plain: "遅い方から5%の値", one_line: "100回のうち遅い5回を除いた、95番目の速さ。平均より実感に近い。"}
  - {term: "レイテンシ", plain: "待ち時間", one_line: "頼んでから返事が来るまでの時間。"}
  - {term: "throttling", plain: "遅い環境のまね", one_line: "開発用パソコンで、遅い回線や安いスマホの速さをまねて確かめること。"}
  # ---- 開発・リリース ----
  - {term: "リポジトリ", plain: "コードの保管場所", one_line: "コードと履歴を全部置いておく場所（GitHub など）。"}
  - {term: "repository", plain: "コードの保管場所", one_line: "コードと履歴を全部置いておく場所。"}
  - {term: "ブランチ", plain: "作業用の枝", one_line: "本流を汚さずに変更を進めるための分かれ道。確認が済んだら本流に合流する。"}
  - {term: "コミット", plain: "変更の記録", one_line: "ここまでの変更にメモを付けて保存すること。"}
  - {term: "マージ", plain: "合流", one_line: "枝で作った変更を本流に取り込むこと。"}
  - {term: "プルリクエスト", plain: "取り込み依頼", one_line: "枝の変更を見てもらい、本流に取り込んでよいか確認する依頼。レビューはここで行う。"}
  - {term: "PR", plain: "取り込み依頼", one_line: "変更を見てもらい、本流に取り込んでよいか確認する依頼（プルリクエスト）。"}
  - {term: "draft PR", plain: "下書きの取り込み依頼", one_line: "まだ取り込まないでほしい印の付いた取り込み依頼。AI が機能を作ったらまずこの形で返す。"}
  - {term: "ドラフトPR", plain: "下書きの取り込み依頼", one_line: "まだ取り込まないでほしい印の付いた取り込み依頼。AI の返事はまずこの形。"}
  - {term: "ドラフト PR", plain: "下書きの取り込み依頼", one_line: "まだ取り込まないでほしい印の付いた取り込み依頼。"}
  - {term: "コードレビュー", plain: "変更の確認", one_line: "取り込む前に他の人や AI が変更を読んで、問題を指摘すること。"}
  - {term: "lint", plain: "書き方の自動検査", one_line: "コードの決まり違反（直書きの文言など）を自動で見つけて止める道具。"}
  - {term: "リンター", plain: "書き方の自動検査", one_line: "コードの決まり違反を自動で見つけて止める道具。"}
  - {term: "CI", plain: "変更ごとの自動検査", one_line: "変更を出すたびに、検査やビルドを自動で回して合否を出す仕組み。"}
  - {term: "CD", plain: "自動の公開", one_line: "検査に通った変更を自動で公開する仕組み。"}
  - {term: "CI/CD", plain: "自動検査と自動公開", one_line: "変更ごとに自動で検査し、通ったら自動で公開する流れ。"}
  - {term: "GitHub Actions", plain: "GitHub の自動検査の仕組み", one_line: "GitHub 上で、変更ごとに検査や公開を自動で回す機能。"}
  - {term: "ビルド", plain: "公開用に組み立てる", one_line: "書いたコードを、ブラウザやアプリが動かせる形に変換してまとめること。"}
  - {term: "ステージング", plain: "本番そっくりの試験場", one_line: "公開前に、本番と同じ作りで最終確認をする場所。"}
  - {term: "本番環境", plain: "実際に使われている場所", one_line: "利用者が実際に触っている公開中の環境。"}
  - {term: "環境変数", plain: "場所ごとの設定値", one_line: "試験場と本番で違う設定（接続先・鍵）を、コードの外に置く仕組み。"}
  - {term: "シークレット", plain: "秘密の鍵", one_line: "API の鍵やパスワードなど、コードや画面に出してはいけない値。"}
  - {term: "マイグレーション", plain: "データベースの形の変更", one_line: "表の列を足すなど、データベースの作りを番号順に変える手順書。全環境に同じ順で適用する。"}
  - {term: "ロールバック", plain: "前の版に戻す", one_line: "公開した変更に問題があった時、すぐ前の版に戻すこと。"}
  - {term: "feature flag", plain: "機能の切り替えスイッチ", one_line: "公開済みのコードの中で、機能を人ごとに出す・隠すスイッチ。確認用パネルの除外には使えない（本番から消す必要がある）。"}
  - {term: "フィーチャーフラグ", plain: "機能の切り替えスイッチ", one_line: "公開済みのコードの中で、機能を人ごとに出す・隠すスイッチ。"}
  - {term: "モノレポ", plain: "1つの保管場所に全部", one_line: "アプリ・サーバー・共通部品を1つのリポジトリで管理する形。"}
  - {term: "モニタリング", plain: "監視", one_line: "エラーや遅さを自動で集めて、異常があれば知らせる仕組み。"}
  - {term: "オブザーバビリティ", plain: "中で何が起きているか見える状態", one_line: "記録・指標・処理の追跡をそろえて、問題の原因を追えること。"}
  - {term: "インシデント", plain: "障害", one_line: "利用者に影響が出た問題。起きた時の手順（連絡・復旧・振り返り）を先に決める。"}
  - {term: "SLA", plain: "稼働の約束", one_line: "「月に 99.9% 動く」のように、サービス提供者が契約で約束する水準。"}
  - {term: "SLO", plain: "自分たちで決める稼働の目標", one_line: "契約ではなく内部で決める、速さや稼働率の目標。"}
  - {term: "アップタイム", plain: "動いていた時間の割合", one_line: "止まらずに動いていた時間の割合。99.9% なら月に約 43 分止まる計算。"}
  - {term: "cron", plain: "決まった時刻に動く", one_line: "毎日何時、のように決めた時刻に自動で処理を動かす仕組み。"}
  - {term: "キュー", plain: "順番待ちの列", one_line: "重い処理を列に並べて、順にこなす仕組み。失敗した処理をやり直せる。"}
  - {term: "バッチ", plain: "まとめて処理", one_line: "1件ずつではなく、夜間などにまとめて処理すること。"}
  - {term: "レートリミット", plain: "回数の上限", one_line: "一定時間に受け付ける回数の上限。超えたら待たせる。攻撃と暴走を防ぐ。"}
  - {term: "rate limit", plain: "回数の上限", one_line: "一定時間に受け付ける回数の上限。超えたら待たせる。"}
  - {term: "バックアップ", plain: "控えの複製", one_line: "データの複製を別の場所に取っておくこと。戻せるかを定期的に試す。"}
  - {term: "リストア", plain: "控えから戻す", one_line: "バックアップからデータを戻すこと。試したことがなければ、戻せないと思った方がよい。"}
  - {term: "インボックス", plain: "受け箱", one_line: "提案された学びを一度ためておく場所。正本には直接書かない。"}
  # ---- 認証・セキュリティ・個人情報 ----
  - {term: "認可", plain: "何をしてよいかの判断", one_line: "ログインした人が、どのデータを見て何を変えられるかを決めること。"}
  - {term: "OAuth", plain: "他社アカウントでログイン", one_line: "Google や Apple のアカウントを使って、パスワードを預からずにログインさせる仕組み。"}
  - {term: "SSO", plain: "会社の一括ログイン", one_line: "会社の1つのアカウントで複数のサービスに入れる仕組み。法人向けで求められる。"}
  - {term: "SAML", plain: "会社の一括ログインの古い方式", one_line: "法人向けの一括ログインで広く使われている方式。多くは有料プランの機能。"}
  - {term: "パスキー", plain: "指紋や顔でログイン", one_line: "パスワードの代わりに、端末の指紋・顔・PIN で入る方式。盗まれにくい。"}
  - {term: "passkey", plain: "指紋や顔でログイン", one_line: "パスワードの代わりに端末の指紋・顔・PIN で入る方式。"}
  - {term: "マジックリンク", plain: "メールのリンクでログイン", one_line: "パスワードなしで、メールに届いたリンクを押して入る方式。"}
  - {term: "magic link", plain: "メールのリンクでログイン", one_line: "パスワードなしで、メールに届いたリンクを押して入る方式。"}
  - {term: "MFA", plain: "二段階の確認", one_line: "パスワードに加えて、コードや指紋でもう一段確かめること。"}
  - {term: "2FA", plain: "二段階の確認", one_line: "パスワードに加えて、コードや指紋でもう一段確かめること。"}
  - {term: "OTP", plain: "一度だけ使えるコード", one_line: "SMS やアプリに届く、その時だけ有効な数字。"}
  - {term: "セッション", plain: "ログイン中の状態", one_line: "ログインしてからログアウトまで、同じ人だと覚えておく仕組み。"}
  - {term: "Cookie", plain: "ブラウザに置く小さなメモ", one_line: "ログイン状態や設定をブラウザに覚えさせる小さなデータ。ヨーロッパでは同意の表示が要るものがある。"}
  - {term: "JWT", plain: "署名つきの通行証", one_line: "ログイン済みを示す、改ざんできない短いデータ。期限を短くし、取り消し方を決める。"}
  - {term: "RLS", plain: "行ごとのアクセス制限", one_line: "データベースの各行に「誰が見てよいか」の決まりを付け、他人のデータが漏れないようにする仕組み。"}
  - {term: "最小権限", plain: "必要な分だけ許す", one_line: "人にも鍵にも、仕事に必要な権限だけを与えること。"}
  - {term: "暗号化", plain: "読めない形に変える", one_line: "鍵がないと読めない形にして保存・送信すること。"}
  - {term: "ハッシュ", plain: "元に戻せない指紋", one_line: "データから作る短い値。同じかどうかは分かるが、元には戻せない。パスワードや契約文の保存に使う。"}
  - {term: "TLS", plain: "通信の暗号化", one_line: "ブラウザとサーバーの間の通信を読めない形にする仕組み。HTTPS の中身。"}
  - {term: "HTTPS", plain: "暗号化された通信", one_line: "鍵マークの付く、盗み見されない通信。公開するサイトは必ずこれ。"}
  - {term: "DNS", plain: "ドメインの住所帳", one_line: "example.com のような名前を、サーバーの場所に結びつける仕組み。"}
  - {term: "ドメイン", plain: "ウェブの住所", one_line: "example.com のような、自分で持つウェブの名前。公開リンクは必ず自社のもので。"}
  - {term: "サブドメイン", plain: "住所の枝", one_line: "app.example.com のように、持っているドメインの前に付けた枝の名前。"}
  - {term: "XSS", plain: "他人の仕込んだ命令が画面で動く攻撃", one_line: "入力欄などから仕込まれたプログラムが、他の利用者のブラウザで動いてしまう攻撃。生の HTML を描かないことで防ぐ。"}
  - {term: "CSRF", plain: "なりすまし送信の攻撃", one_line: "ログイン中の人に、気づかないうちに別サイトから操作を送らせる攻撃。"}
  - {term: "SQLインジェクション", plain: "入力欄からデータベースを操る攻撃", one_line: "入力欄に命令文を書き込んで、データベースを勝手に読み書きする攻撃。"}
  - {term: "プロンプトインジェクション", plain: "AI への命令のすり替え", one_line: "文書やメールの中に AI 向けの命令を隠し、AI に意図しない操作をさせる攻撃。"}
  - {term: "DDoS", plain: "大量アクセスで止める攻撃", one_line: "大量のアクセスを送ってサービスを止める攻撃。防火壁や回数の上限で防ぐ。"}
  - {term: "SOC2", plain: "安全管理の第三者監査", one_line: "サービス提供者が安全にデータを扱っているかを第三者が確かめた報告書。法人顧客が求める。"}
  - {term: "ISO 27001", plain: "情報安全管理の国際規格", one_line: "情報の安全管理の仕組みを持っていることを示す国際規格の認証。"}
  - {term: "PCI DSS", plain: "カード情報の安全基準", one_line: "カード番号を扱う時の安全基準。決済代行に任せれば自分で番号を持たずに済む。"}
  - {term: "GDPR", plain: "ヨーロッパの個人情報の法律", one_line: "EU の利用者の個人情報を扱うなら守る法律。同意・削除・持ち出しの権利などを求める。"}
  - {term: "CCPA", plain: "カリフォルニアの個人情報の法律", one_line: "カリフォルニア州の住民の個人情報についての法律。"}
  - {term: "APPI", plain: "日本の個人情報保護法", one_line: "日本の個人情報の取り扱いを定めた法律。"}
  - {term: "HIPAA", plain: "米国の医療情報の法律", one_line: "米国で健康・医療の情報を扱う時の法律。扱わないならその分野を避ける。"}
  - {term: "DPA", plain: "個人情報の委託契約", one_line: "個人情報を預けるサービスと結ぶ、取り扱いの約束の契約書。"}
  - {term: "データ保持期間", plain: "持っておく期間", one_line: "個人情報をいつまで持つかの決め。期限が来たら消す。ポリシーに書いた期間と実際を合わせる。"}
  - {term: "匿名化", plain: "個人が分からない形にする", one_line: "名前やメールを消し、誰のデータか分からない形にすること。"}
  - {term: "利用規約", plain: "使う時の約束", one_line: "サービスを使う人と提供者の間の決まり。受け入れた時の文章をそのまま残す。"}
  - {term: "プライバシーポリシー", plain: "個人情報の扱い方の説明", one_line: "何を集め、何に使い、いつまで持つかを利用者に説明する文書。実際の扱いと一致させる。"}
  - {term: "Cookie同意", plain: "追跡の了解を取る表示", one_line: "ヨーロッパなどで、分析や広告の Cookie を使う前に出す了解の表示。"}
  # ---- 決済・事業 ----
  - {term: "チャージバック", plain: "カード会社経由の取り消し", one_line: "買い手がカード会社に申し立てて支払いを取り消すこと。手数料が売り手にかかる。"}
  - {term: "3Dセキュア", plain: "カードの追加確認", one_line: "カード決済の時にカード会社が本人を追加で確認する仕組み。不正利用の責任が移る。"}
  - {term: "statement descriptor", plain: "明細に出る店名", one_line: "カードの明細に印字される売り手の名前。法人名か屋号・サイト名と一致していないと決済会社に拒否される。"}
  - {term: "ステートメントディスクリプター", plain: "明細に出る店名", one_line: "カードの明細に印字される売り手の名前。法人名かサイト名と一致させる。"}
  - {term: "DBA", plain: "屋号", one_line: "法人名とは別に商売で使う名前（doing business as）。"}
  - {term: "LLC", plain: "米国の有限責任会社", one_line: "米国でよく使われる会社の形。個人の財産と会社の責任を分ける。"}
  - {term: "Connect", plain: "出品者に代わりに払う仕組み", one_line: "決済代行が、売り場の運営者を通して個々の売り手にお金を分配する仕組み。方式は作成後に変えられない。"}
  - {term: "サブスクリプション", plain: "定期の支払い", one_line: "月や年ごとに自動で支払ってもらう形。"}
  - {term: "フリーミアム", plain: "基本無料・一部有料", one_line: "基本は無料で使え、便利な機能だけ有料にする形。"}
  - {term: "free tier", plain: "無料で使える範囲", one_line: "サービスがお金を取らずに使わせてくれる上限。超えた時の挙動（止まる・課金）を確かめる。"}
  - {term: "ロックイン", plain: "乗り換えにくさ", one_line: "そのサービスを使い続けないと困る度合い。データの持ち出しやすさで決まる。"}
  - {term: "B2B", plain: "会社向け", one_line: "お客さんが会社である商売。"}
  - {term: "B2C", plain: "個人向け", one_line: "お客さんが個人である商売。"}
  - {term: "ICP", plain: "いちばん合うお客さん像", one_line: "最初に狙う、いちばん困っていてお金を払うお客さんの具体像。"}
  - {term: "KPI", plain: "追う数字", one_line: "うまくいっているかを判断するために毎週見る数字。"}
  - {term: "コホート", plain: "同じ時期に始めた人の群", one_line: "同じ月に登録した人たちをまとめ、その後どれだけ残ったかを追う見方。"}
  - {term: "チャーン", plain: "やめる人の割合", one_line: "一定期間に解約や離脱をした人の割合。"}
  - {term: "CAC", plain: "1人の客を取るのにかかる費用", one_line: "広告や営業の費用を、増えた客の数で割ったもの。"}
  - {term: "LTV", plain: "1人の客が払う総額", one_line: "1人の客が使い続ける間に払ってくれる金額の見込み。CAC より大きくないと続かない。"}
  - {term: "ARR", plain: "年ごとの定期収入", one_line: "毎年入ってくる定期の売上の合計（MRR の12倍）。"}
  - {term: "ユニットエコノミクス", plain: "1人あたりの採算", one_line: "客1人から得る金額と、1人にかかる費用の差。"}
  - {term: "GTM", plain: "売り出し方の計画", one_line: "誰に、どこで、どう知らせて売るかの計画（go-to-market）。"}
  - {term: "LP", plain: "紹介ページ", one_line: "製品を説明して登録や購入に誘う1枚のウェブページ（ランディングページ）。"}
  - {term: "CTA", plain: "押してほしいボタン", one_line: "「無料で始める」など、ページで一番してほしい行動のボタン。"}
  - {term: "DD", plain: "買い手の調査", one_line: "会社や製品を買う前に、買い手が数字と中身を確かめること（デューデリジェンス）。"}
  - {term: "デューデリジェンス", plain: "買い手の調査", one_line: "買う前に、買い手が数字と中身を確かめること。"}
  - {term: "NFR", plain: "機能以外の要件", one_line: "速さ・同時に使える人数・対応端末・止まらない度合いなど、機能ではない要件。"}
  - {term: "PRD", plain: "作る物の説明書", one_line: "何を作り、何を作らないかを、必須と「あれば良い」に分けて書いた文書。"}
  - {term: "MVP", plain: "最小の試作", one_line: "欲しがる人がいるかを確かめるための、最小限の機能だけの版。"}
  - {term: "Tier", plain: "深さの段", one_line: "試作／社内ツール／公開プロダクト／課金・規制あり、のように、どこまで本気で作るかの段。"}
  - {term: "ロードマップ", plain: "いつ何を作るかの予定表", one_line: "これから作る順番と時期の見取り図。"}
  - {term: "スプリント", plain: "1〜2週間の作業区切り", one_line: "短い期間で作って見せて直す、その1区切り。"}
  - {term: "Build vs Buy", plain: "作るか買うか", one_line: "自分で作る・API を使う・全部入りを買うを、作る時間・保守・乗り換え費の総額で比べること。"}
  - {term: "TCO", plain: "持ち続ける総費用", one_line: "買う値段だけでなく、保守・学習・乗り換えまで含めた総額。"}
  - {term: "サンセット", plain: "終わらせ方", one_line: "サービスを閉じる時の手順。利用者への知らせ、データの返却、削除。"}
  # ---- 技術の形 ----
  - {term: "SPA", plain: "1枚のページで動くアプリ", one_line: "ページを切り替えずに中身だけ差し替える作り。最初の読み込みが重くなりがち。"}
  - {term: "SSG", plain: "先に全部作っておく方式", one_line: "ページをビルドの時に全部作って置いておく方式。速くて安い。更新は再ビルド。"}
  - {term: "ISR", plain: "作り置きを時々作り直す方式", one_line: "作り置きのページを、決めた間隔や更新の合図で作り直す方式。"}
  - {term: "CSR", plain: "ブラウザで画面を作る方式", one_line: "空のページを送って、ブラウザ側で中身を組み立てる方式。検索に弱い。"}
  - {term: "REST", plain: "窓口の定番の形", one_line: "URL ごとに取る・作る・直す・消すを対応させた API の作り方。"}
  - {term: "GraphQL", plain: "欲しい項目だけ頼める窓口", one_line: "画面が必要な項目だけを1回で頼める API の形。"}
  - {term: "WebSocket", plain: "つなぎっぱなしの通信", one_line: "ブラウザとサーバーをつないだままにして、すぐに反映させる通信。"}
  - {term: "ORM", plain: "データベースをプログラムの言葉で扱う道具", one_line: "SQL を直接書かずにデータを読み書きする道具。"}
  - {term: "オブジェクトストレージ", plain: "ファイルの置き場", one_line: "画像や動画などのファイルを大量に置く場所（S3 など）。"}
  - {term: "S3", plain: "ファイルの置き場の定番", one_line: "Amazon のファイル置き場。同じ形の窓口を多くの会社がまねている。"}
  - {term: "バケット", plain: "ファイル置き場の入れ物", one_line: "ファイル置き場の中の、1つのまとまり（フォルダのようなもの）。公開・非公開を間違えない。"}
  - {term: "コンテナ", plain: "まるごと梱包した実行環境", one_line: "プログラムと必要な部品を1つに梱包して、どこでも同じに動かす形。"}
  - {term: "Docker", plain: "梱包の定番の道具", one_line: "プログラムをコンテナに梱包する定番の道具。"}
  - {term: "TypeScript", plain: "型つきの JavaScript", one_line: "値の種類を書けるようにした JavaScript。間違いをビルドの時に見つける。"}
  - {term: "React", plain: "画面を部品で組む定番の道具", one_line: "画面を部品の組み合わせで作る、最も普及した道具。"}
  - {term: "Next.js", plain: "React の土台", one_line: "React でウェブを作るための、サーバー側の描画や公開まで含んだ土台。"}
  - {term: "Vite", plain: "速い開発用の道具", one_line: "開発中の表示とビルドを速くする道具。"}
  - {term: "Expo", plain: "スマホアプリを作る土台", one_line: "React でスマホのアプリを作り、ストアに出すまでを楽にする土台。"}
  - {term: "React Native", plain: "React でスマホアプリ", one_line: "React の書き方で iPhone と Android のアプリを作る仕組み。"}
  - {term: "Headless CMS", plain: "画面を持たない記事置き場", one_line: "文章や画像を編集して API で渡すだけのサービス。見た目は自分のアプリで作る。"}
  - {term: "ヘッドレス", plain: "画面を持たない", one_line: "データや機能だけを API で提供し、見た目は使う側が作る形。"}
  - {term: "CMS", plain: "記事や文章の管理画面", one_line: "お客さんや担当者が、コードを触らずに文章や画像を更新できる仕組み。"}
  - {term: "Markdown", plain: "記号で書く文書", one_line: "# や - などの記号で見出しや箇条書きを書く軽い文書の形。"}
  - {term: "YAML", plain: "人が読める設定の書き方", one_line: "字下げで階層を表す、人も機械も読めるデータの書き方。カタログはこの形。"}
  - {term: "JSON", plain: "機械向けのデータの書き方", one_line: "波かっこと引用符で書く、プログラム同士でやり取りする定番のデータの形。"}
  - {term: "UUID", plain: "ぶつからない長い ID", one_line: "どこで作っても重ならない、長いランダムな識別子。"}
  - {term: "UTC", plain: "世界共通の時刻", one_line: "時差のない基準の時刻。保存は UTC、表示は利用者の時間帯で。"}
  - {term: "タイムゾーン", plain: "時間帯", one_line: "地域ごとの時刻のずれ。保存と表示で混ぜると日付がずれる。"}
  - {term: "エンドポイント", plain: "窓口の1つの入口", one_line: "API の中の、1つの機能に対応する URL。"}
  - {term: "インデックス", plain: "検索を速くする索引", one_line: "データベースで、よく探す列に付ける索引。ないと件数が増えた時に遅くなる。"}
  - {term: "フルテキスト検索", plain: "文章の中身で探す", one_line: "文章の中の言葉で探す仕組み。データベース内蔵のものから始められる。"}
  - {term: "埋め込み", plain: "意味を数字にしたもの", one_line: "文章や画像の意味を数字の列にして、似たものを探せるようにしたもの（ベクトルの元）。"}
  - {term: "トランザクション", plain: "全部成功か全部なしか", one_line: "複数の書き込みを、全部成功するか1つも反映しないかのどちらかにする仕組み。お金の処理に必須。"}
  # ---- AI ----
  - {term: "LLM", plain: "文章を作る AI", one_line: "大量の文章から学んで、質問に文章で答える AI の仕組み。"}
  - {term: "プロンプト", plain: "AI への指示文", one_line: "AI に渡す指示や質問の文。"}
  - {term: "コンテキスト", plain: "AI に渡す前提の情報", one_line: "AI が答える前に読ませる資料や決まり。多すぎると高く遅く、少ないと的外れになる。"}
  - {term: "RAG", plain: "資料を探してから答える AI", one_line: "質問に関係する資料を先に探し、それを読んで答えさせる方式。でたらめを減らす。"}
  - {term: "ハルシネーション", plain: "AI のでたらめ", one_line: "AI が事実でないことをもっともらしく言うこと。出典を付けさせて防ぐ。"}
  - {term: "ファインチューニング", plain: "AI の追加学習", one_line: "自分のデータで AI を追加で学習させること。多くの場合は資料を渡す方式（RAG）で足りる。"}
  - {term: "エージェント", plain: "自分で手を動かす AI", one_line: "指示を受けて、調べたり書いたり直したりを自分で進める AI。"}
  - {term: "agent", plain: "自分で手を動かす AI", one_line: "指示を受けて、調べたり書いたり直したりを自分で進める AI。"}
  - {term: "MCP", plain: "AI と道具をつなぐ共通の口", one_line: "AI がカタログや外部サービスを読み書きするための共通の接続方式。"}
  - {term: "AI gateway", plain: "AI の窓口のまとめ役", one_line: "複数の AI 会社への接続・鍵・費用の上限を1か所でまとめる仕組み。"}
  - {term: "Skill", plain: "AI への手順書の束", one_line: "AI がある種類の仕事をする時に読む、手順と資料のまとまり。Blueprint はこの形で配る。"}
  - {term: "build in public", plain: "作る過程を公開しながら進める", one_line: "作っている途中の進み具合や数字を SNS などで見せ、早い段階から関心を集める売り出し方。"}
  - {term: "reduced-motion", plain: "動きを減らす設定", one_line: "OS の「視差効果を減らす」などの設定。入っている人には、動かさず瞬時に切り替える。"}
  - {term: "MIT", plain: "ほぼ自由に使える公開ライセンス", one_line: "著作権表示を残せば、商用でも無料で使い、直し、配れる公開部品の利用条件。"}
  - {term: "確認済み", plain: "公式ページで確かめた", one_line: "料金や上限を公式ページで見て、確認日を書いたこと（カタログの verified: true）。"}
