  - {term: "TWA", plain: "ウェブをそのまま Android アプリにする方式", one_line: "作ったウェブを Google Play に載せられる。"}
  - {term: "SEO", plain: "検索で見つけてもらう工夫", one_line: "Google などの検索結果に出やすくすること。"}
  - {term: "ASO", plain: "ストアで見つけてもらう工夫", one_line: "アプリストアの検索に出やすくすること。"}
