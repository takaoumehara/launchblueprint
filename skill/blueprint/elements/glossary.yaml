  - {term: "RTL", plain: "右から左に書く言語", one_line: "アラビア語やヘブライ語のように右から左に読む言語。画面も左右が反転する。"}
  - {term: "CJK", plain: "中国語・日本語・韓国語", one_line: "漢字を使う3つの言語。文字の形と行の折り返しの決まりが言語ごとに違う。"}
  - {term: "fallback locale", plain: "翻訳がない時の代わりの言語", one_line: "ある言語に翻訳がまだない文言を、別の言語で出す決まり。文言の名前をそのまま出さない。"}
  - {term: "hreflang", plain: "言語ごとのページの対応付け", one_line: "同じページの各言語版を検索エンジンに知らせる印。"}
  - {term: "TMS", plain: "翻訳管理の道具", one_line: "翻訳者と文言のやり取りを管理するサービス。"}
  - {term: "logical properties", plain: "左右ではなく始まり・終わりで書く余白", one_line: "「左の余白」ではなく「行の始まりの余白」と書く CSS の書き方。右から左の言語で自動的に反転する。"}
  # ---- 性能 ----
  - {term: "performance budget", plain: "速さの予算", one_line: "ページごとに決める速さと重さの上限。超えたら直すまで出さない。"}
  - {term: "性能予算", plain: "速さの予算", one_line: "ページごとに決める速さと重さの上限。超えたら直すまで出さない。"}
