  # ---- アクセシビリティ ----
  - {term: "accessibility", plain: "誰でも使えるようにすること", one_line: "目・耳・手・認知の違いがあっても使えるように作ること。"}
  - {term: "アクセシビリティ", plain: "誰でも使えるようにすること", one_line: "目・耳・手・認知の違いがあっても使えるように作ること。"}
  - {term: "a11y", plain: "誰でも使えるようにすること", one_line: "accessibility の略（a と y の間に11文字）。"}
  - {term: "WCAG", plain: "アクセシビリティの国際基準", one_line: "ウェブを誰でも使えるようにするための国際的な基準。目標は普通 2.2 の AA。"}
  - {term: "WCAG 2.2 AA", plain: "アクセシビリティ基準の標準の合格ライン", one_line: "WCAG の版 2.2 で、多くの法律や契約が求める中間の合格ライン。"}
  - {term: "screen reader", plain: "画面を読み上げる道具", one_line: "目の見えない人などが使う、画面の文字と部品を声で読む道具。名前のないボタンは「ボタン」としか読めない。"}
  - {term: "スクリーンリーダー", plain: "画面を読み上げる道具", one_line: "画面の文字と部品を声で読む道具。名前のないボタンは「ボタン」としか読めない。"}
  - {term: "contrast ratio", plain: "文字と背景の明るさの差", one_line: "文字が背景からどれだけ浮き上がるかの数値。本文は 4.5:1 以上、大きな文字やアイコンは 3:1 以上。"}
  - {term: "コントラスト比", plain: "文字と背景の明るさの差", one_line: "本文は 4.5:1 以上、大きな文字やアイコンは 3:1 以上。"}
  - {term: "focus ring", plain: "今どこにいるかの枠", one_line: "キーボードで操作する時、今選ばれている部品を囲む枠。消してはいけない。"}
  - {term: "フォーカスリング", plain: "今どこにいるかの枠", one_line: "キーボード操作で今選ばれている部品を囲む枠。消してはいけない。"}
  - {term: "focus", plain: "今の操作位置", one_line: "キーボードの入力が届く、今選ばれている部品。小窓を閉じたら開いた場所に戻す。"}
  - {term: "フォーカス", plain: "今の操作位置", one_line: "キーボードの入力が届く、今選ばれている部品。"}
  - {term: "focus trap", plain: "小窓の中に操作を閉じ込める", one_line: "小窓が開いている間、Tab キーが後ろの画面に抜けないようにすること。"}
  - {term: "inert", plain: "触れない状態", one_line: "小窓の後ろの画面を、見えるが押せず読まれない状態にする指定。"}
  - {term: "accessible name", plain: "読み上げ用の名前", one_line: "アイコンだけのボタンや画像に付ける、スクリーンリーダーが読む名前。見た目ではなく何をするかを書く。"}
  - {term: "aria", plain: "読み上げ用の補助情報", one_line: "HTML に足して、スクリーンリーダーに役目や状態を伝える印。素の部品を正しく使えば多くは不要。"}
