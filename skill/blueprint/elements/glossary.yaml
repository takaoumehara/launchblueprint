# ことば（専門用語 → ふつうの日本語 ＋ 1行の説明）。アプリと AI が同じ言い換えを使う
# 書式：terms[] = term（カタログ・参照・アプリに出る表記そのまま。英語の略語は大文字小文字もそのまま）, plain（ふつうの日本語・短く）, one_line（1文で何か）
# 同じ物の別表記（MoR / Merchant of Record、component map / コンポーネント対応表）は別々の行にする。アプリは長い term から順に置き換えるので、
# 他のことばの一部になる短いカタカナ（「ログ」「シート」「フォーム」など）は入れない。ふつうの日本語で通じる語も入れない（専門用語だけ）
domain: glossary
updated: '2026-11-02'
