lessons:
- id: la.launch-plan-t14
  principle: "Write the launch plan as dated rows from T-14 to T+30, each with an owner, before announcing a date."
  anti_pattern: "A launch date with no rows, or rows with no owner."
  why: "Store review, processor review and DNS each slip by days; a dated plan absorbs the slip instead of the launch."
  check: "Do T-14, T-7, T-1, T0, T+1, T+7 and T+30 rows exist, each with an owner?"
  see_also: [lc.gtm.40]
  verified: false
- id: la.rollback-owner
  principle: "Name one person who decides rollback and the numeric condition (e.g. error rate above 2%) before T0."
  anti_pattern: "Deciding in the group chat while the error rate climbs."
  why: "A rollback decided by committee happens an hour late."
  check: "Is the rollback condition a number, and is exactly one person named to call it?"
  see_also: [la.launch-plan-t14, mon.sentry]
  verified: false
- id: la.support-on-launch-day
  principle: "On launch day and the day after, someone is on support and watching errors in two-hour shifts, with the first reply template ready."
  anti_pattern: "Everyone watching the upvotes while the first bug report sits for half a day."
  why: "The first users decide the reviews; a fast first reply is worth more than a feature."
  check: "Is the support and error-watch rota for T0 and T+1 written with names?"
  see_also: [sup.email, ho.runbook-top5]
  verified: false
- id: la.preview-noindex
  principle: "Preview and staging URLs are noindex and never used in a public link; the public domain is the company domain."
  anti_pattern: "A *.vercel.app link in the launch post, or preview pages in search results."
  why: "Preview URLs leak, rank, and break when the deployment changes."
  check: "Do preview and staging send noindex, and does the launch post use only the company domain?"
  see_also: [R-004, lc.gtm.43]
  verified: false
- id: la.pr-disclosure
  principle: "Every paid or gifted mention (ads, influencers, affiliates) carries the disclosure the country requires, checked before publishing."
  anti_pattern: "An influencer post without a PR label, or an affiliate link without a disclosure."
  why: "Stealth-marketing rules (Japan) and endorsement guides (US FTC) are enforced on the brand, not the poster."
  check: "Does every paid or gifted mention have the disclosure, and is it on the pre-publish checklist?"
  see_also: [lc.legal.31]
  verified: false
- id: la.seo-basics
  principle: "Before launch, every public page has title, description, canonical and OG image; sitemap and robots exist; and llms.txt is published."
  anti_pattern: "Launching with default titles and no sitemap, then fixing SEO 'later'."
  why: "Search and AI answers index the launch-day version; fixing it later costs months."
  check: "Do all public pages pass title/description/canonical/OG, and are sitemap.xml, robots.txt and llms.txt live?"
  see_also: [gtm.seo, lc.gtm.43]
  verified: false
