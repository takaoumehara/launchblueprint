- id: db.supabase
  name: Supabase (Postgres)
  what: Postgres＋認証＋ストレージ＋Realtime の一式
  best_for: リレーショナルなデータ、SQL を使いたい
  avoid_when: ''
  pricing_bands:
    free: $0：500MB、1週間無操作で一時停止、2プロジェクトまで
    usd5: —（Free と Pro の間の帯はない）
    usd10: —
    usd100: $25〜：Pro（8GB、毎日バックアップ7日、休止なし）。$100帯なら Compute 増強 or PITR（$100/月）
  limits: Free は休止あり・バックアップなし
  lock_in: 低：標準 Postgres なので移行しやすい
  liability_compliance: Team（$599〜）で SOC2/ISO27001、HIPAA はアドオン
  security: RLS を必ず有効化。service_role 鍵をクライアントに出さない
