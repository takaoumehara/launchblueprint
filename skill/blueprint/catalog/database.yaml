- id: db.neon
  name: Neon (Postgres)
  what: サーバーレス Postgres、ブランチ機能
  best_for: プレビュー環境ごとにDBを分けたい
  avoid_when: ''
  pricing_bands:
    free: $0：1プロジェクト1GB（合計20GB）、100CU時間/プロジェクト、5分で自動停止、6時間の履歴
