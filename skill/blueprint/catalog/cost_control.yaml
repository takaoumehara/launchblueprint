    verified: true
- id: cc.github-actions-budget
  name: GitHub Actions の予算
  what: 75/90/100% で通知。「上限で停止」を選ぶと止まる
  best_for: 非公開リポジトリで CI の分数が増え始めた時
  avoid_when: 公開リポジトリ（無料・無制限）
  pricing_bands:
    free: 公開リポジトリは無料。非公開は無料枠内で止めるなら予算 $0
    usd5: —
    usd10: —
    usd100: 超過 Linux 1 分 $0.006
  limits: 「上限で停止」を選ばないと通知だけ
  lock_in: 低
  liability_compliance: —
  security: —
  pairs_well_with: [ci.github-actions]
  source:
    url: https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-github-actions/managing-your-spending-limit-for-github-actions
    checked: '2026-11-02'
    verified: true
lessons:
- id: cc.alert-50-80
  principle: "Set alerts at 50% and 80% of every free tier and of the monthly budget, delivered to two people."
  anti_pattern: "Finding out at 100% when the service silently stops or the bill arrives."
  why: "Free tiers stop without warning; 80% gives time to upgrade or throttle before users notice."
  check: "Does every paid or capped service have a 50% and an 80% alert going to two people?"
  see_also: [cc.supabase-spend-cap, cc.vercel-spend]
  verified: false
- id: cc.kill-switch-tested
  principle: "Have one switch that disables the costly features (AI, SMS, uploads) and test it once before launch."
  anti_pattern: "A kill switch that exists in a doc but was never flipped."
  why: "An untested switch is a hope; abuse arrives at night and the first use must work."
  check: "Was the kill switch flipped on and off in staging or production within the last 90 days?"
  see_also: [pr.free-tier-cap, dp.ai-usage-caps]
  verified: false
- id: cc.commercial-terms-before-first-sale
  principle: "Before the first sale, read the free plan's commercial-use terms of every service and move the ones that forbid it."
  anti_pattern: "Taking the first payment on a hobby plan that bans commercial use."
  why: "The first sale flips you into violation on several services at once, and forced upgrades land the same week."
  check: "Is every service's free plan confirmed commercial-OK, or already on a paid plan, before the first sale?"
  see_also: [R-004, host.vercel]
  verified: false
- id: cc.monthly-cost-sheet
  principle: "Keep one sheet with every vendor, plan, monthly cost, free-tier usage % and the date it was checked; review it monthly."
  anti_pattern: "Costs spread across a dozen billing emails nobody opens."
  why: "The sheet is where the 2x-month and the forgotten subscription show up, and it is the infra line of the data room."
  check: "Was the cost sheet updated within the last 31 days?"
  see_also: [dd.infra, lc.finance.65]
  verified: false
- id: cc.retry-with-breaker
  principle: "Every call to a metered API (AI, SMS, email) has a retry limit, a circuit breaker and a daily spend ceiling."
  anti_pattern: "Infinite retries on a failing LLM call."
  why: "A retry loop against a paid API is the fastest way to burn a month's budget in a night."
  check: "Do all metered API calls have a max-retry, a breaker and a daily ceiling?"
  see_also: [lc.n36, dp.ai-usage-caps]
  verified: false
