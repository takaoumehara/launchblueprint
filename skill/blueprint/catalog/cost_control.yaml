# Blueprint Catalog — cost_control（費用の上限・通知・止め方）
# 提供：CREATIVITY IS EVERYWHERE, LLC ／ 2026-11-02 に公式ドキュメントで確認
domain: cost_control
updated: '2026-11-02'
