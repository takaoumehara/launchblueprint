lessons:
- id: mail.sms-a2p-required
  principle: "For US business SMS, sender registration such as A2P 10DLC is required with every vendor. A public page where the recipient agrees to receive SMS (opt-in) is a common reason a registration is rejected."
  anti_pattern: "Switching SMS vendors to skip registration, or submitting registration without a public opt-in page the reviewer can open."
  why: "The registration is a carrier rule, not a vendor feature. Changing vendors does not remove it, and a missing opt-in page fails the review."
  check: "Is there a public opt-in page, and is sender registration treated as required no matter which SMS vendor is used?"
  see_also: [sms.twilio, sms.telnyx, sms.plivo]
  verified: false
- id: mail.sms-no-personal-path
  principle: "Customer-facing SMS must not use a personal SIM, a consumer phone as a gateway, or an email-to-SMS path. Those routes can look like person-to-person traffic and risk the number being blocked."
  anti_pattern: "Sending business messages through a personal SIM or an old phone in order to skip sender registration."
  why: "Carriers treat this as a rules violation; delivery is also unreliable."
  check: "Does the customer-facing stack use a registered business sender, with no personal SIM, phone gateway, or email-to-SMS path?"
  see_also: [mail.sms-a2p-required, mail.sms-mock-first]
  verified: false
- id: mail.sms-mock-first
  principle: "From the first development slice, include an SMS mock that shows the message on screen and does not send. Real sending waits for a registered sender and an approved path."
  anti_pattern: "Wiring a live SMS vendor on day one, or blocking all notification work until registration is approved."
  why: "A mock lets product and design review copy and timing without hitting registration, cost, or accidental sends to real people."
  check: "Can a developer trigger the SMS flow and see the message on screen without a message leaving the app?"
  see_also: [mail.sms-a2p-required, mail.sms-no-personal-path]
  verified: false
- id: mail.sms-official-before-ads
  principle: "Do not add an SMS or messaging vendor found only in an advertisement to the catalog, and do not use it in a customer stack, until official documentation, pricing and terms are checked."
  anti_pattern: "Putting an ad-found vendor next to verified options, or choosing it on a landing-page claim."
  why: "Ad claims are not a source. Unchecked vendors hide registration, data-use and price surprises."
  check: "Is every SMS vendor in the catalog backed by an official URL, and are unofficial prices marked unverified?"
  see_also: [mail.sms-a2p-required]
  verified: false

