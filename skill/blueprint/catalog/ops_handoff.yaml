lessons:
- id: ho.access-inventory
  principle: "Keep one list of every account, key, domain and billing card: owner, recovery method, 2FA, who else can get in."
  anti_pattern: "Access that lives in one person's head and phone."
  why: "A lost phone or a sick founder should not stop deploys, payouts or domain renewals."
  check: "Can a second person, using only the list, log into every service today?"
  see_also: [ho.bus-factor-two, dd.ip]
  verified: false
- id: ho.company-owned-accounts
  principle: "Every vendor account, domain and store listing is registered to a company email and stored in the shared vault, never to a personal address."
  anti_pattern: "Signing up with a personal Gmail 'for now'."
  why: "Transferring accounts out of a personal name takes weeks and blocks a sale or a handoff."
  check: "Does any vendor account use a personal email? (target: zero)"
  see_also: [dd.ip, biz.processor-account-per-brand]
  verified: false
- id: ho.runbook-top5
  principle: "Write a runbook for the five most likely failures: detection, first action, customer message template, recovery check."
  anti_pattern: "Debugging from memory at 3 a.m. with the founder as the only one who knows."
  why: "Most incidents repeat; the runbook is what lets a second person or an AI agent act."
  check: "Does the runbook cover five failures with the four fields each?"
  see_also: [lc.operate.58, mon.sentry]
  verified: false
- id: ho.contractor-ip-assignment
  principle: "Before a contractor's first commit, sign an IP assignment and confidentiality agreement, and keep it in the data room."
  anti_pattern: "Paying a freelancer through a marketplace and assuming the code is yours."
  why: "Without assignment the contractor keeps rights, and due diligence stops on it."
  check: "Is a signed IP assignment on file for every non-employee who committed code or designs?"
  see_also: [dd.ip, dd.contracts]
  verified: false
- id: ho.bus-factor-two
  principle: "Two people can deploy, restore a backup, pay the bills and answer support; test it by having the second person do each once."
  anti_pattern: "One person for everything, with 'documentation' as the backup plan."
  why: "A single point of failure in people is the most common cause of a product dying while profitable."
  check: "Has a second person performed deploy, restore, payment and support in the last 90 days?"
  see_also: [ho.access-inventory, bk.restore-drill-timed]
  verified: false
- id: ho.offboarding-rotate
  principle: "On the day someone leaves, remove their access and rotate every shared key they could have seen."
  anti_pattern: "Leaving old contractors in the vault and the repo."
  why: "Forgotten access is the quietest breach path, and a sale's due diligence asks for the offboarding log."
  check: "Is there an offboarding entry with the date for every departed person, and were keys rotated?"
  see_also: [dp.retire-unused-keys, ho.access-inventory]
  verified: false
- id: ho.hire-trigger-written
  principle: "Write the trigger for the first hire or contractor (e.g. ops over 10 hours a week for four weeks, or support response over the target), and start with a scoped contractor task before a hire."
  anti_pattern: "Hiring on a feeling, or never, while the founder does support at midnight."
  why: "A numeric trigger stops both premature hiring and burnout; a scoped task tests the handoff cheaply."
  check: "Is the hiring trigger a number, and is it being measured?"
  see_also: [lc.strategy.10, ho.runbook-top5]
  verified: false
