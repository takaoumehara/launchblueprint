- id: pm.seats
  name: 席数×プラン（B2B）
  what: 使う人数ごとに月額。プランで機能を分ける
  best_for: 会社やチームで使うもの。管理者が人数を決められる
  avoid_when: 1人利用が主、または席を共有されやすいもの
  pricing_bands:
    free: 決済側の追加料金なし
    usd5: —
    usd10: —
    usd100: —
  limits: 年払い割引（現金が先に入る）と、途中の席の増減の日割り
  lock_in: 低
  liability_compliance: 請求書払い・購買部門の要件（PO・VAT 番号）が出てくる
  security: SSO・監査ログの要求が来たら scale_readiness の段を見る
  pairs_well_with: [pay.stripe-checkout, auth.clerk]
  source:
    url: https://stripe.com/pricing
    checked: '2026-11-03'
    verified: true
lessons:
- id: pr.unit-cost-before-price
  principle: "Before setting a price, write the cost per user (AI tokens, SMS, egress, storage, support minutes) at 1x and 10x users and the gross margin at each."
  anti_pattern: "Selling a flat monthly price for a feature whose cost grows with every use."
  why: "AI and messaging costs scale with usage; a flat price can go negative-margin without anyone noticing until the bill arrives."
  check: "Is the gross margin at 10x users written down with the formula?"
  see_also: [pr.free-tier-cap, dp.ai-usage-caps]
  verified: false
  occurrences: 1
  learned: '2026-11-04'
  field_notes:
  - '2026-11-04: for done-for-you services, price from measured hours times the target hourly rate, not from what the tools cost: $99 for 2 hours of work a month is $23-46 an hour and caps revenue at what one person can serve.'
  claims:
  - id: pr.unit-cost-before-price.c1
    claim: 'Website-builder entry plans: $19/month billed annually ($25 monthly) for one; $22/month annual ($25 monthly) for another; a local-business suite lists $99 and $399 per month.'
    source:
      url: https://www.squarespace.com/pricing
      checked: '2026-11-04'
      verified: true
    note: A submission said $16/month for the first builder; the official page says $19 (corrected). Other figures from durable.com/pricing and thryv.com/pricing the same day.
  - id: pr.unit-cost-before-price.c2
    claim: Local-SEO tools at $41/$54/$65 per location per month and done-for-you plans at $499/$1,299 per month on 12-month terms; another vendor publishes no price (third-party aggregators say $299-$449 per month).
    source:
      url: null
      checked: '2026-11-04'
      verified: false
    note: from another agent's research, not re-read
- id: pr.cancel-as-easy-as-signup
  principle: "Cancelling takes no more clicks than signing up, works without contacting support, and is confirmed by email."
  anti_pattern: "Hiding cancellation behind a chat, a phone call or a 'retention' maze."
  why: "Regulators (FTC click-to-cancel, EU consumer rules) penalise it, and chargebacks cost more than the saved churn."
  check: "Can a user cancel in the same number of clicks as signing up, with no human in the loop?"
  see_also: [pm.free-trial, pr.refund-policy-written]
  verified: false
- id: pr.free-tier-cap
  principle: "Every free tier has a hard cap on the costly resource and a kill switch tied to the monthly cost ceiling."
  anti_pattern: "Unlimited free usage of AI, SMS or storage 'for now'."
  why: "Abuse and virality both arrive overnight; without a cap the free tier becomes the biggest line on the bill."
  check: "Does each free tier have a numeric cap and a tested kill switch?"
  see_also: [cc.kill-switch-tested, pm.freemium]
  verified: false
- id: pr.store-fee-in-price
  principle: "If the product sells inside an app store, price from the net after the store fee, and never show a cheaper web price inside the app."
  anti_pattern: "Copying the web price into in-app purchase and discovering the margin is gone, or linking out to a cheaper web checkout from inside the app."
  why: "Store fees change the margin, and store rules reject apps that steer users to outside payment."
  check: "Is the in-app price computed from the net after the store fee, and is there no in-app link to a cheaper web price?"
  see_also: [policy.apple.3_1_1, policy.google.payments]
  verified: false
- id: pr.refund-policy-written
  principle: "Write the refund and chargeback policy before the first sale, and use the same text at checkout, in the terms and in the support macro."
  anti_pattern: "Deciding refunds case by case after the first complaint."
  why: "Inconsistent answers create disputes, and a dispute costs a fixed fee plus the sale."
  check: "Is the refund policy identical at checkout, in the terms and in support replies?"
  see_also: [pr.cancel-as-easy-as-signup, lt.policy-matches-practice]
  verified: false
- id: pr.price-change-notice
  principle: "Change prices with at least 30 days' notice to existing customers, and decide explicitly whether they keep the old price (grandfathering)."
  anti_pattern: "Silently raising the price on the next renewal."
  why: "Silent changes break trust and some consumer laws require notice; grandfathering is cheaper than the churn and refunds."
  check: "Is the notice period and grandfathering rule written before the change is shipped?"
  see_also: [pr.refund-policy-written]
  verified: false
- id: pr.annual-upfront
  principle: "Offer an annual plan with a 15-25% discount and a written pro-rata refund rule."
  anti_pattern: "Monthly only, or an annual plan with no stated refund rule."
  why: "Annual cash funds the runway, and a missing refund rule turns every early cancellation into a dispute."
  check: "Is there an annual plan with a stated discount and refund rule?"
  see_also: [pr.refund-policy-written]
  verified: false
- id: pr.tax-handling-decided
  principle: "Decide per country who handles sales tax or VAT (you, a tax tool, or a merchant of record) and show prices tax-inclusive where the law expects it."
  anti_pattern: "Selling abroad with no tax plan and finding the registration threshold was crossed months ago."
  why: "Registration duties appear by country and are retroactive; a merchant of record removes them for a fee."
  check: "For every country sold into, is the tax handler named (self / tool / MoR) with the check date?"
  see_also: [axis.payments_tax, pay.paddle]
  verified: false
- id: pr.one-recommendation-first
  principle: Ask about the problem first and show one recommended plan with its price; keep the full price list reachable for anyone.
  anti_pattern: Seven or more priced products side by side on the first screen.
  why: Small business owners stop comparing and leave when prices come before their problem (internal review; not measured).
  check: Does the first screen show at most one to three prices?
  stage: launch
  see_also:
  - pr.competitor-price-table-first
  context:
    stack: web + automation bundle
    product: services for local businesses
    cost: two review rounds
  occurrences: 1
  learned: '2026-11-04'
  verified: false
  source: field learnings 2026-11-04 (1 submission), generalized
- id: pr.setup-fee-vs-monthly
  principle: Compare first-year total cost against competitors by model (setup + monthly vs monthly only) and against your own cash need before choosing a setup fee.
  anti_pattern: Assuming setup + monthly is market-normal, or starting with a low monthly only when cash is short.
  why: 'Two teams reached opposite answers: one needed day-one cash from a setup fee, the other found the setup fee was the buyer''s main barrier.'
  check: Is there a table of first-year totals by competitor model, and does the first sale cover this month's fixed costs?
  stage: launch
  see_also:
  - pr.annual-upfront
  - pr.unit-cost-before-price
  context:
    stack: web + automation bundle
    product: services for local businesses
    cost: three pricing revisions
  claims:
  - id: pr.setup-fee-vs-monthly.c1
    claim: 'Website-builder entry plans: $19/month billed annually ($25 monthly) for one; $22/month annual ($25 monthly) for another; a local-business suite lists $99 and $399 per month.'
    source:
