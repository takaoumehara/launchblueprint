entries:
- id: pm.free-trial
  name: 期間限定の試用（トライアル）→有料
  what: 数日〜2週間だけ全部使え、その後は払わないと使えない
  best_for: 価値が数日で分かる業務ツール。原価が利用者数に比例するもの（AI・SMS）
  avoid_when: 価値が出るまで数週間かかる、または使う人が増えるほど価値が増えるもの
  pricing_bands:
    free: 決済側の追加料金なし（Stripe の試用期間機能は手数料のみ）
    usd5: —
    usd10: —
    usd100: —
  limits: 試用終了の通知と、カード登録の要否（登録ありは転換率が高いが開始率は下がる）
  lock_in: 低
  liability_compliance: 自動更新の事前通知と、登録と同じ手数での解約（FTC の click-to-cancel・EU の消費者法）
  security: 試用の使い回し（同じカード・メール）の対策
  pairs_well_with: [pay.stripe-checkout, pr.cancel-as-easy-as-signup]
  source:
    url: https://stripe.com/pricing
    checked: '2026-10-26'
    verified: true
- id: pm.freemium
  name: 無料枠＋有料プラン
  what: ずっと無料で使える小さな枠と、上限を超えたら払うプラン
  best_for: 使う人が増えるほど価値が増える・紹介で伸びる・無料ユーザーの原価がほぼゼロ
  avoid_when: 無料ユーザー1人ごとに AI・転送・サポートの原価がかかる時
  pricing_bands:
    free: 決済側の追加料金なし
    usd5: —
    usd10: —
    usd100: —
  limits: 無料枠には必ず上限と費用の止め方（キルスイッチ）を付ける
  lock_in: 低
  liability_compliance: 無料枠の縮小は事前告知
  security: 無料アカウントの量産（ボット）対策
  pairs_well_with: [pr.free-tier-cap, dp.ai-usage-caps]
  source:
    url: https://stripe.com/pricing
    checked: '2026-10-26'
    verified: true
- id: pm.usage
  name: 使った分だけ（従量）
  what: 回数・文字数・時間など、使った量で請求する
  best_for: AI・API・動画など原価が使用量に比例するもの。会社向け
  avoid_when: 請求額が読めないと嫌がる個人向け（上限や定額の組み合わせが要る）
  pricing_bands:
    free: Stripe の従量請求は Billing の手数料（公式ページで確認）
    usd5: —
    usd10: —
    usd100: —
  limits: 計測（メーター）の正確さが売上の正確さになる。月の上限額を利用者が設定できるようにする
  lock_in: 低
  liability_compliance: 請求の内訳を明細で出す
  security: 計測の二重送信・取りこぼしを監視
  pairs_well_with: [pay.stripe-checkout, cc.ai-gateway-budget]
  source:
    url: https://stripe.com/pricing
    checked: '2026-10-26'
    verified: true
- id: pm.one-time
  name: 買い切り（ライフタイム）
  what: 1回払いでずっと使える
  best_for: ツール・テンプレート・部品集・サーバー費がほぼゼロのアプリ
  avoid_when: 保守・サーバー・AI の費用がずっとかかるもの（売上が止まり費用が続く）
  pricing_bands:
    free: 決済側の追加料金なし
    usd5: —
    usd10: —
    usd100: —
  limits: 「ライフタイム」の定義（製品の寿命か人の寿命か）を規約に書く
  lock_in: 低
  liability_compliance: 返金条件（デジタル商品は開封後返金不可など）を購入前に明示
  security: ライセンスキーの共有対策
  pairs_well_with: [pay.paddle, pay.lemonsqueezy]
