- id: pr.churn-in-revenue-plan
  principle: Judge a subscription plan by the number of paying customers needed after churn and the months to reach it.
  anti_pattern: A '$20 a month to $8K net' target with no churn in the model.
  why: With churn, adding customers every month can still take years to reach the target; the plan was judged no-go.
  check: Does the plan state the churn rate and the month the required customer count is reached?
  stage: idea
  see_also:
  - val.north-star-to-money
  context:
    stack: any
    product: subscriptions
    cost: plan switched to client work
  claims:
  - id: pr.churn-in-revenue-plan.c1
    claim: At $20 per month, $8K net needs about 420 paying customers; with 6% monthly churn, 50 new a month takes about 11 months and 30 a month about 29 months.
    source:
      url: null
      checked: '2026-11-04'
      verified: false
    note: internal estimate with assumed margins
  occurrences: 1
  learned: '2026-11-04'
  verified: false
  source: field learnings 2026-11-04 (1 submission), generalized
- id: pr.one-source-for-public-numbers
  principle: 'Prices, fees and rewards that leave the building come from one source: the billing config in code; unconfirmed values are placeholders like [X%] defined in one place, and a production build fails while any remain.'
  anti_pattern: Copying numbers from a decision memo, or provisional prices appearing in terms, FAQ and the support bot.
  why: A memo said 2% while the code charged 0%, and provisional prices reached public pages.
  check: Does every public price match the billing code or payment dashboard, and does a grep of the production build find zero placeholder values?
  stage: launch
  see_also:
  - la.claims-match-live
  - la.no-placeholder-in-deliverables
  context:
    stack: payments config in code; content and support-bot copy
    product: all
    cost: wrong public promise avoided
  occurrences: 3
  learned: '2026-11-04'
  verified: false
  source: field learnings 2026-11-04 (3 submissions), generalized
- id: pr.competitor-price-table-first
  principle: 'Before schema or billing work, tabulate competitors'' official prices: billing unit, in-person / online / keyed card rates, usage fees (SMS, AI, marketplace), trial and contract terms, each with URL and date.'
  anti_pattern: Comparing only the monthly fee, or guessing prices for quote-only vendors.
  why: In booking software most revenue comes from card fees and add-ons, so monthly-only comparisons misread the market.
  check: Is there a dated table with source URLs covering billing unit, card rates, usage fees and trial terms?
  stage: idea
  see_also:
  - pr.unit-cost-before-price
  context:
    stack: Connect-type payments, edge workers
    product: booking / payments SaaS (US)
    cost: none (done before pricing)
  claims:
  - id: pr.competitor-price-table-first.c1
    claim: 'US salon/booking card rates cluster at 2.29-2.6% + 10-20 cents in person and 3.3-3.5% keyed: 2.29% + $0.20 / 2.79% online / 3.30% keyed; 2.6% / 2.5% / 2.4% + 15 cents by plan and 3.5% + 15 cents keyed; 2.45% + 15 cents / 2.90% + 30 cents; 2.49% + $0.10 / 2.69% + $0.30; 2.6% + $0.10 / 3.5% + $0.19.'
    source:
      url: https://www.fresha.com/pricing
      checked: '2026-11-04'
      verified: true
    note: each rate read on the vendor's own pricing page 2026-11-04 (fresha.com, squareup.com/us/en/appointments/pricing, mangomint.com/pricing, biz.booksy.com/en-us/pricing, Vagaro help centre); one more vendor's 2.4% + 15 cents appears only in its FAQ
  - id: pr.competitor-price-table-first.c2
    claim: 'Billing units seen: per staff member ($14.95), per user ($10) plus per location ($120), per location plans ($0/$49/$149); marketplace new-client fee 20% (min $6).'
    source:
      url: https://www.fresha.com/pricing
      checked: '2026-11-04'
      verified: true
    note: per-location plans from squareup.com and mangomint.com the same day; other vendor prices in the submission (AI receptionist add-ons, per-SMS) were not re-read
  occurrences: 1
  learned: '2026-11-04'
  verified: true
  source: field learnings 2026-11-04 (1 submission), generalized
- id: pr.no-unsold-former-price
  principle: Show a launch discount as a time- or quantity-limited offer at the listed price; strike through a 'regular price' only if you have really sold at it.
  anti_pattern: A crossed-out regular price on a product that has never been sold.
  why: US rules require a former price to be one actually offered for a substantial period; payments were not even live.
  check: Is there a record of real sales at the struck-through price?
  stage: launch
  see_also:
  - pr.price-change-notice
  context:
    stack: any
    product: beta pricing
    cost: regulatory risk
  claims:
  - id: pr.no-unsold-former-price.c1
    claim: '16 CFR 233.1: a former price must be the actual, bona fide price at which the article was offered to the public on a regular basis for a reasonably substantial period of time.'
    source:
      url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-B/part-233/section-233.1
      checked: '2026-11-04'
      verified: true
  occurrences: 1
  learned: '2026-11-04'
  verified: true
  source: field learnings 2026-11-04 (1 submission), generalized
