lessons:
- id: val.alternatives-first
  principle: "List five or more alternatives the target user uses today (other products, manual work, doing nothing) with price and the reason they don't switch."
  anti_pattern: "Writing 'no competitors' or comparing only against products."
  why: "'No competitors' almost always means an overlooked alternative; the real price comparison is against the current way, not a product."
  check: "Does the alternatives table have a 'do nothing' row and a price for every row?"
  see_also: [val.pay-signal]
  verified: false
- id: val.strangers-not-friends
  principle: "Measure demand with strangers (a landing page reached by search, a community post or a small ad), and set the pass number before the test starts."
  anti_pattern: "Counting friends' and followers' enthusiasm as demand, or deciding the threshold after seeing the numbers."
  why: "Acquaintances say yes to be kind; strangers convert in single digits, and a threshold set afterwards always passes."
  check: "Was the pass number (e.g. visit-to-signup 10%) written before the test, and were the visitors strangers?"
  see_also: [val.pay-signal, val.pmf-40]
  verified: false
- id: val.pay-signal
  principle: "Before building, collect a committed signal: a pre-order, a deposit, a signed letter of intent or a card on file. Count only those."
  anti_pattern: "Treating waitlist emails or 'I would pay' answers as proof."
  why: "Emails are free to give; money or a signature is the only answer that costs the user something."
  check: "Do at least two of five interviewed people commit money, a card or a signature?"
  see_also: [val.strangers-not-friends]
  verified: false
- id: val.pmf-40
  principle: "After launch, ask 40 or more active users 'How would you feel if you could no longer use this?' and treat 40% 'very disappointed' as the product-market-fit guide."
  anti_pattern: "Declaring fit from retention of a handful of early users or from praise."
  why: "A single question on a sample of 40+ separates a nice-to-have from a must-have better than anecdotes."
  check: "Is the survey run on 40+ users and is the 'very disappointed' share recorded with the date?"
  see_also: [val.strangers-not-friends]
  verified: false
- id: val.spec-edge-cases
  principle: "Write the spec down to inputs, outputs, preconditions and exception states before an AI builds it."
  anti_pattern: "Giving an AI a one-line feature request and accepting the happy path as done."
  why: "AI fills gaps with guesses and builds the normal path first; the missing error, empty and offline states show up in production."
  check: "Does every screen in the spec list its empty, error, loading and offline states?"
  see_also: [val.alternatives-first]
  verified: false
- id: val.north-star-to-money
  principle: "Pick one north-star metric and write the chain from it to revenue, with three to five input metrics."
  anti_pattern: "A north star (e.g. signups) that can rise while revenue and retention fall."
  why: "A metric disconnected from money sends the team optimising the wrong thing for months."
  check: "Is the line 'north star → input metrics → revenue' written in one sentence?"
  see_also: [val.pmf-40]
  verified: false
