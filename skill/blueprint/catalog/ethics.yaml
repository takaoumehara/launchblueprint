# 固有の会社名・製品名・人名は書かない。カテゴリー台帳：elements/categories.yaml の ethics。
domain: ethics
updated: '2026-11-04'
stale_after_days: 365   # 料金を持たない（原則だけ）

# lessons: 1件 = 原則・避ける形・なぜ（1行）・はい／いいえの確認。topic は5つ（ai_use / user_data / accessibility / dark_patterns / consent）。
# stage は Blueprint の5段階（idea/launch/operate/scale/exit）のどこで効くか。
lessons:
# 1) AI の使い方
- id: eth.ai-disclosed
  topic: ai_use
  stage: launch
  principle: "Tell users, at the point of use, which output was generated by AI and what a person checked before it reached them."
  anti_pattern: "Presenting AI-written answers, reviews or messages as if a person wrote or checked them."
  why: "Users weigh AI output differently; hiding it removes the one signal they need to decide how much to trust it."
  check: "Is every AI-generated output labelled where it is shown, with a note of what (if anything) a person reviewed?"
  see_also: [eth.ai-human-path, dp.prompt-injection-untrusted-input]
  verified: false
  date: '2026-11-04'
- id: eth.ai-human-path
  topic: ai_use
  stage: launch
  principle: "Any AI decision that changes a user's money, access or record has a documented way to reach a person and reverse it."
  anti_pattern: "Automatic bans, refunds denied or accounts closed by a model with no appeal route."
  why: "Models are wrong at a steady rate; without an appeal path every error becomes a permanent harm and a support escalation."
  check: "For each automated decision that affects money, access or records, is there a named appeal route and a time limit for the answer?"
  see_also: [eth.ai-disclosed]
  verified: false
  date: '2026-11-04'
- id: eth.ai-training-opt-in
  topic: ai_use
  stage: idea
  principle: "Decide before launch whether user content is used to train or tune models, and make it opt-in unless the terms say otherwise in plain words."
  anti_pattern: "Sending user content to a model provider whose default is to train on it, and finding out from a user."
  why: "Training use is the question users and business customers ask first; changing the answer after launch breaks trust and contracts."
  check: "Is the training-use answer written in the privacy notice, and is the model provider's data-retention setting recorded?"
  see_also: [eth.purpose-limited, eth.consent-granular]
  verified: false
  date: '2026-11-04'
- id: eth.ai-bias-check
  topic: ai_use
  stage: launch
  principle: "Before launch, run the AI feature on a small fixed test set that covers the user groups it serves, and record where answers differ in quality."
  anti_pattern: "Testing only with the team's own language, names and situations."
  why: "Quality gaps across groups are invisible to a homogeneous test set and show up first as complaints."
  check: "Is there a dated test set covering the served user groups, with the differences found written down?"
  see_also: [eth.ai-disclosed]
  verified: false
  date: '2026-11-04'
# 2) 利用者データ
- id: eth.purpose-limited
  topic: user_data
  stage: idea
  principle: "Collect each piece of user data for one written purpose, and do not reuse it for another purpose without asking again."
  anti_pattern: "Collecting everything 'in case it is useful' and repurposing it later for ads or analytics."
  why: "Every field you hold is a breach and a disclosure duty; reuse without asking is where most trust failures start."
  check: "Does every stored user field have a written purpose, and is there no use outside that purpose?"
  see_also: [eth.consent-granular, eth.ai-training-opt-in]
  verified: false
  date: '2026-11-04'
- id: eth.data-export-delete
  topic: user_data
  stage: launch
  principle: "Users can export and delete their own data without contacting support, and deletion reaches backups and processors within a stated time."
  anti_pattern: "Deleting the account row only, leaving the data in analytics, backups and third-party tools."
  why: "Partial deletion is the common case and the one regulators and customers test."
  check: "Is there a self-service export and delete, and a written list of every place the data is copied with its deletion time?"
  see_also: [eth.purpose-limited]
  verified: false
  date: '2026-11-04'
- id: eth.no-sensitive-inference
  topic: user_data
  stage: operate
  principle: "Do not infer sensitive traits (health, religion, sexuality, political views, finances) from behaviour unless the user asked for that feature."
  anti_pattern: "Segmenting users by inferred sensitive traits for targeting or pricing."
  why: "Inferred sensitive data carries the same harm as collected sensitive data, without the user ever having agreed."
  check: "Is there no model, segment or report that infers a sensitive trait the user did not provide for that purpose?"
  see_also: [eth.purpose-limited, eth.no-personalised-price-exploit]
  verified: false
  date: '2026-11-04'
# 3) アクセシビリティ
- id: eth.a11y-baseline
  topic: accessibility
  stage: launch
  principle: "Ship to a written accessibility baseline: keyboard-only use, visible focus, text contrast, labelled controls, captions for video, and no meaning carried by colour alone."
  anti_pattern: "Treating accessibility as a later polish task after launch."
  why: "Retrofitting accessibility touches every screen; building to a baseline from the first screen costs little."
  check: "Does every launch screen pass keyboard-only use and the contrast check, with video captioned?"
  see_also: [eth.a11y-in-done, ui_ux.primary-action-color]
  verified: false
  date: '2026-11-04'
- id: eth.a11y-in-done
  topic: accessibility
  stage: operate
  principle: "Put the accessibility checks into the definition of done for every new screen, and test with a screen reader at least once per release."
  anti_pattern: "Passing an audit once and letting new screens regress."
  why: "Accessibility decays with each feature unless it is part of the routine check."
  check: "Is a screen-reader pass recorded for the latest release?"
  see_also: [eth.a11y-baseline]
  verified: false
  date: '2026-11-04'
# 4) ダークパターン
- id: eth.no-confirmshaming
  topic: dark_patterns
  stage: launch
  principle: "Decline options are worded neutrally and shown with the same weight as accept options."
  anti_pattern: "'No thanks, I don't like saving money' links, hidden decline buttons or pre-ticked boxes."
  why: "Manipulative choice design raises a short-term number and the complaint, refund and regulatory rate with it."
  check: "Are accept and decline equally visible, neutrally worded, and nothing pre-ticked?"
  see_also: [pr.cancel-as-easy-as-signup, eth.no-fake-urgency]
  verified: false
  date: '2026-11-04'
- id: eth.no-fake-urgency
  topic: dark_patterns
  stage: launch
  principle: "Countdowns, stock levels and 'N people are viewing' messages are shown only when they are true and computed from real data."
  anti_pattern: "Timers that reset on reload and invented scarcity."
  why: "Fake urgency is easy to detect, is treated as deception by consumer law in many places, and destroys trust when found."
  check: "Is every urgency or scarcity message backed by a real value you can show on request?"
  see_also: [eth.no-confirmshaming]
  verified: false
  date: '2026-11-04'
- id: eth.no-personalised-price-exploit
  topic: dark_patterns
  stage: scale
  principle: "Do not raise prices for a user because their behaviour suggests they will pay more; if prices vary, the rule is published."
  anti_pattern: "Hidden per-user prices based on device, location history or past urgency."
  why: "Hidden personalised prices read as unfair the moment two users compare, and the screenshot travels."
  check: "Is every price difference explained by a published rule (plan, region, volume) rather than an individual profile?"
  see_also: [eth.no-sensitive-inference, rev.price-follows-value]
  verified: false
  date: '2026-11-04'
# 5) 同意
- id: eth.consent-granular
  topic: consent
  stage: launch
  principle: "Ask for consent separately for each optional use (marketing email, analytics, AI training, sharing), with nothing bundled into the terms acceptance."
  anti_pattern: "One checkbox that accepts the terms, marketing and data sharing together."
  why: "Bundled consent is not a real choice and is often invalid; separate consents are also easier to honour later."
  check: "Is each optional use a separate, unticked choice, recorded with date and version?"
  see_also: [eth.consent-withdrawable, eth.purpose-limited]
  verified: false
  date: '2026-11-04'
- id: eth.consent-withdrawable
  topic: consent
  stage: operate
  principle: "Withdrawing a consent takes no more steps than giving it, and takes effect in every system that uses the data."
  anti_pattern: "An unsubscribe that only stops one list, or a settings page that hides the switch."
  why: "Consent that cannot be withdrawn easily is not consent, and each missed system is a new complaint."
  check: "Can a user withdraw each consent in one place, and is the effect propagated to every processor within a stated time?"
  see_also: [eth.consent-granular, pr.cancel-as-easy-as-signup]
  verified: false
  date: '2026-11-04'
- id: eth.minors-decided
  topic: consent
  stage: idea
  principle: "Decide before launch whether minors can use the product, and if they can, design consent, defaults and data use for them explicitly."
  anti_pattern: "Leaving the age question open and discovering young users after launch."
  why: "Rules for minors change consent, advertising and data defaults; adding them later means redesigning sign-up."
  check: "Is the minimum age written, enforced at sign-up, and reflected in the privacy notice?"
  see_also: [eth.consent-granular]
  verified: false
  date: '2026-11-04'
