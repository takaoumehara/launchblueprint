lessons:
- id: xs.notice-before-shutdown
  principle: "Announce a shutdown 30 to 90 days ahead, stop new billing the same day, and state the refund rule for prepaid periods."
  anti_pattern: "Turning the service off with a same-week email, or keeping renewals running."
  why: "Users need time to export, and prepaid refunds are owed either way; a short notice turns into disputes and reviews."
  check: "Is the notice date at least 30 days before shutdown, with new billing stopped and the refund rule stated?"
  see_also: [dd.sunset, lc.n40]
  verified: false
- id: xs.export-then-delete
  principle: "Give every user a one-click export, keep it available until shutdown, then delete all personal data and record the deletion date."
  anti_pattern: "Deleting without export, or keeping the database 'just in case'."
  why: "Export is what users remember you for; retained data is a liability with no product behind it."
  check: "Does export work for every user, and is there a dated deletion record after shutdown?"
  see_also: [dd.privacy, lc.n41]
  verified: false
- id: xs.cancel-every-subscription
  principle: "Walk the cost sheet and cancel every SaaS, API key, domain and cloud resource, including experiments, and confirm a zero bill the next month."
  anti_pattern: "Turning off the app and leaving the vector database, storage and monitoring running."
  why: "Shadow costs run for years after a shutdown because nobody owns the list."
  check: "Was next month's total bill zero (or only the intended domains)?"
  see_also: [cc.monthly-cost-sheet, lc.n42, lc.n43]
  verified: false
- id: xs.redirect-and-archive
  principle: "Keep the domain for a year with a redirect and a notice, archive the repo read-only, and write the learnings back into the method before the team forgets."
  anti_pattern: "Letting the domain lapse (someone else picks it up) and losing the lessons."
  why: "A lapsed domain can be reused for phishing your old users; the lessons are the only asset a shutdown leaves."
  check: "Is the domain renewed for 12 months with a redirect, and are the learnings filed through the feedback loop?"
  see_also: [lc.n44, biz.domain-renewal-funding]
  verified: false
- id: xs.numbers-regenerable
  principle: "From day one, record MRR, churn, refunds and retention monthly from the payment processor by script, so 12 months can be regenerated for a buyer."
  anti_pattern: "Assembling the numbers by hand from memory and screenshots when a buyer asks."
  why: "History cannot be rebuilt later, and inconsistent numbers end negotiations."
  check: "Can a script regenerate the last 12 months of MRR, churn and refunds today?"
  see_also: [dd.metrics, dd.money]
  verified: false
