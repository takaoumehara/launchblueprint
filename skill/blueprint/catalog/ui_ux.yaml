# UI/UX learnings v1 — generic rules from product iteration
rules:
  - id: primary-action-color
    principle: "Reserve the strongest colour (solid black or brand fill) for the single primary action on a screen."
    anti_pattern: "Several solid dark boxes and selected states all competing with the primary button."
    why: "Users' eyes were pulled between the main action and selected options, so the main action stopped standing out."
    check: "Is the strongest fill used by exactly one action on this screen?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: selected-state-tint
    principle: "Show selected states with a light accent tint plus a thin ring, not a solid fill."
    anti_pattern: "Selected chips filled solid in the same weight as the primary button."
    why: "A solid selected option looked like a second primary action."
    check: "Are selected states a light tint plus a thin ring, lighter than the primary action?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: borders-only-on-pressables
    principle: "Use boxes and borders only for pressable buttons; use plain text links elsewhere."
    anti_pattern: "Bordered boxes around labels, lists and secondary links."
    why: "Too many framed boxes made the header feel busy and hid what was actually tappable."
    check: "Does every bordered or boxed element respond to a tap?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: hints-on-demand
    principle: "Keep hints off the main surface; put them behind an (i) or a one-time dismissible tip."
    anti_pattern: "Always-on helper lines and tour buttons in section headers."
    why: "Permanent helper text cluttered the header and was ignored after the first visit."
    check: "Is every explanatory hint behind an (i) or shown once and dismissible?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: announce-new-features-once
    principle: "Announce a new feature to all users, existing ones included, once, then never again."
    anti_pattern: "Shipping an interaction change silently, or showing the tip on every visit."
    why: "Existing users never discovered a new gesture because only new sign-ups saw guidance."
    check: "Will existing users see one dismissible notice for this change, and only once?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: short-scannable-copy
    principle: "Keep UI copy extremely short and scannable."
    anti_pattern: "Sentences in buttons, labels and toasts."
    why: "Long labels were truncated or skipped, and users missed the point."
    check: "Can every label and toast be read in one glance (a few words)?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: plain-localized-terms
    principle: "Use plain, recognizable terms, localized to each locale's natural word."
    anti_pattern: "Invented feature names or literal translations (e.g. 'Contents at the top')."
    why: "An invented label was not recognized; the standard term ('Table of contents') was."
    check: "Is each term the one users already know, translated to the locale's natural term?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: undoable-delete
    principle: "Delete immediately with an Undo toast, and offer Hide as a non-destructive alternative."
    anti_pattern: "Blocking confirm sheet saying 'This can't be undone'."
    why: "Users feared deleting and asked why it could not be undone and whether they could just hide it."
    check: "Can a delete be undone from a toast, and is Hide offered?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: handle-only-reorder
    principle: "Use a drag handle alone for reorder; put Move up/down in the overflow menu."
    anti_pattern: "Drag handle plus up/down arrows plus overflow on every row."
    why: "Rows with three reorder affordances looked cluttered and redundant."
    check: "Does each row have only one visible reorder affordance?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: no-overlapping-inserters
    principle: "Do not put between-item inserter buttons where they overlap content; use one Add button and 'Add below' in the overflow."
    anti_pattern: "Floating '+' between list items."
    why: "The between-item '+' overlapped neighbouring items and kept drawing complaints."
    check: "Is there no insert control that overlaps or crowds list items?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: distinct-coachmarks
    principle: "Make tour coachmarks visually distinct from the highlighted UI (dark bubble plus accent outline) with Back, swipe and progress dots."
    anti_pattern: "A coachmark styled like the UI it points to, forward-only."
    why: "Users confused the tour bubble with the real control and could not go back."
    check: "Is the coachmark clearly different from the UI, and can users go back, swipe and see progress?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: celebrate-publish
    principle: "Show publish success in clear green with a live message, Copy/Share actions and a small first-time celebration."
    anti_pattern: "Neutral or ambiguous publish feedback."
    why: "Users were unsure whether their page had gone live."
    check: "After publishing, is success obvious, with copy/share right there?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: never-red-for-success
    principle: "Never use red for a success state."
    anti_pattern: "Red or warning colours on a successful state."
    why: "A success state in red read as an error."
    check: "Are all success states free of red?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: preserve-scroll-highlight
    principle: "After closing an editor, return to the same scroll position and briefly highlight the edited item."
    anti_pattern: "Jumping back to the top of the list."
    why: "Users lost their place after every edit."
    check: "After closing an editor, is scroll preserved and the edited item highlighted?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: no-ellipsis-truncation
    principle: "Never truncate text with an ellipsis; wrap, shorten copy or resize."
    anti_pattern: "Labels cut off with '…'."
    why: "Cut-off labels hid meaning and looked broken."
    check: "Is there no text ending in '…' at the narrowest supported width (e.g. 360px) in every locale?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: plain-screen-labels
    principle: "Screen-name labels are plain text, and mode toggles state what they switch between."
    anti_pattern: "Heavy black banner for a mode label; ambiguous toggles like 'Test links'."
    why: "A heavy preview banner looked ugly and an unclear toggle confused users."
    check: "Is the screen label plain text, and does every toggle name both states (e.g. 'Links: Edit / Open')?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: separate-preview-from-edit
    principle: "Separate an inline preview clearly from the edit list (Edit/Preview switch, framed and labelled preview)."
    anti_pattern: "Preview rendered inline with the same images as the list, with no boundary."
    why: "Users saw the same images twice and could not tell preview from editor."
    check: "Is the preview visibly framed or labelled, or switched separately from the edit list?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: full-focus-edit-mode
    principle: "Item edit mode is full focus; define a show/hide matrix of controls per mode."
    anti_pattern: "Global actions, Publish and add bars still visible while editing one item."
    why: "Mixed global and local controls made editing mode feel unclear."
    check: "Is there a written matrix of what shows in each mode, and does edit mode hide global actions?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: sticky-save-bar-when-dirty
    principle: "Manual-save screens use a sticky bottom Cancel/Save bar that appears only when there are changes, the same on every manual-save screen."
    anti_pattern: "Save and cancel as heavy boxes in the header, always visible."
    why: "An always-on header Save made three heavy boxes and gave no sense of unsaved changes."
    check: "Does the Save bar appear only when dirty, at the bottom, consistently across screens?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: prevent-invalid-input
    principle: "Prevent invalid input by auto-adjusting (e.g. accent contrast) with Undo instead of showing an error."
    anti_pattern: "Error message after the user picks an unreadable colour."
    why: "Users hit a contrast error with no idea how to fix it."
    check: "Is invalid input corrected automatically with an Undo, rather than blocked by an error?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: separate-concepts
    principle: "Keep separate concepts in separate controls (publish status vs audience/visibility)."
    anti_pattern: "A 'Private' visibility option that overlaps with draft/unpublished state."
    why: "Users could not tell 'private' from 'not published'."
    check: "Does each setting control one concept, with no overlap between options?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: real-media-thumbnails
    principle: "Media embeds show the real thumbnail with a play overlay."
    anti_pattern: "Generic placeholder for embedded video."
    why: "Placeholder embeds made pages look broken and unfamiliar."
    check: "Does every media embed show its real thumbnail with a play overlay?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: design-system-fonts-everywhere
    principle: "Every dialog, sheet and toast uses design-system fonts."
    anti_pattern: "Sheets falling back to a different (e.g. serif) font."
    why: "A confirm sheet showed an unfamiliar font and users doubted the design system."
    check: "Do all dialogs and sheets use only design-system type tokens?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: distinct-motion-styles
    principle: "Offer motion styles only if each is visibly distinct, with a live mini preview per style."
    anti_pattern: "Presets or on/off switches that look nearly identical."
    why: "Near-identical presets were rejected; users wanted clearly different reveal styles."
    check: "Can a user tell every offered motion style apart from its preview?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: motion-accessibility
    principle: "Reduced-motion users get no motion; long body text uses only a soft fade; any input finishes the reveal; animate only transform, opacity, clip-path and filter."
    anti_pattern: "Decode or typewriter effects on paragraphs, ignoring reduced-motion."
    why: "Effects on long text hurt readability and performance."
    check: "Does reduced-motion disable reveals, and do paragraphs use only a soft fade?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: consistent-save-model
    principle: "Make the save model explicit per surface (auto-saved to draft vs live at once vs manual) and show a consistent indicator."
    anti_pattern: "Some settings live instantly, others draft, others manual, all looking the same."
    why: "An audit found mixed save behaviours that users could not predict."
    check: "For every control, is it obvious whether a change is drafted, live or needs saving?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: tap-row-to-open
    principle: "Tapping a list row opens it; the row shows only its name and an overflow menu."
    anti_pattern: "An extra Edit button on every row."
    why: "Per-row Edit buttons added noise without adding capability."
    check: "Does tapping a row open it, with no redundant Edit button?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: scoped-help-assistant
    principle: "An in-product help assistant answers only from the help content, cites the source page, links to screens instead of acting, and politely declines off-topic questions."
    anti_pattern: "A general chatbot that answers anything or takes account actions."
    why: "Off-topic answers and unsourced replies erode trust."
    check: "Does the assistant refuse off-topic questions and cite a help page for each answer?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: collapse-long-nav
    principle: "Long in-page navigation collapses ('Contents ▾', '+N more') instead of growing without limit."
    anti_pattern: "An ever-growing list of links at the top of long pages."
    why: "Long tables of contents pushed content below the fold."
    check: "Does in-page navigation stay short on long pages?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: toast-never-covers-controls
    principle: "Show transient messages in their own reserved space (above a bottom bar, clear of the safe area), never on top of tappable controls."
    anti_pattern: "A floating toast laid over list items and buttons near the bottom of the screen."
    why: "A toast covered a button users were about to tap, so taps were missed or hit the toast."
    check: "While a toast is visible, is every control on screen still fully visible and tappable?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: header-title-wraps-to-own-row
    principle: "Let a header title wrap (a few lines at most) or move to its own full-width row; never cut it off."
    anti_pattern: "A page title truncated with an ellipsis or squeezed to one word per line beside header buttons."
    why: "People could not tell which page they were editing, and truncated titles looked broken."
    check: "At the narrowest supported width, is the full title readable in the header without an ellipsis?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: icon-only-secondary-on-narrow
    principle: "On narrow screens, collapse secondary header actions to labelled icons (accessible name, 44px target) before squeezing the title."
    anti_pattern: "Text labels on every header button so a short title wraps into two cramped lines."
    why: "Short titles wrapped needlessly because secondary buttons took the space."
    check: "At 390px, does a short title fit on one line, and do icon-only buttons keep an accessible name and a 44px target?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: decorative-motion-once
    principle: "Play decorative motion (a sheen, a shimmer) once on load and once per press, never on a loop, and not at all under reduced motion."
    anti_pattern: "A shine that repeats forever on the primary button."
    why: "Looping decoration distracted from content and ignored people who asked for less motion."
    check: "Does every decorative animation have a finite iteration count and a prefers-reduced-motion off switch?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: selected-vs-primary-color
    principle: "Keep selected states visibly lighter than the primary action, and draw focus rings in the brand colour at 3:1 or more."
    anti_pattern: "Selected chips, focus rings and the primary button sharing one solid fill, or rings left in an old accent."
    why: "Selected options were mistaken for buttons, and old-accent rings looked like a different product."
    check: "Are selected states a tint, the primary action a fill, and focus rings brand-coloured at 3:1 or more?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: clean-build-before-deploy
    principle: "Clear the build cache before a production build when design tokens or global CSS changed, then verify the deployed CSS."
    anti_pattern: "Deploying from an incremental build whose cached CSS still held the old tokens."
    why: "A stale cache shipped old colours even though the source had changed."
    check: "Was the build cache cleared, and does the deployed CSS contain the new token values?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: external-setup-roundtrip
    category: flows
    principle: "Before sending users to an external setup step mid-flow (e.g. payment onboarding), auto-save, deep-link straight to the setup screen, and return them to the exact item they left."
    anti_pattern: "Leaving through a generic settings/profile page and showing 'Leave without saving?' after the work was already saved."
    why: "A saved draft plus a detour and a false unsaved-changes warning made the flow feel broken."
    check: "After finishing external setup, is the user back on the same item with no unsaved warning?"
    see_also: "consistent-save-model, preserve-scroll-highlight"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: single-status-location
    category: feedback
    principle: "Show each status (progress, sync, error) in exactly one place on a screen."
    anti_pattern: "The same upload progress rendered in a row and again in a banner or toast."
    why: "Duplicate progress indicators confused users about whether two uploads were running."
    check: "Is any state shown twice on the same screen?"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: migration-numbers-by-merge-order
    category: engineering
    principle: "When several branches add database migrations in parallel, assign migration numbers by planned merge order before review ends, and ship each migration to every environment's database."
    anti_pattern: "Each branch picking the next free number on its own and assuming production migrates itself."
    why: "Three changes claimed the same migration number, and one never got its production migration."
    check: "Is there a merge-order table with unique numbers, and a migration applied for every database?"
    see_also: "clean-build-before-deploy"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: offline-payment-holds-expire
    category: payments
    principle: "Seats or stock held for manual/offline payment need an expiry, an organizer cancel action, and a per-buyer cap."
    anti_pattern: "Unpaid holds that count against capacity indefinitely."
    why: "Unpaid holds blocked capacity forever and real buyers were turned away."
    check: "Do holds have an expiry, an organizer cancel, and a per-buyer cap?"
    see_also: "catalog/payments.yaml"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: money-summary-integrity
    category: payments
    principle: "Money summaries subtract refunds once, exclude cancelled/expired orders from gross, store the processor's real fees, and label anything estimated."
    anti_pattern: "Subtracting a refund from gross and again from net, or computing fees from a formula and showing them as fact."
    why: "A fully refunded order showed a negative net amount."
    check: "Does a fully refunded order show exactly $0 net, with estimates labelled?"
    see_also: "catalog/payments.yaml"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: public-support-address-not-home
    category: onboarding
    principle: "A public-facing support/business address must never default to the user's home address; warn that it is public and suggest a virtual or business address."
    anti_pattern: "Prefilling the account's personal address into a field buyers can see."
    why: "Onboarding exposed a home address to buyers without the user realising."
    check: "Does onboarding warn that the support address is public and offer alternatives?"
    see_also: "catalog/payments.yaml"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: agreement-snapshot-and-retention
    category: privacy
    principle: "For agreements accepted at checkout, snapshot the exact text plus a hash per order, collect the minimum personal data (no IP unless required), scrub personal data when the stated retention ends, and update the privacy policy in the same change."
    anti_pattern: "Linking to a live, editable agreement, logging IPs by default, and keeping data past the stated retention."
    why: "Personal data was kept beyond the retention period the policy promised."
    check: "Is data cleared at expiry, and does the privacy policy match what is collected and kept?"
    see_also: "catalog/cross_border.yaml"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: time-inputs-for-novices
    category: forms
    principle: "Date/time inputs offer a 12h/24h toggle, prefill End from Start, label optional fields consistently, and explain inline when blank means unlimited."
    anti_pattern: "Bare time fields where End starts empty, optional markers vary, and blank's meaning is undocumented."
    why: "First-time users had to guess formats and what an empty field meant."
    check: "Can a first-time user fill every time field without guessing?"
    see_also: "prevent-invalid-input"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: statement-descriptor-preflight
    category: payments
    principle: "Ask for the trading (DBA) name first and explain that the card statement descriptor must match the legal name or website before the processor validates it."
    anti_pattern: "Letting users type any descriptor and surfacing the processor's rejection mid-setup."
    why: "Setup failed with an unexplained processor rejection error."
    check: "Does setup explain the descriptor rule before any error can occur?"
    see_also: "catalog/payments.yaml"
    source: 'product iteration 2026-10'
    date: '2026-10-27'
  - id: desktop-is-not-a-stretched-phone
    category: layout
    principle: "Give wide screens their own layout: a capped frame, a hero band and two-column sections, while the phone layout stays unchanged."
    anti_pattern: "One narrow mobile column centred in empty space on a laptop."
    why: "A phone column on a desktop made a business site look like an unfinished link page."
    check: "At 1440px, does the page use a frame wider than a phone column with text capped near 68 characters per line?"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: auto-layout-before-layout-controls
    category: layout
    principle: "Derive wide-screen arrangement from content order and length automatically; offer at most one escape hatch."
    anti_pattern: "A grid builder asking users to place every block for each screen size."
    why: "Non-designers stall when asked to lay out the same page twice."
    check: "Can a user get a good desktop layout without touching any layout control?"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: reading-order-equals-visual-order
    category: accessibility
    principle: "Keep source, tab and screen-reader order identical to the visual order at every breakpoint."
    anti_pattern: "Reordering columns with CSS so the screen order differs from the DOM."
    why: "Keyboard and screen-reader users jumped around the page unpredictably."
    check: "At each breakpoint, does tabbing move in the same order the eye reads?"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: nav-wraps-never-hides
    category: navigation
    principle: "Let site navigation wrap to a second row, then switch to a labelled Menu button; never clip or silently hide items."
    anti_pattern: "Nav labels cut with ellipsis or items pushed into an unlabelled overflow icon."
    why: "Visitors could not find pages whose links were cut off or hidden."
    check: "With a 60-character label, is every nav item fully visible or reachable from a labelled Menu?"
    see_also: "no-ellipsis-truncation, collapse-long-nav"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: no-dead-nav-links
    category: navigation
    principle: "Build navigation only from items that are currently public; skip anything private, unpublished or deleted at render time."
    anti_pattern: "A menu that links to draft or removed pages."
    why: "Dead links in a header make a small business look closed."
    check: "Does unpublishing a page remove it from every menu without any extra step?"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: time-driven-content-updates-itself
    category: content
    principle: "Lists driven by dates (upcoming items, next item) update with time on the server, with no republish."
    anti_pattern: "Hand-maintained event lists that keep showing past dates."
    why: "Past events on a homepage made visitors doubt the business was active."
    check: "Does an item vanish from the list after its end time without anyone editing the page?"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: show-event-zone-not-viewer-zone
    category: content
    principle: "Show event times in the event's own time zone with a short zone label when it differs from the viewer's."
    anti_pattern: "Silently converting times to the viewer's zone or showing times with no zone."
    why: "Visitors travelling or out of town arrived at the wrong hour."
    check: "Does every displayed event time carry a zone label when the viewer's zone differs?"
    see_also: "time-inputs-for-novices"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: designed-empty-states
    category: content
    principle: "Every auto-filled module has a written empty state the owner can edit."
    anti_pattern: "A blank gap or a heading with nothing under it when there is no data."
    why: "An empty section reads as a broken site."
    check: "With zero items, does the module show a short, editable message?"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: form-keeps-input-on-error
    category: forms
    principle: "On send failure, keep everything typed, show the error inline next to the action, and focus the first problem."
    anti_pattern: "Clearing the form or showing a generic error page after a failed send."
    why: "Visitors who lose a long message rarely type it again."
    check: "After a simulated network error, is every typed character still there?"
    see_also: "prevent-invalid-input"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: invisible-spam-protection-first
    category: forms
    principle: "Stop spam with invisible checks (managed challenge, honeypot, rate limit) before adding any visible puzzle."
    anti_pattern: "A visible captcha on every contact form submit."
    why: "Visible puzzles cost real enquiries more than they save in spam."
    check: "Can a real visitor send a message without solving anything visible?"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: never-expose-owner-contact
    category: privacy
    principle: "Deliver contact messages to the owner with the visitor as reply-to; never print the owner's address in the page."
    anti_pattern: "A mailto link or address in the HTML of a contact block."
    why: "Published addresses get harvested and flooded with spam."
    check: "Is the owner's email absent from the page source?"
    see_also: "agreement-snapshot-and-retention"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: maps-load-on-intent
    category: performance
    principle: "Show a static map and real address text; load an interactive map or third-party script only after a tap."
    anti_pattern: "An embedded interactive map that loads on page view and traps scrolling on phones."
    why: "Map embeds slowed pages and hijacked scrolling on mobile."
    check: "Before any tap, are there zero third-party map requests and is the address selectable text?"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
  - id: paid-plans-unbranded-by-default
    category: monetisation
    principle: "When a plan includes removing platform branding, apply it automatically on upgrade and restore it on downgrade."
    anti_pattern: "Requiring paying users to find a separate switch to remove a badge they paid to remove."
    why: "Paying customers kept the badge because they never found the setting."
    check: "After upgrading, is the badge gone with no extra action?"
    source: 'product iteration 2026-10'
    date: '2026-10-28'
