# Blueprint Catalog — scale_readiness（ユーザー数ごとに、今の仕組みがどこまで持つか）
# 提供：CREATIVITY IS EVERYWHERE, LLC。金額・工数は目安（estimate）。採用前に公式料金で確認
domain: scale_readiness
updated: '2026-11-02'
stale_after_days: 180
principle:
- 先に大きな基盤を作らない。各段の「引き金（trigger）」に届いてから次の段へ進む
- 売却が目的なら、買い手は自前の基盤を持つことが多い。売るために大規模インフラは要らない。要るのは「記録された数字」と「戻せる証拠」
- 各段で決めるのは「何を足すか」「どの数字で次へ進むか」「費用と工数の目安」
tiers:
- id: scale.t0
  users: '0-10k'
  must: [日次DBバックアップ（30日保持）, 稼働監視, エラー収集, 費用の月次記録]
  trigger_next: 'MAU 10k 到達、または DB 容量が上限の50%'
  anti_pattern: "監視もバックアップも「後で」と言って公開する"
  why: "最初の障害・最初の消失は利用者が 10 人の時にも起きる。ここで無ければ記録された数字も戻せる証拠も残らない"
  check: "日次バックアップ・稼働監視・エラー収集・費用の月次記録の 4 つが今ある？"
- id: scale.t1
  users: '10k'
  add: [アラート（稼働・エラー率・費用急増）, 復元訓練（四半期1回、所要時間を記録）]
  acceptance: '復元訓練ログに「開始・完了・失ったデータ量」がある'
  anti_pattern: "通知は 1 人のメール、復元は一度も試していない"
  why: "1 万人で初めて「気づかない障害」と「戻らないバックアップ」が損失になる"
  check: "アラートが 2 人に届き、四半期に 1 回の復元訓練ログがある？"
- id: scale.t2
  users: '100k'
  add: [エッジキャッシュ（公開ページ）, レート制限（API・ログイン・フォーム）]
  acceptance: '公開ページのキャッシュヒット率と 429 件数が見える'
  anti_pattern: "公開ページを毎回 DB から作り、ログイン・フォームに上限がない"
  why: "10 万人では読み取りの集中とボットが先に費用と可用性を奪う"
  check: "公開ページのキャッシュヒット率と 429 の件数が見える？"
- id: scale.t3
  users: '300k-1M'
  add: [単一DBの分割、またはマネージドPostgres（接続プール経由）へ移行, 非同期処理キュー]
  effort: '1-2 エンジニア月（estimate）'
  acceptance: '移行リハーサルを本番相当データで1回完了'
  anti_pattern: "単一 DB のまま、同期処理のまま、引き金を過ぎても構成を変えない"
  why: "接続数・容量の上限は CPU より先に来て、移行は本番相当データでの予行なしには失敗する"
  check: "本番相当データで移行リハーサルを 1 回完了した？"
- id: scale.t4
  users: 'enterprise 顧客 / 売却交渉'
  add: [SOC 2（Type I→II）]
  cost: '初年度 $20-80k（estimate）'
  note: 売却だけが目的なら、買い手側の体制に乗るため必須ではないことが多い。交渉相手に確認
  anti_pattern: "売却だけが目的なのに SOC 2 を先に買う"
  why: "買い手が自分の体制に乗せることが多く、初年度 $20-80k は回収できないことがある"
  check: "企業顧客か買い手に認証の要否を確認してから着手した？"
- id: scale.t5
  users: '10M'
  add: [複数ノードPostgres, 地域別データ所在（EU/アジア）, 24時間オンコール]
  anti_pattern: "1 つの地域・1 つのノード・昼間だけの対応のまま 1,000 万人を迎える"
  why: "地域別のデータ所在と 24 時間の当番は、要求されてから作ると数か月かかる"
  check: "複数ノード DB・地域別データ所在・24 時間オンコールの計画が引き金つきである？"
answer_rules:
- 今の段と次の引き金だけを示す。先の段は「いつ考えるか」だけ書く
- 金額・工数は estimate と明記し、source.checked のない数字を確定扱いしない
