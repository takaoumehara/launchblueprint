  principle: '動画の納品前に、字幕ファイルを機械で検査（重なりなし・2 行まで・行の長さ・最短表示時間）、全レンダーのラウドネスを測り、ループは最後のフレーム＝最初のフレームで作り、縦横比ごとの文字の安全域・色空間のタグ・同梱フォントを確かめ、翻訳版は画面内の文字まで訳し、未公開機能の表示は差し替えられる層にする。'
  anti_pattern: '手で合わせた字幕をそのまま出す。最初の 1 本だけ測る。ループの継ぎ目をクロスフェードする。字幕だけ訳す。'
  why: '字幕の重なりと長い行、ラウドネスの幅、継ぎ目の二重写り、比率ごとの文字切れ、翻訳版に英語の画面が残るなどで差し戻された。'
  check: '字幕検査とラウドネス測定を全レンダーで通し、全比率と全言語の確認一覧で問題が 0 か？'
  trigger: '動画の書き出し・納品の前'
  stage: launch
  occurrences: 4
  facts_unverified: '作業基準：字幕 EN 42 字/行・JA 20 字/行、約 -16 LUFS・LRA 11 以下（社内基準、プラットフォーム仕様としては未確認）'
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L41
  principle: '料金は、決める前に競合の公式価格ページで表を作る（課金単位・対面/オンライン/手入力の料率・従量項目・オプション・試用期間、出典と確認日つき）。代行込みの月額は作業時間×時給から逆算し、解約率を入れて必要な顧客数に何か月で届くかを書き、手元資金が乏しければ初期費用か年払いで初日の現金を作る。最初の画面に出す値段は 1〜3 個にし、全価格は別に見られるようにする。'
  anti_pattern: '月額だけで比べ決済手数料と従量課金を見落とす。作業時間を測らず安い月額を置く。解約を入れない売上目標。7 商品以上の値段一覧を最初に並べる。'
  why: 'この種の業界では収益の多くが決済手数料とオプションから来る。安い月額だけでは数件取れても現金が足りず、解約込みでは目標到達に年単位かかり計画が NO-GO になった。値段の多い一覧は小規模事業者を離れさせた。'
  check: '競合の公式価格表（出典・確認日つき）と、作業時間・解約率・到達月数・初日の現金の計算が書かれているか？'
  trigger: '価格を決める段階'
  stage: launch
  occurrences: 4
  facts_unverified: 'PO が報告した競合の料率・月額（本日は再確認していない。採用前に公式ページで確認する）'
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L42
  principle: '割引を見せる時、実際にその価格で売った実績のない「通常価格」に取り消し線を引かない。期間・数量限定の申し込み特典にする。'
  anti_pattern: '決済開始前に元値を消して見せる。'
  why: '実売の記録がない元値の比較は表示規制の対象になりうる。'
  check: '「通常価格」での実際の販売実績があるか？'
  trigger: 'ローンチ価格を作る時'
  stage: launch
  occurrences: 1
  facts_unverified: '米国の表示規則（元値比較）に関する規定がある（PO 提出、本日は再確認していない。法律助言ではない）'
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L43
  principle: '対象国を選ぶ前に、各国で現地のデータ保護代理人の義務があるかを確かめる。'
  anti_pattern: '候補国を計画に入れてから代理人の義務に気づく。'
  why: '計画の途中で代理人の義務が分かり、候補国を外した。'
  check: '対象国ごとに代理人の義務を確認したか？'
  trigger: '対象国を決める時'
  stage: idea
  occurrences: 1
  facts_unverified: 'EU・英国・一部のアジアの国に代理人の規定がある（一次調査、未確認・法律助言ではない）'
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L44
  principle: '特許にしたい仕組みは、デモ・投稿・公開リポ・LP・外向きの提案書より前に仮出願し、大きな機能を足したら公開前に追加出願する。期限の通知は出願日に 3 本入れる。外向き資料からは出願前の仕組みと未公開の数字を消し、社内向けの行には「社内のみ」と印を付ける。'
  anti_pattern: '先に公開してから特許を考える。社内のオファー文書をそのまま外に出す。'
  why: '公開日から各国の期限が動き、猶予のない国では公開した時点で権利を失う。'
  check: '公開する新しい仕組みがすべて出願済みの書類に書かれ、外向き版から未出願の仕組みが消えているか？'
  trigger: '公開日・ベータ・デモ動画・外向き資料を決める前'
  stage: idea
  occurrences: 2
  facts_unverified: '猶予期間は国ごとに違い、一部の地域は原則なし（PO 提出、法律助言ではない、本日は再確認していない）'
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L45
  principle: '名前を決める前に、自分の区分と近い区分で同じ・近い商標を検索する。出願人は出願日の時点の持ち主（法人）にし、規約・決済・ドメインの名義とそろえ、公開欄に個人の住所・メールを入れない。'
  anti_pattern: 'ドメインやロゴを先に決める。名義がそろわないまま出願する。'
  why: '名前の変更はブランドとドメインのやり直しになり、持ち主でない出願人の出願は無効で料金がむだになり、書類は永久に公開される。'
  check: '商標検索をし、出願人と規約・決済・ドメインの名義が一致し、公開欄に個人情報がないか？'
  trigger: '名前を決める時、商標の出願前'
  stage: idea
  occurrences: 1
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L46
  principle: '投稿するチャネルごとに、誰がどの端末・ブラウザから投稿するかを day 0 に決め、ローンチ前に全チャネルで実際にログインして 1 回投稿しておく。戦略文書を渡す時は相手が開けるか確かめるか、ファイルで送る。'
  anti_pattern: 'サーバーや共有クラウドのブラウザからの自動投稿を、ログインを確かめずに計画する。'
  why: '共有マシンからのログインが繰り返し制限され、予定が何日も止まった。4 チャネル中 2 つが未ログインで投稿が遅れた。共有された戦略が開けなかった。'
  check: 'カレンダーの全チャネルで、使う端末からログインとテスト投稿を済ませたか？'
  trigger: 'ローンチの準備'
  stage: launch
  occurrences: 1
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L47
  principle: 'AI 電話受付を本番番号につなぐ前に、業種別の台本・聞き返しへの対応・過去の実通話の再生テストを確かめ、変更のたびに 20〜50 本のテスト会話を回す。電話は最初の応答までの時間で決まるので無料の LLM 枠は使わない。不在着信へのテキストは AI が対応できなかった電話にだけ送る。'
  anti_pattern: '汎用の台本でつなぐ。無料枠で電話を受ける。不在着信のたびに無条件でテキストを送る。'
  why: '別業種の台本が入っていて、聞き返しを答えとして処理し最初の通話で信頼を失った。テキストとの二重連絡が起きる。'
  check: '業種別の台本・聞き返し検知・実通話の回帰テストがあり、テキストの送信条件に「AI が対応したか」を使っているか？'
  trigger: 'AI 電話を本番につなぐ前'
  stage: launch
  occurrences: 1
  facts_unverified: '無料の LLM ルーター枠には分あたり・日あたりの回数上限がある（第三者記事、未確認）'
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L48
  principle: '対面会話の録音や AI のメモは、最も厳しい地域に合わせて全員の同意を取り、AI が聞いていることを見せ、音声は残さない。事例に使うデータは項目ごとに「そのまま出す／丸める／出さない」を決めてオーナーの同意を記録する。'
  anti_pattern: '一方同意の地域だからと同意の UI を省く。事例を作ってから同意を取る。'
  why: '全員同意の地域で AI 文字起こしに関する訴訟が起きている（要約情報、未確認）。後から断られると事例を作り直す。'
  check: '同意取得・可視表示・音声破棄があり、事例の各項目に段階と同意の記録があるか？'
  trigger: '会話記録・事例の設計時'
  stage: idea
  occurrences: 2
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L49
  principle: '店名の違う複数店舗は、店名のグループ（またはエリア）を単位に扱い、看板・サイト・地図のプロフィールの店名を実際に使っている名前にそろえ、共通マークで束ねる。'
  anti_pattern: 'ブランド名 1 つで全店舗が見つかると思い込む。統一のためにプロフィールの名前だけ先に変える。'
  why: '名前の違う店舗が検索から漏れた。プロフィール名は実使用名が規定とされる。'
  check: '名前の違う店舗を 1 グループで登録でき、看板・サイト・プロフィールの店名が一致しているか？'
  trigger: '複数店舗の機能・ドメイン構成を決める時'
  stage: idea
  occurrences: 2
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L50
  principle: '取引台帳（予約・会計・残高）を置く DB は、3 年後の容量見込みと、重複予約を防ぐ排他制約の有無で選ぶ。'
  anti_pattern: '既存のエッジ SQLite 系 DB にそのまま台帳を足す。'
  why: '容量上限や二重予約防止の作り直しで、後から台帳と残高の移行が要る（見積もり 1〜2 週）。'
  check: '台帳の容量見込みと重なり防止の手段が書かれているか？'
  trigger: 'DB を選ぶ時'
  stage: idea
  occurrences: 1
  facts_unverified: 'エッジ SQLite 系の一部は 1 DB あたりの容量上限が小さい（PO 報告、本日は再確認していない）'
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L51
  principle: '確定した文言・構成・定義（ヒーローの見出し、段階の数など）は 1 つの正本に「LOCKED」と確定日を書き、記事・映像・サイト・実装の指示はそこを参照する。未実現の機能や次回予告には時間の注記を付け、公開直前に確かめ直す。'
  anti_pattern: 'チャットごとに見出しを言い換える。媒体ごとに定義を個別に書く。'
  why: '1 日に見出しが 2 回変わり古い文言で実装されかけた。過去記事が古い段階数のまま残った。続編計画が変わり締めの言葉が合わなくなった。'
  check: '実装の指示が正本の節と確定日を指し、未実現の機能に時間の注記があるか？'
  trigger: '文言を決めた時、公開の直前'
  stage: launch
  occurrences: 2
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
- id: fs.L52
  principle: '差別化の軸を決める前に、主要な既存プレイヤー上位 4 社の機能表を公式ページで確かめる。'
  anti_pattern: '既存大手がすでに出している機能を売りにする。'
  why: '売りにしようとした機能を大手の一部がすでに提供していた（要約情報、未確認）。'
  check: '上位 4 社の機能表を確認したか？'
  trigger: '差別化を決める時'
  stage: idea
  occurrences: 1
  verified: false
  source: 'project PO learnings 2026-11-04, generalized (facts are unverified claims until rechecked against official sources)'
procedures:
- id: fs.A
  name_ja: 決定の先読み
  trigger: 決定が出た・提案された（オーナーからでも AI からでも。小さい決定も）
  stage: idea
  also_stages: [launch, operate, scale, exit]
  what: 決定の下に 3 行書く：次に要ること（2〜3 手先、リードタイム込み）／他に変わること（URL・秘密鍵・法務文書・費用・他製品・戻せるか）／誰がいつまでに決め、何を止めているか。
  check: 直近の決定の下に「次に要ること／他に変わること／誰がいつまでに」の 3 行があるか？
  reference: reference/foresight.md#proc-a
- id: fs.B
  name_ja: 画面操作をお願いする前の下ごしらえ
  trigger: オーナーに画面で何かをしてもらう直前（トークン作成・環境変数・ドメイン・DNS・登録・承認・スクリーンショット）
  stage: launch
  also_stages: [operate]
  what: AI が代わりにできないかを先に見てから、画面を予想した手順・「見えなければ」の分岐・正確な識別子・隠す欄・確認の一手・公開される場所・費用と戻せるか、を 1 通に入れる。
  check: 依頼に「人がやる理由」「見えなければ」「隠す欄」「確認」の 4 つが揃っているか？
  reference: reference/foresight.md#proc-b
- id: fs.C
  name_ja: プレモーテム
  trigger: キックオフ、公開前、戻しにくい一歩の前（ドメイン変更・登記・公開掲載・データ移行・最初の有料広告）
  stage: idea
  also_stages: [launch, exit]
  what: 「半年後、これは失敗した。なぜ？」と書き、お金・法務・インフラ・人と手順・外部依存から最低 1 つずつ、原因 5 つに兆候・対策・担当を付ける。
  check: 5 分類を網羅した原因 5 つが、担当つきでプロジェクト YAML の risks にあるか？
  reference: reference/foresight.md#proc-c
- id: fs.D
  name_ja: 「聞かれていないが大事」3 点
  trigger: 節目の報告・週次の状況報告・PR 要約・進捗について数行を超える返事
  stage: operate
  also_stages: [launch, scale]
  what: 返事の末尾に、お金・法務・戻せない・長い待ち・セキュリティ・影響範囲のどれかに当たる点を 3 つだけ、次の行動と日付つきで足す。決まったことは繰り返さない。
  check: 直近の報告の末尾に、行動と日付つきの「聞かれていないが大事」が 3 つ以内で付いているか？
  reference: reference/foresight.md#proc-d
- id: fs.E
  name_ja: クリティカルパスの暦
  trigger: プロジェクトの 1 日目、新しい外部依存が現れるたび
  stage: idea
  also_stages: [launch]
  what: 外部のリードタイム（法人・税務番号・口座・決済本番化・送信者登録・ドメイン・商標・保険・API 審査）を表にし、最長の連鎖から最短の公開日を出して、1 週間を超える待ちを 1 週目に全部始める。
  check: 「最短の公開日：<日付>。決めているのは <項目>」の行があり、長い待ちが全部着手済みか？
  reference: reference/foresight.md#proc-e
- id: fs.F
  name_ja: エージェント環境の一括依頼と複数エージェントの決まり
  trigger: AI の最初の外部呼び出しの前・サービスを足す時（F1）、2 つ目のエージェントか 2 人目の人が入る前（F2）
  stage: launch
  also_stages: [operate, scale]
  what: 環境の前提（通信許可・トークン・環境変数・権限）を 6 列の表で 1 通にまとめ、最小の権限と影響範囲を書く。並行作業の前に、1 エージェント 1 ブランチ・作業ボード・1 スレッド・マージ担当 1 人・共有リソースの持ち主・名前の接頭辞を合意する。
  check: 前提の表を 1 通で送り、2 つ目のエージェントの前に 6 項目の決まりが書面にあるか？
  reference: reference/foresight.md#proc-f
cross_rules:
- id: fs.X1
  principle: 月の総額の上限とキルスイッチを持ち、無料枠を消費する前に上限を確認する。
  anti_pattern: 無料枠の裏の有料の代替が無上限のまま、「無料だから」と使い始める。
  why: 代替が無上限なら無料枠は無料ではない。止まった夜に請求が跳ねる。
  check: 無料枠を使う全サービスに、月の上限とキルスイッチが先に設定されているか？
  see_also: [fs.L14, cc.kill-switch-tested, cc.alert-50-80]
  verified: true
  source: 'launch-blueprint v0.2 field lessons, generalized 2026-11-03'
- id: fs.X2
  principle: キャッシュのキーには入力の全次元（モデル・プロンプトの版・言語・顧客）を入れる。
  anti_pattern: 質問文だけをキーにして、ある顧客への答えを別の顧客に返す。
  why: 粗いキーは費用の節約に見えて、顧客間の情報漏えいになる。
  check: キャッシュのキーに顧客と言語とプロンプトの版が含まれているか？
  see_also: [fs.L14, dp.prompt-injection-untrusted-input]
  verified: true
  source: 'launch-blueprint v0.2 field lessons, generalized 2026-11-03'
- id: fs.X3
  principle: サービスごとの最初の API 認証情報だけ人が作り、以後のトークン・鍵・設定は AI が API で作る。最初の依頼でそう伝える。
  anti_pattern: 鍵やトークンが要るたびにオーナーに画面操作を頼む。
  why: 人の画面操作は往復と誤入力の元で、1 つ目があれば残りは自動化できる。理由を言えばオーナーは「次は無い」と分かる。
  check: 同じサービスで 2 回以上、人に認証情報を作らせていないか？
  see_also: [fs.L13, fs.B]
  verified: true
  source: 'launch-blueprint v0.2 field lessons, generalized 2026-11-03'
- id: fs.X4
  principle: URL を含む設定（OAuth・Webhook・ボット対策・API 制限・サイト URL）を触る前に、正式ドメインを決める。
  anti_pattern: 仮のドメインで設定を進め、本番ドメインが決まってから全部やり直す。
  why: URL の登録先は散らばっていて、1 か所の漏れが「ログインだけ壊れる」形で後から出る。
  check: 正式ドメインが「決定」になってから URL 依存の設定を始めたか？
  see_also: [fs.L02, fs.L03, rules.R-004]
  verified: true
  source: 'launch-blueprint v0.2 field lessons, generalized 2026-11-03'
- id: fs.X5
  principle: トークンやアカウントを共有するたびに、影響範囲（他に何に届くか）を書く。
  anti_pattern: 「とりあえずアカウント全体のトークン」を影響範囲を言わずに発行する。
  why: 届く範囲を書かないと、別の製品のデータを消す事故が起きても原因が追えない。
  check: 共有アカウントで発行した全トークンに影響範囲の 1 行があるか？
  see_also: [fs.L04, fs.F, dp.agent-least-privilege-keys]
  verified: true
  source: 'launch-blueprint v0.2 field lessons, generalized 2026-11-03'
- id: fs.X6
  principle: 「できた」は確認の一手（コマンド・ページ・ログ・テストリクエスト）を通してから言う。
  anti_pattern: 設定の入力やマージを、動作を確かめずに「完了」と報告する。
  why: 名前の 1 文字違い・走り終えていないチェックは、確かめない限り「値が無い」「後で壊れる」としか現れない。
  check: 直近の「できた」の報告に、確認した手段と結果が書いてあるか？
  see_also: [fs.L06, fs.L11, fs.B]
  verified: true
  source: 'launch-blueprint v0.2 field lessons, generalized 2026-11-03'
