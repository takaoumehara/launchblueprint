entries:
- id: pay.stripe-checkout
  name: Stripe Checkout / Payments
  what: 決済ページ・カード決済
  best_for: 単一販売者のサービス
  avoid_when: ''
  pricing_bands:
    free: 固定費なし、米国カード 2.9%+30¢／件、紛争 $15／件
    usd5: 固定費なし、米国カード 2.9%+30¢／件、紛争 $15／件
    usd10: 固定費なし、米国カード 2.9%+30¢／件、紛争 $15／件
    usd100: 固定費なし、米国カード 2.9%+30¢／件、紛争 $15／件
  limits: 国ごとに対応手段が違う。海外カード +1%
  lock_in: 中
  liability_compliance: チャージバックは販売者（自社）。紛争受付 $15
  security: Webhook 署名を検証
  pairs_well_with:
  - fe.nextjs
  source:
    url: https://stripe.com/pricing
    checked: '2026-10-26'
    verified: true
- id: pay.stripe-connect
  name: Stripe Connect
  what: プラットフォームが他者の売上を扱う（マーケットプレイス・SaaS）
  best_for: 主催者・出店者がいるサービス
  options:
  - id: standard
    controller: losses.payments=stripe, fees.payer=account, dashboard=full
    liability: Direct charges：接続アカウント（主催者）。Destination charges：プラットフォーム
    cost: Stripeが料金を持つ方式：プラットフォームの追加費用なし
  - id: express
    controller: losses.payments=application, fees.payer=application, dashboard=express
    liability: 紛争・不正・マイナス残高：プラットフォーム
    cost: $2/アクティブ月 ＋ 0.25%+25¢/入金
  - id: custom
    controller: + requirement_collection=application, dashboard=none
    liability: 全部プラットフォーム（KYC情報の管理も）
    cost: 同上＋大きな開発
  lock_in: 変更不可：作成後に方式（ダッシュボード種別）は変えられない。新規は Accounts v2／controller properties 推奨
  liability_compliance: 方式で責任が移る。先回りリスク調査（§7）の必須項目
  source:
  - url: https://docs.stripe.com/connect/accounts
    checked: '2026-10-26'
    verified: true
  - url: https://docs.stripe.com/connect/migrate-to-controller-properties
    checked: '2026-10-26'
    verified: true
  - url: https://stripe.com/connect/pricing
    checked: '2026-10-26'
    verified: true
- id: pay.ryft
  name: Ryft
  what: 英国発の決済（カード・Apple/Google Pay・定期課金・マーケットプレイスの分配とエスクロー）
  best_for: 英国・EU のマーケットプレイス／プラットフォーム。出店者の KYC 自動化、分割払い（Split Payments）、手数料の取り方を細かく決めたい、個別担当がほしい場合
  avoid_when: 米国中心の販売、日本向け、公開料金で即日始めたい小規模、Stripe 並みの周辺機能（Billing/Tax/Radar 等）を一式で使いたい場合
  pricing_bands:
    free: 公開料金なし。個別見積り（平均単価・決済種別で決定）。固定費の有無は要確認
    usd5: 公開料金なし。個別見積り（平均単価・決済種別で決定）。固定費の有無は要確認
    usd10: 公開料金なし。個別見積り（平均単価・決済種別で決定）。固定費の有無は要確認
    usd100: 公開料金なし。個別見積り（平均単価・決済種別で決定）。固定費の有無は要確認
  limits: 営業経由の契約（審査あり）。定期課金は日次／月次サイクル。対応国：英国＋EU 各国（公式の一覧は未確認）。米国対応は第三者ページの記載のみで未確認。通貨・入金サイクル・SDK
    言語は未確認
  lock_in: 中〜高：サブアカウント（出店者）と KYC 情報の移行が重い
  liability_compliance: FCA 規制の英国事業者（未確認）。PSD2/3DS2 対応。Sub-Account の返金・チャージバックはプラットフォームが回収可能＝最終責任の分担は契約で確認。米国NYのLLCが契約できるかは未確認（問い合わせ必須）
  security: Webhook 署名を検証。カード情報は自社サーバーに通さない（ホスト型フォーム）
  source:
  - url: https://www.ryftpay.com/pricing
    checked: '2026-10-27'
    verified: true
  - url: https://developer.ryftpay.com/documentation/overview/marketplaces
    checked: '2026-10-27'
    verified: true
  - url: https://developer.ryftpay.com/documentation/overview/payment_types/platform_fee_split_payments
    checked: '2026-10-27'
    verified: true
  - url: https://developer.ryftpay.com/documentation/get_started/initiate_payments/subscriptions
    checked: '2026-10-27'
    verified: true
  - url: https://www.gonnaorder.com/help/store-settings/payment-settings/ryft-payments/
    checked: '2026-10-27'
    verified: false
    note: 対応国（米国含む）は第三者記載
  vs_stripe: Stripe Connect の代替。強み：個別料金交渉・エスクロー・担当者。弱み：公開料金なし、周辺製品と開発者エコシステムが小さい、英国・EU
    中心
