- id: pay.venmo
  name: Venmo（Pay with Venmo / ビジネスプロフィール）
  what: 米国の個人間送金アプリ。ウェブ販売では PayPal/Braintree の決済画面の支払い方法の1つとして使う
  best_for: 米国の若い層向けに、既存の決済（Stripe・PayPal）へ追加の払い方として足す
  avoid_when: 単独の決済基盤にしたい場合・米国外の購入者がいる場合・チケット販売（在庫・QR・払い戻しの仕組みがない）
  recommendation: 単独では使わない。追加の支払い方法として足す
  pricing_bands:
    free: 'ウェブ（PayPal 経由の Pay with Venmo）3.49%+49¢。アプリ内ビジネスプロフィール 1.9%+10¢（$1超）、Tap to Pay 2.29%+9¢'
    usd5: 同左
    usd10: 同左
    usd100: 同左
  limits: 米国のみ（米国の銀行口座・電話番号）。スマホ前提でパソコンからは払いにくい。送金上限は Venmo の P2P 上限に従う
  lock_in: 低（追加手段なので外しやすい）
  liability_compliance: '個人アカウントで売上を受け取るのは規約違反（停止のおそれ）。販売にはビジネスプロフィールか PayPal 経由の統合が必要。個人アカウントで「商品・サービス」として受けると 2.99%'
  security: PayPal/Braintree の SDK とホスト型の決済画面を使い、Webhook 署名を検証
  pairs_well_with:
  - pay.paypal-braintree
  - pay.stripe-checkout
  source:
    url: https://venmo.com/resources/our-fees
    also: [https://www.paypal.com/us/business/paypal-business-fees, https://venmo.com/business/profiles]
    checked: '2026-10-27'
    verified: true
    note: 'Tap to Pay は料金表 2.29%+9¢、ビジネス紹介ページは 2.9%+9¢ と食い違い。料金表を優先'
