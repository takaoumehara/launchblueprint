<script>
const D=BP.data(),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

/* 責任の行き先は controller の文字列から決める */

const T={org:'主催者（接続アカウント）',stripe:'Stripe',app:'自社（プラットフォーム）'};
function sk(){const svg=$('sk');svg.innerHTML='';const W=svg.clientWidth||1160,H=340,o=D.options.find(x=>x.id==cur),rows=owners(o);
 const L=rows.map((r,i)=>({y:30+i*64,r})),R=Object.keys(T).map((k,i)=>({k,y:60+i*110}));
 const cnt={};rows.forEach(r=>cnt[r[1]]=(cnt[r[1]]||0)+1);const used={};
 const g=BP.el('g',{class:'rb'},svg),x1=200,x2=W-260;
 L.forEach((l,i)=>{const t=BP.el('text',{x:0,y:l.y+4},svg);t.textContent=l.r[0];BP.el('rect',{x:x1-6,y:l.y-10,width:6,height:20,class:'nd'},svg);
  const rk=R.find(r=>r.k==l.r[1]),u=used[rk.k]=(used[rk.k]||0)+1,ty=rk.y-24+u*48/(cnt[rk.k]+1),rr=BP.rng(i+7),col=rk.k=='app'?'var(--bad,oklch(.6 .19 25))':rk.k=='org'?'var(--ac)':'var(--mu)';

 document.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id==cur))}
