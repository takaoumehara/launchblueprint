      anonymous: 要確認
      passkeys: Pro 以上
      sso_saml: Pro に1接続込み、追加 $75/月
    pricing_bands:
      free: $0 Hobby：アプリごと5万MRU（登録翌日以降に戻った人だけ数える）
      usd5: —
