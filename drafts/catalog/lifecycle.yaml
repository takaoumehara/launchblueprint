how_to_read: 'status: covered=合格条件まで書いてある / thin=言及はあるが判断・合格条件・予算帯がない / missing=該当なし。evidence
  はリポジトリ内のファイルと節。priority P1=公開前に必須 / category=12カテゴリー（オーナー案 2026-10-26）。ai_caution=true
  はAIコーディング特有の注意点。acceptance はAIが機械的に確かめられる条件'
