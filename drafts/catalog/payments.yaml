  name: Stripe Checkout / Payments
  what: 決済ページ・カード決済
  best_for: 単一販売者のサービス
  avoid_when: ''
  pricing_bands:
    free: 固定費なし、米国カード 2.9%+30¢／件、紛争 $15／件
    usd5: 固定費なし、米国カード 2.9%+30¢／件、紛争 $15／件
    usd10: 固定費なし、米国カード 2.9%+30¢／件、紛争 $15／件
    usd100: 固定費なし、米国カード 2.9%+30¢／件、紛争 $15／件
  limits: 国ごとに対応手段が違う。海外カード +1%
