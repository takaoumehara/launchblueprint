  - {domain: ai_llm, catalog_id: ai.gateway, status: candidate, reason: "紹介文の下書きに使うなら", rules: []}
  - {domain: backend, catalog_id: be.route-handlers, status: selected, reason: "Next.js と同居。長い処理はない", rules: []}
  - {domain: email_notifications, catalog_id: mail.resend, status: selected, reason: "予約確認メール。無料3,000通/月で開始", rules: []}
  - {domain: monitoring, catalog_id: mon.sentry, status: selected, reason: "T2で必要。無料は1人まで、チームなら$26", rules: []}
