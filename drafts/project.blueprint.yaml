  - {domain: database, catalog_id: db.supabase, status: selected, reason: "予約は表形式のデータ。Postgresなら移行しやすい", rules: []}
  - {domain: database, catalog_id: db.firestore, status: rejected, reason: "集計とJOINが多い。読み取り課金が読めない", rules: []}
  - {domain: auth, catalog_id: auth.supabase, status: selected, reason: "DBと同じ場所、5万MAU無料。Google・メールリンク・匿名で開始", methods: [google, magic_link, anonymous], rules: []}
