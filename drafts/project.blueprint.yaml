  - {domain: payments, catalog_id: pay.stripe-connect, option: custom, status: rejected, reason: "KYC・サポートを全部自社で持つ", rules: [R-006]}
  - {domain: hosting, catalog_id: host.cloudflare-pages, status: candidate, reason: "月$5で商用可・転送料なし。Next.js の一部機能は要検証", rules: [R-012]}
  - {domain: storage_media, catalog_id: st.supabase-storage, status: selected, reason: "DBと同じ権限設定（RLS）で画像を守れる", rules: []}
  - {domain: analytics, catalog_id: an.posthog, status: selected, reason: "毎月100万イベント無料、上限で止まり課金されない", rules: [R-012]}
  - {domain: realtime, catalog_id: rt.supabase-realtime, status: selected, reason: "残席の表示だけ。無料の同時200接続で足りる", rules: []}
  - {domain: ci_cd, catalog_id: ci.vercel-git, status: selected, reason: "push でプレビュー。本番は main だけ", rules: [L30]}
  - {domain: security, catalog_id: sec.vercel-firewall, status: selected, reason: "申込と決済APIにレート制限", rules: []}
  - {domain: search, catalog_id: se.postgres-fts, status: selected, reason: "イベントは数百件。外部検索は不要", rules: []}
