# サンプル：イベント予約プラットフォーム（サンプルデータ）
project: sample-event-booking
tier: T2
catalog_version: 2026-10-26
budget_target: usd10        # 月$10帯を目標（R-012：無料は好み）
selections:
  - {domain: frontend, catalog_id: fe.nextjs, status: selected, reason: "LPと予約アプリを1つで。SEOが要る", rules: []}
  - {domain: frontend, catalog_id: fe.expo, status: rejected, reason: "Not-to-build：ネイティブアプリ", rules: []}
  - {domain: hosting, catalog_id: host.vercel, status: selected, reason: "Next.jsと相性。ただし商用なので Pro($20)が必要", rules: [R-004], budget_band: usd100}
