  if(d.id==cur)BP.el('rect',{x:x0-2,y:0,width:CWd-6,height:H,fill:'none',stroke:'var(--ac)','stroke-width':1},g);
  const t=BP.el('text',{x:x0+3,y:H-5},g);t.textContent=d.name.length>4?d.name.slice(0,4):d.name;
  d.items.forEach((it,i)=>{const cx=x0+3+R+(i%4)*G,cy=5+R+Math.floor(i/4)*G,st=it.status||'none',unv=(it.src||[]).every(s=>!s.verified);
   const c=BP.el('circle',{cx,cy,r:R,fill:st=='selected'?'var(--ac)':st=='rejected'?'var(--bad,oklch(.6 .19 25))':'none',stroke:st=='candidate'?'var(--ac)':st=='none'?'var(--mu)':'none','stroke-width':1.2,opacity:st=='none'?.45:.95},g);
   if(unv&&st=='selected')BP.el('circle',{cx,cy,r:1.3,fill:'var(--bg)'},g);
   const ti=BP.el('title',{},c);ti.textContent=`${it.name} · ${({selected:'採用',candidate:'候補',rejected:'不採用',none:'未評価'})[st]}${unv?' · 出典未確認':''}`;
   c.onclick=()=>{cur=d.id;render();open(i)}})});
 const y=H,W=C.domains.length*CWd;
svg.setAttribute('viewBox',`-2 0 ${W} ${y}`);
 const all=C.domains.flatMap(d=>d.items),n=k=>all.filter(i=>(i.status||'none')==k).length,u=all.filter(i=>(i.src||[]).every(s=>!s.verified)).length;
 $('covk').innerHTML=`<i style="background:var(--ac)"></i>採用 ${n('selected')}<i style="box-shadow:inset 0 0 0 1.2px var(--ac)"></i>候補 ${n('candidate')}<i style="box-shadow:inset 0 0 0 1.2px var(--mu);opacity:.5"></i>未評価 ${n('none')} · 出典未確認 ${u}/${all.length}（中央が抜けた点）`}
function render(){tabs();cov();const d=dom(cur);$('h').textContent=d.name;
 const sel=d.items.filter(i=>i.status=='selected');$('lead').textContent=sel.length?`採用：${sel.map(i=>i.name).join('、')}。${sel[0].reason}`:'このプロジェクトではまだ選んでいません。候補を比べてから決めます。';
 $('grid').innerHTML=d.items.map((it,i)=>{const st=status(it),pv=preview&&preview.domain==cur&&preview.map[it.id];return `<button class="card ${it.status} ${pv?(pv=='selected'?'pv-on':'pv-off'):''}" data-i="${i}">${pv=='selected'?'<span class="pv">案</span>':''}<span class="st">${L[st]}</span><h3>${esc(it.name)}</h3><p>${esc(it.what)}</p><span class="pr"><span class="num">${esc(it.bands.free)}</span><span>${esc((it.lock_in||'').split('：')[0])}</span></span></button>`}).join('');
 $('grid').querySelectorAll('.card').forEach(c=>c.onclick=()=>open(+c.dataset.i));
 $('extra').innerHTML=d.id=='auth'?matrix(d):'';
 const b=preview&&preview.domain==cur;$('banner').classList.toggle('on',!!b);if(b)$('bannerText').innerHTML=preview.text}
function matrix(d){const ms=Object.keys(d.methods),use=new Set(preview&&preview.methods||['google','magic_link','anonymous']);const JA={google:'Google',apple:'Apple',email_password:'メール＋パスワード',magic_link:'メールリンク',phone_sms:'電話SMS',anonymous:'匿名',passkeys:'パスキー',sso_saml:'SSO（会社）'};
 const ps=d.items.slice(0,6),cls=v=>/^yes/.test(v)?'y':/^no|未提供/.test(v)?'n':/要確認/.test(v)?'n':'p',sym=v=>/^yes$/.test(v)?'●':/^no|未提供/.test(v)?'—':/要確認/.test(v)?'?':esc(v.split(/[（(]/)[0]);
 return `<div class="matrix"><h2>ログイン方法 × サービス</h2><table><tr><th></th>${ps.map(p=>`<th class="${p.status=='selected'?'on':''}">${esc(p.name.replace(' Authentication','').replace(' Auth',''))}</th>`).join('')}</tr>${ms.map(m=>`<tr class="${use.has(m)?'use':''}"><td>${JA[m]}${use.has(m)?' ・使う':''}</td>${ps.map(p=>{const v=(p.support||{})[m]||'要確認';return `<td class="${p.status=='selected'?'on':''} ${cls(v)}" title="${esc(v)}">${sym(v)}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function open(i){const d=dom(cur),it=d.items[i],lit=selectedIds();
 const why=it.reason||it.best_for,src=it.src.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//,''))}</a><span class="ver ${s.verified?'t':'f'}">${s.verified?'確認 '+s.checked:'未確認'}</span>`).join('<br>');
 $('pn').innerHTML=`<button class="x" aria-label="閉じる" id="xb">✕</button><span class="tag">${L[it.status]}</span><h2 id="dh" style="margin-top:8px">${esc(it.name)}</h2><div class="why"><b>${it.status=='rejected'?'外した理由':'なぜ'}：</b>${esc(why)}</div>
 <div class="bands">${BAND.map(([k,b])=>`<div class="${k==C.project.budget_target?'on':''}"><b>${b}</b><span class="num">${esc(it.bands[k])}</span></div>`).join('')}</div>
 <dl class="kv"><dt>向いている</dt><dd>${esc(it.best_for)}</dd>${it.avoid_when?`<dt>避ける時</dt><dd>${esc(it.avoid_when)}</dd>`:''}<dt>制限</dt><dd>${esc(it.limits||'—')}</dd><dt>ロックイン</dt><dd>${esc(it.lock_in)}</dd><dt>責任・規制</dt><dd>${esc(it.liability||'—')}</dd><dt>セキュリティ</dt><dd>${esc(it.security||'—')}</dd>${it.rules.length?`<dt>ルール</dt><dd>${it.rules.join('、')}</dd>`:''}<dt>相性</dt><dd><div class="pairs">${it.pairs.length?it.pairs.map(p=>`<span class="pair ${lit.has(p)?'lit':''}">${esc(N[p]||p)}${lit.has(p)?' ・採用中':''}</span>`).join(''):'—'}</div></dd></dl>
 <table class="vs"><tr><th>同じ分野で比べる</th><th>状態</th><th>無料の帯</th></tr>${d.items.map(o=>`<tr><td>${o===it?'<b>'+esc(o.name)+'</b>':esc(o.name)}</td><td>${L[o.status]}</td><td class="num">${esc(o.bands.free)}</td></tr>`).join('')}</table>
 <p class="src">出典：<br>${src}</p>`;
 $('dr').classList.add('open');$('xb').onclick=closeD;$('xb').focus();lastCard=i}
let lastCard=0;function closeD(){$('dr').classList.remove('open');const c=$('grid').querySelector(`[data-i="${lastCard}"]`);c&&c.focus()}
$('dr').onclick=e=>{if(e.target===$('dr'))closeD()};addEventListener('keydown',e=>{if(e.key=='Escape'&&$('dr').classList.contains('open'))closeD()});
// 相談（ルールで動く試作。APIは使わない）
const RULES=[
 {re:/電話|SMS|sms|phone|ショートメ/,go(){const d=dom('auth'),s=d.items.find(i=>i.status=='selected');const sup=d.items.map(p=>`${p.name}：${(p.support||{}).phone_sms||'要確認'}`);
  preview={domain:'auth',map:{},methods:['google','magic_link','anonymous','phone_sms'],text:`案：<b>${s.name}</b> のまま、電話SMSを追加。SMS業者の契約と1通ごとの費用が増えます`};
  return {say:`${s.name} のままで電話ログインを足せます。表で「電話SMS」の行が増えました。`,list:['影響：SMS業者の契約（費用は1通ごと）、SMSを大量に送らせる詐欺（SMSポンピング）の対策','先回りリスク調査に1行追加する','各サービスの対応：'+sup.slice(0,4).join(' ／ '),'未確認：SMS業者の単価 → 公式ページで確かめてから比較カードにします'],tab:'auth'}}},
 {re:/安く|安い|cheap|節約|コスト|無料/,go(){const h=dom('hosting');const cf=h.items.find(i=>i.id=='host.cloudflare-pages'),v=h.items.find(i=>i.status=='selected');
  preview={domain:'hosting',map:{[cf.id]:'selected',[v.id]:'candidate'},text:`案：ホストを <b>${cf.name}</b> に（月$20 → $5）。Next.js の一部機能は要検証`};
  return {say:'一番効くのはホストです。他は無料枠の中に収まっています。',list:[`${v.name}：${v.bands.usd100}`,`${cf.name}：${cf.bands.usd5}`,'差額：月 約$15。R-012（無料は好み）と衝突なし','リスク：Next.js の画像最適化・ISR の動作確認が要る。移行は「作り直し」ではなく設定と検証'],tab:'hosting'}}},
 {re:/パスキー|passkey|生体|指紋|顔認証/i,go(){const d=dom('auth');preview={domain:'auth',map:{},methods:['google','magic_link','anonymous','passkeys'],text:'案：パスキーを追加。Supabase は beta、Firebase は未提供'};
  return {say:'パスキーは対応状況に差があります。',list:d.items.map(p=>`${p.name}：${(p.support||{}).passkeys||'要確認'}`),tab:'auth'}}},
 {re:/Clerk|クラーク/i,go(){const d=dom('auth'),c=d.items.find(i=>i.id=='auth.clerk'),s=d.items.find(i=>i.status=='selected');preview={domain:'auth',map:{[c.id]:'selected',[s.id]:'candidate'},text:`案：認証を <b>Clerk</b> に。UIは速いが、5万MRU超で1人 $0.02/月`};
  return {say:'Clerk にした場合の影響です。',list:[`無料：${c.bands.free}`,`有料：${c.bands.usd100}`,`避ける時：${c.avoid_when}`,'移行：ユーザーテーブルと認証UIを作り直し'],tab:'auth'}}},
 {re:/Express|エクスプレス|白ラベル|Custom/i,go(){const d=dom('payments'),e=d.items.find(i=>/express/.test(i.id));preview={domain:'payments',map:{[e.id]:'selected','pay.stripe-connect.standard':'candidate'},text:'案：Connect Express。<b>紛争・不正・マイナス残高の責任が自社に移ります</b>。作った後は変えられません'};
  return {say:'責任の所在が変わるので、先に止めて確認します。',list:[`責任：${e.liability}`,`費用：${e.bands.free}`,'後戻り：変更不可（アカウントを作り直し）','勧め：主催者が売り手のままなら Standard を維持'],tab:'payments'}}},
];
function say(cls,html){const m=document.createElement('div');m.className='m '+cls;m.innerHTML=html;$('chat').appendChild(m);$('chat').scrollTop=1e6}
function ask(t){if(!t.trim())return;say('u',esc(t));const r=RULES.find(r=>r.re.test(t));
 if(!r){say('a','この試作では「電話ログイン」「安くしたい」「パスキー」「Clerkにしたら」「Expressにしたら」に答えられます。それ以外は<b>未確認の質問</b>に入れて、調べてから比較カードにします。');return}
 const o=r.go();cur=o.tab;render();say('a',esc(o.say)+'<ul>'+o.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>')}
$('f').onsubmit=e=>{e.preventDefault();ask($('q').value);$('q').value=''};
$('chips').innerHTML=['電話番号でもログインしたい','もっと安くしたい','パスキーは使える？','Expressにしたら？'].map(t=>`<button class="chip">${t}</button>`).join('');
$('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.textContent));
$('apply').onclick=()=>{const d=dom(preview.domain);d.items.forEach(i=>{const v=preview.map[i.id];if(v)i.status=v});say('a','反映しました（この画面の中だけ）。本番では project.blueprint.yaml の status と理由を書き換え、前の選択は「不採用：オーナーが変更」として残します。');preview=null;render()};
$('undo').onclick=()=>{preview=null;render()};
const q=new URLSearchParams(location.search);
if(q.get('tab'))cur=q.get('tab');render();
say('a','このプロジェクトの採用は、いま光っているカードです。変えたい時はここに書いてください。先に影響を出します。');
if(q.get('ask'))ask(q.get('ask'));if(q.get('open')!==null)open(+q.get('open'));
</script></body></html>
