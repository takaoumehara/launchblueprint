# Part B input — evidence for the local-pro-kit project map (repo: growth.creativityiseverywhere.com; there is no repo named local-service-kit).
# Only facts from the Part B evidence brief. Paths are "<repo>/<path>"; they were not re-read in this session.
slug: local-pro-kit
name: Local Pro Kit (store, generated sites, free check)
goal: Sell and run ready-made websites and tools for local service businesses, with a free check as the entry point.
intake: {platform: web, money: paid}
production:
  state: unknown
  note: "Hosting is mid-migration from Vercel to Cloudflare Workers (docs/deploy-and-accounts.md, 2026-10-20). The store worker runs on workers.dev until the cutover; the planned host localprokit.com is not confirmed live. growth.creativityiseverywhere.com also serves this repo."
  verified: false
  evidence:
    - {kind: file, path: growth.creativityiseverywhere.com/docs/deploy-and-accounts.md, note: "migration Vercel → Cloudflare Workers, dated 2026-10-20"}
note: "Part B: facts from the repo audit brief (observed / gap); every other decision scored by decide under lean-fast-full (ai_selected = recommendation only)."
records:
  - topic: frontend
    status: observed
    pick: fe.astro
    observed_as: Astro 7 (generated customer sites + the store)
    evidence:
      - {kind: dependency, path: growth.creativityiseverywhere.com/platform/package.json, note: "astro 7"}
  - topic: hosting
    status: observed
    pick: host.cloudflare-pages
    observed_as: Cloudflare Workers (lpk-store, workers.dev until cutover); customer sites on Cloudflare Pages
    gap_note: "Mid-migration from Vercel: the root vercel.json still exists and the custom-domain cutover is not done. Which host serves each public address today is not verified."
    evidence:
      - {kind: config, path: growth.creativityiseverywhere.com/platform/store-worker/wrangler.toml, note: "name lpk-store; workers.dev until cutover"}
      - {kind: file, path: growth.creativityiseverywhere.com/docs/deploy-and-accounts.md, note: "Vercel → Cloudflare Workers migration (2026-10-20)"}
      - {kind: config, path: growth.creativityiseverywhere.com/vercel.json, note: "still present"}
  - topic: backend
    status: observed
    pick: be.cloudflare-workers
    observed_as: Store + API on Cloudflare Workers (lpk-store)
    evidence:
      - {kind: config, path: growth.creativityiseverywhere.com/platform/store-worker/wrangler.toml, note: "worker lpk-store"}
  - topic: database
    status: observed
    observed_as: Cloudflare D1 (lpk-store, lpk-ops) + KV cache
    evidence:
      - {kind: note, note: "Part B brief: D1 databases lpk-store and lpk-ops, KV cache (file not named)"}
  - topic: storage
    status: observed
    pick: st.r2
    observed_as: Cloudflare R2 (lpk-files)
    evidence:
      - {kind: note, note: "Part B brief: R2 bucket lpk-files (file not named)"}
  - topic: auth
    status: observed
    observed_as: "Own email magic links, no passwords; HttpOnly cookie lpk_session"
    evidence:
      - {kind: file, path: growth.creativityiseverywhere.com/platform/ops/src/auth.mjs, note: "magic-link sign-in, lpk_session cookie, no passwords"}
  - topic: protection
    status: observed
    pick: sec.turnstile
    observed_as: Cloudflare Turnstile (optional)
    gap_note: "Turnstile is optional; whether it is switched on in production is not stated."
    evidence:
      - {kind: note, path: growth.creativityiseverywhere.com/platform/ops/src/auth.mjs, note: "Part B brief lists optional Turnstile with the sign-in facts"}
  - topic: payments
    status: observed
    pick: pay.stripe-checkout
    verified: false
    gap_note: "Live Stripe is refused unless STRIPE_LIVE_APPROVED is set; whether a live payment has ever run is unknown."
    evidence:
      - {kind: file, path: growth.creativityiseverywhere.com/platform/server/store/stripe.mjs, note: "Stripe Checkout"}
      - {kind: config, path: growth.creativityiseverywhere.com/platform/store-worker/wrangler.toml, note: "production vars STORE_API_ENABLED=1, STORE_MOCK_CHECKOUT empty"}
  - topic: email
    status: observed
    pick: mail.resend
    gap_note: "Production vars set EMAIL_PROVIDER=resend and MESSAGING_LIVE=true, but whether RESEND_API_KEY is installed and mail actually sends is unknown; a mock outbox still exists."
    evidence:
      - {kind: config, path: growth.creativityiseverywhere.com/platform/store-worker/wrangler.toml, note: "EMAIL_PROVIDER=resend, EMAIL_FROM on localprokit.com, MESSAGING_LIVE=true"}
  - topic: analytics
    status: gap
    gap_note: "No first-party analytics library (PostHog, GA) found in the store. Cloudflare observability is on; GA appears only in customer education content."
  - topic: monitoring
    status: observed
    observed_as: Cloudflare Workers observability (on)
    evidence:
      - {kind: note, note: "Part B brief: Cloudflare observability on (file not named)"}
  - topic: ai
    status: observed
    pick: ai.direct
    observed_as: "Gemini (gemini-3.5-flash-lite) for the free check; Anthropic SDK dependency; Kie.ai for image/video"
    evidence:
      - {kind: note, note: "Part B brief: GEMINI_MODEL=gemini-3.5-flash-lite for the free check (file not named)"}
      - {kind: dependency, path: growth.creativityiseverywhere.com/platform/package.json, note: "@anthropic-ai/sdk"}
      - {kind: config, path: growth.creativityiseverywhere.com/.env.example, note: "Kie.ai keys (image/video)"}
  - topic: ci
    status: observed
    pick: ci.github-actions
    evidence:
      - {kind: config, path: growth.creativityiseverywhere.com/.github/workflows/deploy-lpk-store.yml, note: "store deploy"}
      - {kind: config, path: growth.creativityiseverywhere.com/.github/workflows/platform-foundation.yml, note: "platform checks"}
